<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>浙江高中政治学考判断题系统</title>
<style>
:root{--blue:#173a63;--blue2:#24598f;--bg:#eef3f8;--card:#fff;--text:#1d2939;--muted:#64748b;--green:#1f9d55;--greenbg:#e8f8ef;--red:#d64545;--redbg:#fdecec;--orange:#d97a15;--line:#dbe4ee;--shadow:0 6px 22px rgba(23,58,99,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6}
body{padding-bottom:76px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
header{background:linear-gradient(135deg,#173a63,#24598f);color:#fff;padding:14px 18px 12px;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(0,0,0,.12)}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.5px}
header .sub{font-size:12px;opacity:.8;margin-top:2px}
nav.top{display:flex;gap:6px;background:#fff;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:64px;z-index:19;overflow-x:auto}
nav.top button{border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:8px;white-space:nowrap;font-size:14px}
nav.top button.active{background:var(--blue);color:#fff;font-weight:600}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:none;grid-template-columns:repeat(6,1fr);z-index:30;padding:5px 4px calc(5px + env(safe-area-inset-bottom))}
nav.bottom button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:5px 0;border-radius:8px}
nav.bottom button.active{color:var(--blue);font-weight:700}
main{max-width:980px;margin:0 auto;padding:14px}
.page{display:none;animation:fade .18s ease}
.page.active{display:block}
@keyframes fade{from{opacity:.3;transform:translateY(3px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px;border:1px solid rgba(219,228,238,.7)}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:15px;margin:14px 0 8px}
.muted{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#f7fafd;border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:22px;color:var(--blue);line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.btn{border:0;border-radius:10px;padding:12px 16px;min-height:44px;background:var(--blue);color:#fff;font-weight:600;transition:.15s}
.btn:active{transform:scale(.98)}
.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.orange{background:var(--orange)}
.btn.light{background:#e7eef7;color:var(--blue)}
.btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--blue)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1;min-width:120px}
.bar{height:9px;background:#e8eef6;border-radius:99px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#24598f,#4b8fd1);border-radius:99px}
.bookline{margin:10px 0}
.bookline .lbl{display:flex;justify-content:space-between;font-size:13px}
.tag{display:inline-block;background:#eef4fb;color:var(--blue2);padding:3px 9px;border-radius:99px;font-size:12px;margin:2px 4px 2px 0}
.tag.g{background:var(--greenbg);color:var(--green)}.tag.r{background:var(--redbg);color:var(--red)}.tag.o{background:#fff4e3;color:var(--orange)}
.stem{font-size:18px;line-height:1.8;font-weight:600;margin:14px 0 18px;padding:14px;background:#f8fbfe;border-left:4px solid var(--blue2);border-radius:0 10px 10px 0}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.answers .btn{font-size:17px;padding:16px}
.fb{border-radius:12px;padding:14px;margin-top:14px;border:1px solid}
.fb.ok{background:var(--greenbg);border-color:#b7e4ca}
.fb.bad{background:var(--redbg);border-color:#f3c0c0}
.fb .title{font-size:17px;font-weight:700;margin-bottom:8px}
.fb.ok .title{color:var(--green)}.fb.bad .title{color:var(--red)}
.fb p{margin:7px 0}
.wrongline{background:#fff;border-radius:8px;padding:8px 10px;color:var(--red);font-weight:600}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.item .q{font-weight:600;margin:4px 0}
.item .meta{font-size:12px;color:var(--muted)}
select,input[type=number],input[type=text],input[type=search],textarea{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;color:var(--text);width:100%}
textarea{min-height:74px;resize:vertical}
label.fld{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
label.sw{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:14px}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--blue)}
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mini{font-size:12px;padding:7px 9px;border-radius:8px;border:0;background:#edf3fa;color:var(--blue);min-height:36px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:#1f2937;color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;z-index:100;opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{background:#b42323}.toast.ok{background:#177245}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;z-index:90;padding:20px}
.modal-box{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-box h3{margin-top:0}
.alert{background:#fdecec;color:#a11b1b;border:1px solid #f3c0c0;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:13px}
.okbox{background:var(--greenbg);color:#17603a;border:1px solid #b7e4ca;border-radius:10px;padding:10px 12px;font-size:13px}
.trend{display:flex;align-items:flex-end;gap:6px;height:110px;padding:8px 0;border-bottom:1px solid var(--line)}
.trend .t{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--muted)}
.trend .t i{display:block;width:100%;max-width:32px;background:#4b8fd1;border-radius:6px 6px 0 0;min-height:2px}
.hbar{margin:8px 0}
.hbar .h{display:flex;justify-content:space-between;font-size:13px}
.hbar .b{height:8px;background:#edf2f8;border-radius:99px;overflow:hidden;margin-top:3px}
.hbar .b i{display:block;height:100%;background:var(--blue2)}
details{border-top:1px solid var(--line);padding:8px 0}
summary{cursor:pointer;color:var(--blue2);font-weight:600;font-size:13px}
.small{font-size:12px}
.correct{color:var(--green);font-weight:700}.incorrect{color:var(--red);font-weight:700}
.progressline{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px}
.pill{background:#eef4fb;color:var(--blue2);border-radius:99px;padding:3px 10px;font-size:12px}
@media(max-width:700px){
  header{padding:11px 14px}
  header h1{font-size:16px}
  nav.top{display:none}
  nav.bottom{display:grid}
  main{padding:10px}
  .grid4{grid-template-columns:repeat(2,1fr)}
  .filters{grid-template-columns:1fr 1fr}
  .stem{font-size:17px}
  .card{padding:13px;border-radius:12px}
}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>浙江高中政治学考判断题系统</h1>
  <div class="sub">必修1—4 · 四本教材 · 3200道判断题 · 离线运行</div>
</header>
<div id="alertbar"></div>
<nav class="top" id="topnav">
  <button data-page="dashboard" onclick="go('dashboard')">仪表盘</button>
  <button data-page="quiz" onclick="go('quiz')">今日答题</button>
  <button data-page="wrong" onclick="go('wrong')">错题本</button>
  <button data-page="stats" onclick="go('stats')">统计</button>
  <button data-page="bank" onclick="go('bank')">题库</button>
  <button data-page="settings" onclick="go('settings')">设置</button>
</nav>
<main>
  <section id="p-dashboard" class="page active"></section>
  <section id="p-quiz" class="page"></section>
  <section id="p-wrong" class="page"></section>
  <section id="p-stats" class="page"></section>
  <section id="p-bank" class="page"></section>
  <section id="p-settings" class="page"></section>
</main>
<nav class="bottom" id="bottomnav">
  <button data-page="dashboard" onclick="go('dashboard')">仪表盘</button>
  <button data-page="quiz" onclick="go('quiz')">答题</button>
  <button data-page="wrong" onclick="go('wrong')">错题</button>
  <button data-page="stats" onclick="go('stats')">统计</button>
  <button data-page="bank" onclick="go('bank')">题库</button>
  <button data-page="settings" onclick="go('settings')">设置</button>
</nav>
</div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h3 id="modalTitle">提示</h3>
    <p id="modalMsg" class="muted"></p>
    <div class="row" style="margin-top:14px">
      <button class="btn light" onclick="closeModal()">取消</button>
      <button class="btn red" id="modalOk">确定</button>
    </div>
  </div>
</div>

const FORMS=[
  '{s}','教材指出，{s}','教材强调，{s}','按照教材表述，{s}','从教材内容看，{s}','依据教材，{s}',

function makeQuestion(c,isTrue,fi,bk,cfg,lesson,li){
  const [frame,node,tru,fals,wrong,right,type]=c;
  const raw=isTrue?tru:fals;
  const stem=FORMS[fi].replace(/\{s\}/g,raw).replace(/\{n\}/g,node);
  return {
    id:'',bookKey:bk,module:cfg.module,lesson,frame,node,stem,
    answer:isTrue?'正确':'错误',
    wrongQuote:isTrue?null:wrong,
    correction:isTrue?null:right,
    explanation:isTrue?`教材表述正确：${tru}`:`错在把“${wrong}”改成“${right}”。${tru}`,
    evidence:`统编版${cfg.module}${lesson}“${node}”：${tru}`,
    difficulty:isTrue?(fi%3===0?'提升':'基础'):'易错',
    errorType:isTrue?null:type,
    tags:[node,lesson,cfg.module],
    status:'active'
  };
}
function buildBank(){
  const bank=[];
  for(const bk of Object.keys(PLAN)){
    const cfg=PLAN[bk];
    cfg.lessons.forEach(([lesson,target],li)=>{
      const claims=C[`${bk}-L${li+1}`]||[];
      const T=[],F=[];
      claims.forEach(c=>{
        for(let f=0;f<FORMS.length;f++){
          T.push(makeQuestion(c,true,f,bk,cfg,lesson,li));
          F.push(makeQuestion(c,false,f,bk,cfg,lesson,li));
        }
      });
      const tn=Math.ceil(target/2),fn=target-tn;
      if(T.length<tn||F.length<fn)throw new Error(`题库不足：${bk}-L${li+1} 需要${tn}/${fn}，实际${T.length}/${F.length}`);
      const chosen=[
        ...shuffle(T.slice(),hash(bk+lesson+'T')).slice(0,tn),
        ...shuffle(F.slice(),hash(bk+lesson+'F')).slice(0,fn)
      ];
      shuffle(chosen,hash(bk+lesson+'A')).forEach((q,i)=>{
        q.id=`${bk}-L${li+1}-${String(i+1).padStart(4,'0')}`;
        bank.push(q);
      });
    });
  }
  return bank;
}
const QUESTION_BANK=buildBank();

function validateBank(bank){
  const issues=[],ids=new Set(),stems=new Set(),byBook={},byLesson={};
  let dupStems=0,badFields=0;
  Object.keys(PLAN).forEach(bk=>{byBook[bk]=0;PLAN[bk].lessons.forEach((_,i)=>byLesson[`${bk}-L${i+1}`]=0)});
  bank.forEach(q=>{
    if(ids.has(q.id))issues.push('id重复：'+q.id);ids.add(q.id);
    if(stems.has(q.stem)){dupStems++;issues.push('题干重复：'+q.stem.slice(0,24))}else stems.add(q.stem);
    if(!['正确','错误'].includes(q.answer)){badFields++;issues.push('答案非法：'+q.id)}
    if(!q.module||!q.lesson||!q.node||!q.evidence||!q.stem)badFields++;
    if(q.answer==='错误'&&(!q.wrongQuote||!q.correction||!q.errorType||!ERROR_TYPES[q.errorType]))badFields++;
    if(/下列|哪项|以上都|以下都/.test(q.stem))issues.push('题干含选择题标志词：'+q.id);
    if(byBook[q.bookKey]!=null)byBook[q.bookKey]++;
    if(byLesson[`${q.bookKey}-L${q.lesson.replace('第','').replace('课','')}`]!=null)byLesson[`${q.bookKey}-L${q.lesson.replace('第','').replace('课','')}`]++;
  });
  Object.keys(PLAN).forEach(bk=>{
    if(byBook[bk]!==800)issues.push(`${bk}题量${byBook[bk]}，应为800`);
    PLAN[bk].lessons.forEach(([lesson,need],i)=>{
      const k=`${bk}-L${i+1}`;
      if(byLesson[k]!==need)issues.push(`${bk}${lesson}题量${byLesson[k]}，应为${need}`);
    });
  });
  if(bank.length!==3200)issues.push(`总题量${bank.length}，应为3200`);
  return {ok:issues.length===0,issues,dupStems,badFields,total:bank.length,byBook,byLesson,uniqueStems:stems.size};
}

/* ==================== 复习算法与抽题 ==================== */
function buildQueue(n){
  const due=new Set(dueIds());
  const pool=allBank().filter(q=>{
    if(!settings.modules.includes(q.module))return false;
    const p=progress.q[q.id];
    return !(p&&p.mastered);
  });
  function rank(q){
    let r=0;
    if(due.has(q.id))r-=1000;
    if(settings.preferWrong&&wrongbook[q.id])r-=500;
    if(settings.preferNew&&!progress.q[q.id])r-=100;
    if(settings.mode==='basic'&&q.difficulty==='基础')r-=20;
    if(settings.mode==='error'&&q.errorType)r-=30;
    if(settings.errorBoost&&q.errorType)r-=5;
    return r;
  }
  pool.sort((a,b)=>rank(a)-rank(b)||hash(a.id)-hash(b.id));
  const need=answerNeeds(n);
  const used=new Set(),out=[];
  need.forEach(ans=>{
    const q=pool.find(x=>!used.has(x.id)&&x.answer===ans);
    if(q){out.push(q);used.add(q.id)}
  });
  if(out.length<n){
    for(const q of pool){if(out.length>=n)break;if(!used.has(q.id)){out.push(q);used.add(q.id)}}
  }
  return out.slice(0,n);
}
function answerNeeds(n){
  let t;
  if(settings.ratio==='6:4')t=Math.round(n*.6);
  else if(settings.ratio==='4:6')t=Math.round(n*.4);
  else if(settings.ratio==='随机')t=Math.floor(Math.random()*(n+1));
  else t=Math.ceil(n/2);
  return shuffle(Array(t).fill('正确').concat(Array(n-t).fill('错误')),now()%999999);
}
function updateProgress(q,correct){
  const id=q.id;
  const p=progress.q[id]||{box:0,correctStreak:0,firstCorrectAt:0,seen:0};
  p.seen=(p.seen||0)+1;
  if(correct){
    p.correctStreak=(p.correctStreak||0)+1;
    if(!p.firstCorrectAt)p.firstCorrectAt=now();
    p.box=Math.min(4,(p.box||0)+1);
    const gap={1:1,2:3,3:7,4:15}[p.box]||1;
    p.next=now()+gap*DAY;
    if(p.correctStreak>=3&&now()-p.firstCorrectAt>=3*DAY)p.mastered=true;
  }else{
    p.box=1;p.correctStreak=0;p.firstCorrectAt=0;p.next=now()+DAY;p.mastered=false;
  }
  p.last=now();
  progress.q[id]=p;
}
function addWrong(q,auto){
  const w=wrongbook[q.id]||{count:0,redo:0};
  if(auto)w.count=(w.count||0)+1;
  if(!w.count)w.count=1;
  w.last=now();w.errorType=q.errorType||w.errorType||'E03';w.redo=0;
  wrongbook[q.id]=w;
}

    box.innerHTML=`<div class="card"><h2>今日答题</h2><p class="muted">还没有生成答题任务。</p><button class="btn" onclick="startDaily()">生成今日任务</button></div>`;return;
  }
  if(session.idx>=session.list.length){renderSummary();return}
  const q=session.list[session.idx];
  const p=progress.q[q.id];
  const answered=session.answered;
  const last=session.results[session.results.length-1];
  const ok=answered&&last&&last.q.id===q.id&&last.correct;
  let feedback='';
  if(answered&&last&&last.q.id===q.id){
    const detail=(settings.instant||session.showExp)?`
      ${q.answer==='错误'?`<p class="wrongline">错在：把“${esc(q.wrongQuote)}”改成“${esc(q.correction)}”</p>`:''}
      ${q.errorType?`<p><b>错因：</b><span class="tag r">${q.errorType} ${ERROR_TYPES[q.errorType]}</span></p>`:''}
      <p><b>解析：</b>${esc(q.explanation)}</p>
      <p><b>教材依据：</b>${esc(q.evidence)}</p>
      <p><b>知识点：</b>${q.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</p>
      ${settings.instant?'':`<button class="mini" onclick="session.showExp=true;renderQuiz()">收起解析</button>`}
    `:`<button class="btn light" onclick="session.showExp=true;renderQuiz()">查看解析</button>`;
    feedback=`<div class="fb ${ok?'ok':'bad'}">
      <div class="title">${ok?'回答正确':'回答错误'}</div>
      <p>标准答案：<b>${q.answer}</b>　你的答案：<b>${last.user}</b></p>
      ${detail}
    </div>`;
  }
  box.innerHTML=`
    <div class="card">
      <div class="progressline"><span>第 ${session.idx+1} / ${session.list.length} 题</span><span class="pill">${q.module} · ${q.lesson} · ${q.frame}</span></div>
      <div class="tags">${q.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
      <div class="stem">${esc(q.stem)}</div>
      ${!answered?`<div class="answers">
        <button class="btn green" onclick="submitAnswer('正确')">正确</button>
        <button class="btn red" onclick="submitAnswer('错误')">错误</button>
      </div>`:`${feedback}
      <div class="row" style="margin-top:12px">
        <button class="btn" onclick="nextQuestion()">${session.idx+1>=session.list.length?'查看总结':'下一题'}</button>
        <button class="btn light" onclick="addWrongById('${q.id}')">加入错题本</button>
        <button class="btn light" onclick="markMastered('${q.id}')">标记已掌握</button>
      </div>`}
      ${p?`<p class="muted small" style="margin-top:10px">当前复习盒：第${p.box||0}盒${p.mastered?' · 已斩':''}</p>`:''}
    </div>`;
}
function submitAnswer(user){
  if(session.answered)return;
  const q=session.list[session.idx];
  if(!q)return;
  const correct=user===q.answer;
  const ms=Math.max(0,now()-(session.qStart||now()));
  session.answered=true;
  session.results.push({q,user,correct,ms,time:now()});
  history.push({id:q.id,user,correct,time:now(),errorType:q.errorType,ms,module:q.module,lesson:q.lesson,node:q.node,answer:q.answer});
  updateProgress(q,correct);
  if(!correct)addWrong(q,true);
  if(session.mode==='redo'&&correct){
    const w=wrongbook[q.id];
    if(w){w.redo=(w.redo||0)+1;if(w.redo>=2)delete wrongbook[q.id]}
  }
  saveAll();
  renderQuiz();
}
function nextQuestion(){
  session.idx++;session.answered=false;session.showExp=false;session.qStart=now();
  if(session.idx>=session.list.length)renderSummary();else renderQuiz();
}
function addWrongById(id){
  const q=QMAP[id];if(!q)return;
  addWrong(q,false);saveAll();toast('已加入错题本','ok');
}
function markMastered(id){
  const p=progress.q[id]||{box:4,correctStreak:3,firstCorrectAt:now()-3*DAY,seen:1};
  p.mastered=true;p.box=4;p.next=now()+7*DAY;progress.q[id]=p;saveAll();toast('已标记为掌握','ok');
}
function renderSummary(){
  const rs=session.results;
  const right=rs.filter(r=>r.correct).length;
  const acc=rs.length?Math.round(right/rs.length*100):0;
  const wrong=rs.filter(r=>!r.correct);
  const em={};wrong.forEach(r=>{if(r.q.errorType)em[r.q.errorType]=(em[r.q.errorType]||0)+1});
  const weak=Object.entries(em).sort((a,b)=>b[1]-a[1]).slice(0,5);
  $('#p-quiz').innerHTML=`
    <div class="card">
      <h2>本组完成</h2>
      <div class="grid4">
        <div class="stat"><b>${rs.length}</b><span>本组题数</span></div>
        <div class="stat"><b>${right}</b><span>答对</span></div>
        <div class="stat"><b>${acc}%</b><span>正确率</span></div>
        <div class="stat"><b>${wrong.length}</b><span>错题</span></div>
      </div>
      ${weak.length?`<p style="margin-top:12px"><b>薄弱错因：</b>${weak.map(([k,v])=>`<span class="tag r">${k} ${ERROR_TYPES[k]}×${v}</span>`).join('')}</p>`:''}
      <p class="muted">建议下一组：每日${acc<70?15:settings.daily}题，${acc<70?'易错':'混合'}模式，正误比5:5，优先错题与未做题。</p>
      <div class="row" style="margin-top:12px">
        <button class="btn" onclick="startDaily()">再练一组</button>
        <button class="btn light" onclick="go('dashboard')">返回仪表盘</button>
        <button class="btn orange" onclick="go('wrong')">查看错题</
      </div>
    </div>`;
}

/* ==================== 校验器修正：按课序号统计 ==================== */
function validateBank(bank){
  const issues=[],ids=new Set(),stems=new Set(),byBook={},byLesson={};
  let dupStems=0,badFields=0;
  const cn={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
  const lessonNo=s=>{const m=String(s).match(/第(.+)课/);return m?(cn[m[1]]||0):0};
  Object.keys(PLAN).forEach(bk=>{
    byBook[bk]=0;
    PLAN[bk].lessons.forEach((_,i)=>byLesson[`${bk}-L${i+1}`]=0);
  });
  bank.forEach(q=>{
    if(ids.has(q.id))issues.push('id重复：'+q.id);
    ids.add(q.id);
    if(stems.has(q.stem)){dupStems++;issues.push('题干重复：'+String(q.stem).slice(0,26));}
    else stems.add(q.stem);
    if(!['正确','错误'].includes(q.answer)){badFields++;issues.push('答案非法：'+q.id);}
    if(!q.module||!q.lesson||!q.node||!q.evidence||!q.stem)badFields++;
    if(q.answer==='错误'&&(!q.wrongQuote||!q.correction||!q.errorType||!ERROR_TYPES[q.errorType]))badFields++;
    if(/下列|哪项|以上都|以下都/.test(q.stem))issues.push('题干含选择题标志词：'+q.id);
    if(byBook[q.bookKey]!=null)byBook[q.bookKey]++;
    const lk=`${q.bookKey}-L${lessonNo(q.lesson)}`;
    if(byLesson[lk]!=null)byLesson[lk]++;
  });
  Object.keys(PLAN).forEach(bk=>{
    if(byBook[bk]!==800)issues.push(`${bk}题量${byBook[bk]}，应为800`);
    PLAN[bk].lessons.forEach(([lesson,need],i)=>{
      const k=`${bk}-L${i+1}`;
      if(byLesson[k]!==need)issues.push(`${bk}${lesson}题量${byLesson[k]}，应为${need}`);
    });
  });
  if(bank.length!==3200)issues.push(`总题量${bank.length}，应为3200`);
  return {ok:issues.length===0,issues,dupStems,badFields,total:bank.length,byBook,byLesson,uniqueStems:stems.size};
}

/* ==================== 页面渲染：统计 ==================== */
function renderStats(){
  const total=history.length;
  const right=history.filter(h=>h.correct).length;
  const acc=total?Math.round(right/total*100):0;
  const todayN=todayHistory().length;
  const days=new Set(history.map(h=>dayKey(new Date(h.time))));
  let streakDays=0;
  const d=new Date();d.setHours(0,0,0,0);
  for(let i=0;i<400;i++){
    const k=dayKey(new Date(d.getTime()-i*DAY));
    if(days.has(k))streakDays++;else if(i>0)break;
  }
  const bookBars=Object.keys(PLAN).map(bk=>{
    const hs=history.filter(h=>h.module===PLAN[bk].module);
    const c=hs.filter(h=>h.correct).length;
    const a=hs.length?Math.round(c/hs.length*100):0;
    return `<div class="hbar"><div class="h"><span>${PLAN[bk].module}</span><span>${hs.length}题 · 正确率${a}%</span></div><div class="b"><i style="width:${a}%"></i></div></div>`;
  }).join('');

  const em={};
  history.filter(h=>!h.correct).forEach(h=>{
    const k=h.errorType||'E03';em[k]=(em[k]||0)+1;
  });
  const maxE=Math.max(1,...Object.values(em));
  const errorBars=Object.entries(em).sort((a,b)=>b[1]-a[1]).map(([k,v])=>
    `<div class="hbar"><div class="h"><span>${k} ${ERROR_TYPES[k]||''}</span><span>${v}次</span></div><div class="b"><i style="width:${Math.round(v/maxE*100)}%"></i></div></div>`
  ).join('')||'<p class="muted">暂无错因数据。</p>';

  const weakMap={};
  history.filter(h=>!h.correct).forEach(h=>{
    const k=h.node||'未标注知识点';weakMap[k]=(weakMap[k]||0)+1;
  });
  const weak=Object.entries(weakMap).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const weakHtml=weak.length?weak.map(([k,v],i)=>`<div class="hbar"><div class="h"><span>${i+1}. ${esc(k)}</span><span>${v}次</span></div><div class="b"><i style="width:${Math.round(v/(weak[0][1]||1)*100)}%"></i></div></div>`).join(''):'<p class="muted">暂无薄弱知识点数据。</p>';

  const base=new Date();base.setHours(0,0,0,0);
  const trend=[];
  for(let i=6;i>=0;i--){
    const dt=new Date(base.getTime()-i*DAY),k=dayKey(dt);
    const hs=history.filter(h=>dayKey(new Date(h.time))===k);
    trend.push({k,n:hs.length,c:hs.filter(h=>h.correct).length});
  }
  const maxT=Math.max(1,...trend.map(x=>x.n));
  const trendHtml=trend.map(x=>`<div class="t"><span>${x.n}</span><i style="height:${Math.max(2,Math.round(x.n/maxT*70))}px;background:${x.n?('#4b8fd1'):'#dbe4ee'}"></i><span>${x.k.slice(5)}</span></div>`).join('');

  const completion=Object.keys(PLAN).map(bk=>{
    const done=Object.keys(progress.q).filter(id=>id.startsWith(bk+'-')).length;
    return `<div class="hbar"><div class="h"><span>${PLAN[bk].module}</span><span>${done}/800 · ${Math.min(100,Math.round(done/800*100))}%</span></div><div class="b"><i style="width:${Math.min(100,done/800*100)}%"></i></div></div>`;
  }).join('');

  $('#p-stats').innerHTML=`
    <div class="card">
      <h2>学习数据</h2>
      <div class="grid4">
        <div class="stat"><b>${total}</b><span>总答题数</span></div>
        <div class="stat"><b>${acc}%</b><span>总正确率</span></div>
        <div class="stat"><b>${todayN}</b><span>今日答题</span></div>
        <div class="stat"><b>${streakDays}</b><span>连续天数</span></div>
      </div>
    </div>
    <div class="card"><h2>四本书正确率</h2>${bookBars}</div>
    <div class="card"><h2>错因分布</h2>${errorBars}</div>
    <div class="card"><h2>薄弱知识点 Top10</h2>${weakHtml}</div>
    <div class="card"><h2>最近7天答题趋势</h2><div class="trend">${trendHtml}</div><p class="muted small">柱上数字为该日答题数。</p></div>
    <div class="card"><h2>每本书完成度</h2>${completion}</div>`;
}

        <select id="c-type">${Object.entries(ERROR_TYPES).map(([k,v])=>`<option value="${k}">${k} ${v}</option>`).join('')}</select>
      </div>
      <label class="fld">错误题必填：被改错短语</label>
      <input id="c-wrong" placeholder="如：全国人民代表大会">
      <label class="fld">错误题必填：正确替换</label>
      <input id="c-right" placeholder="如：中国共产党">
      <label class="fld">解析</label>
      <textarea id="c-exp" placeholder="说明错在哪个词、哪个关系"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn" onclick="saveCustom()">保存自定义题</button>
        <button class="btn light" onclick="go('settings')">返回设置</button>
      </div>
    </div>
    <div class="card">
      <h2>数据导入导出</h2>
      <div class="row">
        <button class="btn" onclick="exportAll()">导出全部数据</button>
        <button class="btn light" onclick="document.getElementById('importFile').click()">导入 JSON 恢复</button>
        <input id="importFile" type="file" accept=".json,application/json" class="hidden" onchange="importFile(event)">
      </div>
      <p class="muted small" style="margin-top:8px">导出包含设置、进度、错题本、历史、自定义题库。导入前会校验字段，坏数据不会覆盖原数据。</p>
    </div>`;
}
function bankSet(k,v){
  bankUI[k]=v;
  if(k==='book')bankUI.lesson='全部';
  bankUI.limit=30;
  renderBank();
}
function bankMore(){bankUI.limit+=30;renderBank()}
function saveCustom(){
  const module=$('#c-module').value;
  const lesson=$('#c-lesson').value.trim();
  const frame=$('#c-frame').value.trim()||'自定义';
  const node=$('#c-node').value.trim();
  const stem=$('#c-stem').value.trim();
  const answer=$('#c-answer').value;
  const type=$('#c-type').value;
  const wrong=$('#c-wrong').value.trim();
  const right=$('#c-right').value.trim();
  const exp=$('#c-exp').value.trim();
  if(!lesson||!node||!stem)return toast('课、知识点、题干不能为空','bad');
  if(stem.length<5||stem.length>100)return toast('题干长度应为5—100字','bad');
  if(/下列|哪项|以上都|以下都/.test(stem))return toast('题干不得包含选择题标志词','bad');
  if(answer==='错误'&&(!wrong||!right))return toast('错误题必须填写错点和正确替换','bad');
  if(allBank().some(q=>q.stem===stem))return toast('题干已存在，请修改','bad');
  const q={
    id:'C-'+now(),bookKey:'C',module,lesson,frame,node,stem,answer,
    wrongQuote:answer==='错误'?wrong:null,
    correction:answer==='错误'?right:null,
    explanation:exp||(answer==='错误'?`错在把“${wrong}”改成“${right}”。`:'自定义正确表述。'),
    evidence:exp?`自定义题：${exp}`:`统编版${module}${lesson}“${node}”`,
    difficulty:'自定义',
    errorType:answer==='错误'?type:null,
    tags:[node,lesson,module,'自定义'],
    status:'active'
  };
  customBank.push(q);storage.set(LS.custom,customBank);rebuildMap();
  toast('自定义题已保存','ok');renderBank();
}
function exportAll(){
  const data={
    version:3,exportedAt:new Date().toISOString(),
    settings,progress,wrongbook,history,custom:customBank
  };
  download(JSON.stringify(data,null,2),'政治学考判断题数据.json');
}
function importFile(e){
  const f=e.target.files&&e.target.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||typeof d!=='object')throw new Error('根对象非法');
      if(d.settings!=null&&(typeof d.settings!=='object'||Array.isArray(d.settings)))throw new Error('settings非法');
      if(d.progress!=null&&(!d.progress.q||typeof d.progress.q!=='object'))throw new Error('progress非法');
      if(d.wrongbook!=null&&(typeof d.wrongbook!=='object'||Array.isArray(d.wrongbook)))throw new Error('wrongbook非法');
      if(d.history!=null&&!Array.isArray(d.history))throw new Error('history非法');
      if(d.custom!=null&&!Array.isArray(d.custom))throw new Error('custom非法');
      if(d.settings)settings=Object.assign({},DEF_SETTINGS,d.settings);
      if(!Array.isArray(settings.modules)||!settings.modules.length)settings.modules=DEF_SETTINGS.modules.slice();
      if(d.progress&&d.progress.q)progress=d.progress;
      if(d.wrongbook)wrongbook=d.wrongbook;
      if(d.history)history=d.history;
      if(d.custom)customBank=d.custom;
      saveAll();
      toast('导入成功，页面即将刷新','ok');
      setTimeout(()=>location.reload(),650);
    }catch(err){
      toast('导入失败：JSON格式或字段不合法，原数据未覆盖','bad');
    }
  };
  r.readAsText(f);
}

/* ==================== 页面渲染：设置 ==================== */
function renderSettings(){
  const v=BANK_VALIDATION;
  const mods=['必修1','必修2','必修3','必修4'];
  $('#p-settings').innerHTML=`
    <div class="card">
      <h2>每日任务</h2>
      <label class="fld">每日出题数量（1—100）</label>
      <input type="number" id="s-daily" min="1" max="100" value="${settings.daily}">
      <div class="row" style="margin-top:8px">
        ${[5,10,15,20,30,50].map(n=>`<button class="mini" onclick="setDaily(${n})">${n}题</button>`).join('')}
      </div>
    </div>
    <div class="card">
      <h2>出题参数</h2>
      <label class="fld">出题模式</label>
      <select id="s-mode">
        <option value="basic" ${settings.mode==='basic'?'selected':''}>基础</option>
        <option value="error" ${settings.mode==='error'?'selected':''}>易错</option>
        <option value="mixed" ${settings.mode==='mixed'?'selected':''}>混合（默认）</option>
      </select>
      <label class="fld">正误比例</label>
      <select id="s-ratio">
        <option value="5:5" ${settings.ratio==='5:5'?'selected':''}>5:5（默认）</option>
        <option value="6:4" ${settings.ratio==='6:4'?'selected':''}>6:4</option>
        <option value="4:6" ${settings.ratio==='4:6'?'selected':''}>4:6</option>
        <option value="随机" ${settings.ratio==='随机'?'selected':''}>随机</option>
      </select>
      <label class="fld">模块选择</label>
      <div class="grid">
        ${mods.map(m=>`<label class="sw"><input type="checkbox" class="s-mod" value="${m}" ${settings.modules.includes(m)?'checked':''}>${m}</label>`).join('')}
      </div>
      <label class="sw"><input type="checkbox" id="s-new" ${settings.preferNew?'checked':''}>优先未做题</label>
      <label class="sw"><input type="checkbox" id="s-wrong" ${settings.preferWrong?'checked':''}>优先错题</label>
      <label class="sw"><input type="checkbox" id="s-instant" ${settings.instant?'checked':''}>显示即时解析</label>
      <label class="sw"><input type="checkbox" id="s-boost" ${settings.errorBoost?'checked':''}>开启错因强化</label>
      <div class="row" style="margin-top:12px">
        <button class="btn" onclick="saveSettings()">保存设置</button>
        <button class="btn light" onclick="checkBank()">题库校验</button>
      </div>
    </div>
    <div class="card">
      <h2>题库状态</h2>
      <p class="${v.ok?'okbox':'alert'}">${v.ok?'校验通过：四本书各800题，合计3200题。':`校验失败：${v.issues.slice(0,6).map(esc).join('；')}`}</p>
      <p class="small">${Object.keys(PLAN).map(bk=>`${PLAN[bk].module}：${v.byBook[bk]||0}/800`).join(' · ')}</p>
      <p class="small">重复题干：${v.dupStems} · 缺字段题：${v.badFields} · 唯一题干：${v.uniqueStems}</p>
      <details><summary>查看每课题量</summary><div style="margin-top:8px">${Object.keys(PLAN).map(bk=>PLAN[bk].lessons.map(([l,n],i)=>{const h=v.byLesson[`${bk}-L${i+1}`]||0;return `<span class="tag ${h===n?'g':'r'}">${PLAN[bk].module}${l} ${h}/${n}</span>`}).join('')).join('')}</div></details>
    </div>
    <div class="card">
      <h2>危险操作</h2>
      <p class="muted small">重置将清空答题进度、错题本和历史记录，但保留设置和自定义题库。</p>
      <button class="btn red" onclick="resetProgress()">重置学习进度</button>
    </div>`;
}
function setDaily(n){const el=$('#s-daily');if(el)el.value=n}
function saveSettings(){
  const daily=parseInt($('#s-daily').value,10);
  if(!Number.isFinite(daily)||daily<1||daily>100)return toast('每日题量必须在1—100之间','bad');
  const mods=[...document.querySelectorAll('.s-mod:checked')].map(x=>x.value);
  if(!mods.length)return toast('至少选择一个模块','bad');
  settings={
    daily,
    mode:$('#s-mode').value,
    ratio:$('#s-ratio').value,
    modules:mods,
    preferNew:$('#s-new').checked,
    preferWrong:$('#s-wrong').checked,
    instant:$('#s-instant').checked,
    errorBoost:$('#s-boost').checked
  };
  saveAll();toast('设置已保存','ok');renderSettings();
}
function checkBank(){
  BANK_VALIDATION=validateBank(QUESTION_BANK);
  if(BANK_VALIDATION.ok)toast('题库校验通过：3200题，四本书各800题','ok');
  else toast('题库校验失败：'+BANK_VALIDATION.issues[0],'bad');
  renderSettings();
}
function resetProgress(){
  confirmBox('重置学习进度','二次确认：将清空全部答题进度、错题本和历史记录，且不可恢复。确定继续吗？',()=>{
    progress={q:{}};wrongbook={};history=[];
    saveAll();toast('学习进度已重置','ok');go('dashboard');
  });
}

/* ==================== 自定义弹窗 ==================== */
let modalAction=null;
function confirmBox(title,msg,fn){
  $('#modalTitle').textContent=title;
  $('#modalMsg').textContent=msg;
  modalAction=fn;
  $('#modalOk').onclick=()=>{
    const f=modalAction;closeModal();
    if(typeof f==='function')f();
  };
  $('#modal').classList.remove('hidden');
}
function closeModal(){
  $('#modal').classList.add('hidden');
  modalAction=null;
}

/* ==================== 初始化 ==================== */
function initApp(){
  BANK_VALIDATION=validateBank(QUESTION_BANK);
  if(!BANK_VALIDATION.ok){
    $('#alertbar').innerHTML=`<div style="max-width:980px;margin:10px auto 0;padding:0 14px"><div class="alert">题库校验失败：${BANK_VALIDATION.issues.slice(0,6).map(esc).join('；')}</div></div>`;
    console.error('题库校验失败',BANK_VALIDATION.issues);
  }
  storage.set(LS.settings,settings);
  storage.set(LS.progress,progress);
  storage.set(LS.wrongbook,wrongbook);
  storage.set(LS.history,history);
  storage.set(LS.custom,customBank);
  storage.set(LS.meta,{total:QUESTION_BANK.length,byBook:BANK_VALIDATION.byBook,ok:BANK_VALIDATION.ok,updatedAt:now()});
  renderDashboard();
  go('dashboard');
}
initApp();
</script>
