      common();
      dot(Pp.x,Pp.y,COL.pointP,4);
      break;
    }

    case "p_fd":{
      common();
      txt("准线",D.x!==undefined?D.x:0,D.x!==undefined?view.oy+view.ext*0.9:D.y,
        "#475569",10,"center",[0,0]);
      dot(Pp.x,Pp.y,COL.pointP,4);
      break;
    }

    case "p_par":{
      common();
      dot(Pp.x,Pp.y,COL.pointP,5);
      labelP("P(t)",Pp.x,Pp.y,COL.pointP,16,-12);
      break;
    }

    case "p_fr":{
      common();
      seg(F.x,F.y,Pp.x,Pp.y,COL.focus,1.8,true);
      dot(Pp.x,Pp.y,COL.pointP,5);
      labelP("P",Pp.x,Pp.y,COL.pointP,12,-12);
      break;
    }

    case "p_lr":{
      common();
      /* 通径 2p：过焦点且垂直对称轴 */
      if(form===0||form===1){
        seg(F.x,-pp,F.x,pp,COL.chord,2.6);
        dot(F.x,pp,"#0d9488",4);dot(F.x,-pp,"#0d9488",4);
        txt("通径 2p",F.x,pp,"#0d9488",10,"center",[0,-10]);
      }else{
        seg(-pp,F.y,pp,F.y,COL.chord,2.6);
        dot(pp,F.y,"#0d9488",4);dot(-pp,F.y,"#0d9488",4);
        txt("通径 2p",pp,F.y,"#0d9488",10,"center",[8,0]);
      }
      break;
    }

    case "p_fchord":{
      common();
      if(isNum(p.lm)){
        const m=p.lm;
        const n=F.y-m*F.x;             /* 过焦点的直线 y=mx+n */
        lineThru(F.x-1,m*(F.x-1)+n,F.x+1,m*(F.x+1)+n,COL.chord,1.5,true);
        const res=parabolaLineForm(pp,m,n,form);
        if(res.roots.length===2){
          const pts=pointsFromRoots(res.roots,m,n);
          if(pts.length===2){
            seg(pts[0].x,pts[0].y,pts[1].x,pts[1].y,COL.chord,3);
            dot(pts[0].x,pts[0].y,"#0d9488",4);
            dot(pts[1].x,pts[1].y,"#0d9488",4);
            txt("A",pts[0].x,pts[0].y,"#0d9488",10,"center",[8,-10]);
            txt("B",pts[1].x,pts[1].y,"#0d9488",10,"center",[-8,-10]);
          }
        }
      }
      break;
    }

    case "p_ecc":{
      common();
      dot(Pp.x,Pp.y,COL.pointP,4);
      txt("e = 1",0,view.oy-view.ext*0.92,"#db2777",12);
      break;
    }

    case "p_line":{
      drawParabola(pp,form,COL.parabola,2.5);
      const m=p.lm,n=p.ln;
      lineThru(-1,m*(-1)+n,1,m+n,COL.chord,2);
      const res=parabolaLineForm(pp,m,n,form);
      let pts=[];
      if(res.roots.length===2)pts=pointsFromRoots(res.roots,m,n);
      else if(res.roots.length===1)pts=pointsFromRoots(res.roots,m,n);
      if(pts.length===2){
        seg(pts[0].x,pts[0].y,pts[1].x,pts[1].y,COL.chord,3.2);
        dot(pts[0].x,pts[0].y,"#0d9488",4);
        dot(pts[1].x,pts[1].y,"#0d9488",4);
      }else if(pts.length===1){
        dot(pts[0].x,pts[0].y,COL.tangent,5);
        labelP("交点",pts[0].x,pts[0].y,COL.tangent,16,-12);
      }
      dot(F.x,F.y,COL.focus,4);
      break;
    }

    case "p_tan":{
      drawParabola(pp,form,COL.parabola,2.5);
      const x0=Pp.x,y0=Pp.y;
      const t=paraTangent(pp,form,x0,y0);
      if(t){
        if(t.vertical)vline(t.x,COL.tangent,2.2);
        else lineThru(-1,t.m*(-1)+t.n,1,t.m+t.n,COL.tangent,2.2);
      }
      dot(x0,y0,COL.pointP,5);
      labelP("P",x0,y0,COL.pointP,12,-12);
      break;
    }

    case "p_mid":{
      drawParabola(pp,form,COL.parabola,2.5);
      const x0=Pp.x,y0=Pp.y;
      let k=null;
      if(form===0||form===1){
        if(Math.abs(y0)>0.05)k=(form===0?pp:-pp)/y0;
      }else{
        k=(form===2?x0:-x0)/pp;
      }
      dot(x0,y0,COL.pointP,5);
      labelP("M",x0,y0,COL.pointP,12,-12);
      if(k!==null&&isFinite(k)){
        const n=y0-k*x0;
        const res=parabolaLineForm(pp,k,n,form);
        if(res.roots.length===2){
          const pts=pointsFromRoots(res.roots,k,n);
          if(pts.length===2){
            seg(pts[0].x,pts[0].y,pts[1].x,pts[1].y,COL.chord,2.6);
            dot(pts[0].x,pts[0].y,"#0d9488",4);
            dot(pts[1].x,pts[1].y,"#0d9488",4);
          }
        }
      }
      break;
    }

    case "p_app":{
      /* 平行光经抛物面反射汇聚于焦点 */
      drawParabola(pp,0,COL.parabola,2.5);
      const F0=paraFocus(pp,0);
      dot(F0.x,F0.y,COL.focus,4);
      vline(-pp/2,COL.directrix,1.5,true);
      const ty=1.4, px=ty*ty/(2*pp);
      seg(view.ox-view.ext*1.3,ty,px,ty,"#3b82f6",1.8);
      seg(px,ty,F0.x,F0.y,COL.tangent,2.2);
      dot(px,ty,COL.pointP,4);
      txt("平行光",view.ox-view.ext*0.9,ty,"#3b82f6",10,"left");
      txt("反射",(px+F0.x)/2,ty/2,"#ea580c",10,"center");
      break;
    }

    case "p_rel":{
      drawEllipse(pp,pp*0.7,COL.ellipse,1.5);
      drawHyperbola(pp*0.7,pp*0.5,COL.hyperbola,1.5);
      drawParabola(pp,0,COL.parabola,2.5);
      dot(Pp.x,Pp.y,COL.pointP,4);
      txt("e=1 为临界",0,view.oy+view.ext*0.9,"#334155",10);
      break;
    }
  }
}

/* ================= 综合模块 ================= */
function drawSynScene(s){
  const p=state.params;
  const aux=state.showAux, fill=state.showFill;

  switch(s){

    case "s_uni":{
      const e=p.e, d0=p.d0;
      const col=(e<0.02)?COL.circle:(e<1?COL.ellipse:(Math.abs(e-1)<0.02?COL.parabola:COL.hyperbola));
      drawUnified(e,d0,col,2.5);
      dot(0,0,COL.focus,4);
      txt("F",0,0,"#b91c1c",11,"center",[0,-13]);
      if(e>=0.02){
        vline(-d0,COL.directrix,1.7,true);
        txt("准线 x=−d",-d0,view.oy+view.ext*0.9,"#475569",10);
      }
      const Pp=getP();
      if(isNum(Pp.x)&&isNum(Pp.y)){
        if(aux){
          seg(0,0,Pp.x,Pp.y,COL.focus,1.7,true);
          if(e>=0.02)seg(Pp.x,Pp.y,-d0,Pp.y,COL.aux,1.4,true);
        }
        dot(Pp.x,Pp.y,COL.pointP,5);
        labelP("P",Pp.x,Pp.y,COL.pointP,12,-12);
      }
      const label=(e<0.02)?"圆 e=0（准线退化）":(e<1?"椭圆 0<e<1":(Math.abs(e-1)<0.02?"抛物线 e=1":"双曲线 e>1"));
      txt(label,0,view.oy-view.ext*0.92,col,12);
      break;
    }

    case "s_disc":{
      const idx=clamp(Math.round(p.discCase),0,6);
      const names=[
        "圆：x²+y²=4",
        "椭圆：4x²+9y²=36",
        "双曲线：x²−y²=1",
        "抛物线：y²=4x",
        "两直线：x²−y²=0",
        "一点：x²+y²=0",
        "空集：x²+y²=−1"
      ];
      if(idx===0)drawCircle(0,0,2,COL.circle,2.5);
      else if(idx===1)drawEllipse(3,2,COL.ellipse,2.5);
      else if(idx===2)drawHyperbola(1,1,COL.hyperbola,2.5);
      else if(idx===3)drawParabola(2,0,COL.parabola,2.5);
      else if(idx===4){
        lineThru(-1,-1,1,1,COL.ellipse,2);
        lineThru(-1,1,1,-1,COL.ellipse,2);
      }else if(idx===5){
        dot(0,0,COL.focus,6);
      }
      txt(names[idx],0,view.oy+view.ext*0.9,"#334155",12);
      break;
    }

    case "s_compare":{
      drawCircle(0,0,1.6,COL.circle,1.7);
      drawEllipse(3,2,COL.ellipse,1.7);
      drawHyperbola(1.4,1.1,COL.hyperbola,1.7);
      drawParabola(1.4,0,COL.parabola,1.7);
      txt("圆 e=0｜椭圆 e<1｜抛物线 e=1｜双曲线 e>1",0,view.oy+view.ext*0.9,"#334155",11);
      break;
    }

    case "s_table":{
      drawCircle(0,0,1.3,COL.circle,1.4);
      drawEllipse(3,2,COL.ellipse,1.5);
      drawHyperbola(1.6,1.2,COL.hyperbola,1.5);
      drawParabola(1.5,0,COL.parabola,1.5);
      txt("详细对比见知识卡片",0,view.oy+view.ext*0.9,"#334155",11);
      break;
    }

    case "s_line":{
      const m=p.lm,n=p.ln;
      if(p.ctype===0){
        const a=DEMO.ellA, b=DEMO.ellB, c=Math.sqrt(a*a-b*b);
        drawEllipse(a,b,COL.ellipse,2.5);
        dot(-c,0,COL.focus,3.5);dot(c,0,COL.focus,3.5);
        lineThru(-1,m*(-1)+n,1,m+n,COL.chord,2);
        const res=ellipseLine(a,b,m,n);
        if(res.roots.length===2){
          const pts=pointsFromRoots(res.roots,m,n);
          if(pts.length===2){
            seg(pts[0].x,pts[0].y,pts[1].x,pts[1].y,COL.chord,3.2);
            dot(pts[0].x,pts[0].y,"#0d9488",4);dot(pts[1].x,pts[1].y,"#0d9488",4);
          }
        }else if(Math.abs(res.disc)<1e-8&&res.roots.length===1){
          const pts=pointsFromRoots(res.roots,m,n);
          if(pts.length===1){
            dot(pts[0].x,pts[0].y,COL.tangent,5);
            labelP("切点",pts[0].x,pts[0].y,COL.tangent,16,-12);
          }
        }
      }else if(p.ctype===1){
        const a=DEMO.hypA,b=DEMO.hypB,c=Math.sqrt(a*a+b*b);
        drawHyperbola(a,b,COL.hyperbola,2.5);
        lineThru(-1,-(b/a),1,(b/a),COL.asymptote,1.1,true);
        lineThru(-1,(b/a),1,-(b/a),COL.asymptote,1.1,true);
        dot(-c,0,COL.focus,3.5);dot(c,0,COL.focus,3.5);
        lineThru(-1,m*(-1)+n,1,m+n,COL.chord,2);
        const res=hyperbolaLine(a,b,m,n);
        if(res.parallel){
          if(res.roots.length===1){
            const pts=pointsFromRoots(res.roots,m,n);
            if(pts.length===1){dot(pts[0].x,pts[0].y,"#0d9488",5);labelP("唯一交点",pts[0].x,pts[0].y,"#0d9488",26,-12);}
          }
        }else if(res.roots.length===2){
          const pts=pointsFromRoots(res.roots,m,n);
          if(pts.length===2){
            seg(pts[0].x,pts[0].y,pts[1].x,pts[1].y,COL.chord,3.2);
            dot(pts[0].x,pts[0].y,"#0d9488",4);dot(pts[1].x,pts[1].y,"#0d9488",4);
          }
        }
      }else{
        const pp=DEMO.parP;
        drawParabola(pp,0,COL.parabola,2.5);
        dot(pp/2,0,COL.focus,3.5);
        vline(-pp/2,COL.directrix,1.1,true);
        lineThru(-1,m*(-1)+n,1,m+n,COL.chord,2);
        const res=parabolaLineForm(pp,m,n,0);
        if(res.roots.length===2){
          const pts=pointsFromRoots(res.roots,m,n);
          if(pts.length===2){
            seg(pts[0].x,pts[0].y,pts[1].x,pts[1].y,COL.chord,3.2);
            dot(pts[0].x,pts[0].y,"#0d9488",4);dot(pts[1].x,pts[1].y,"#0d9488",4);
          }
        }else if(res.roots.length===1){
          const pts=pointsFromRoots(res.roots,m,n);
          if(pts.length===1){dot(pts[0].x,pts[0].y,COL.tangent,5);labelP("交点",pts[0].x,pts[0].y,COL.tangent,16,-12);}
        }
      }
      break;
    }

    case "s_chord":{
      const a=DEMO.ellA, b=DEMO.ellB;
      drawEllipse(a,b,COL.ellipse,2.5);
      const x0=a*0.55*Math.cos(p.t), y0=b*0.55*Math.sin(p.t);
      dot(x0,y0,COL.pointP,5);
      labelP("M",x0,y0,COL.pointP,12,-12);
      if(Math.abs(y0)>0.05){
        const k=-b*b*x0/(a*a*y0);
        const n=y0-k*x0;
        const res=ellipseLine(a,b,k,n);
        if(res.roots.length===2){
          const pts=pointsFromRoots(res.roots,k,n);
          if(pts.length===2){
            seg(pts[0].x,pts[0].y,pts[1].x,pts[1].y,COL.chord,2.6);
            dot(pts[0].x,pts[0].y,"#0d9488",4);dot(pts[1].x,pts[1].y,"#0d9488",4);
          }
        }
      }
      break;
    }

    case "s_polar":{
      const a=DEMO.ellA, b=DEMO.ellB;
      drawEllipse(a,b,COL.ellipse,2.5);
      const x0=a*Math.cos(p.t), y0=b*Math.sin(p.t);
      dot(x0,y0,COL.pointP,5);
      labelP("P",x0,y0,COL.pointP,12,-12);
      if(Math.abs(y0)>1e-6){
        const k=-(b*b*x0)/(a*a*y0);
        const n=b*b/y0;
        lineThru(-1,k*(-1)+n,1,k+n,COL.tangent,2.2);
      }else{
        vline(x0,COL.tangent,2.2);
      }
      break;
    }

    case "s_fchord":{
      const a=DEMO.ellA, b=DEMO.ellB, c=Math.sqrt(a*a-b*b);
      drawEllipse(a,b,COL.ellipse,2.4);
      dot(-c,0,COL.focus,3.5);dot(c,0,COL.focus,3.5);
      if(isNum(p.lm)){
        const m=p.lm,n=-m*c;
        lineThru(c-1,m*(c-1-c),c+1,m*(c+1-c),COL.chord,1.5,true);
        const res=ellipseLine(a,b,m,n);
        if(res.roots.length===2){
          const pts=pointsFromRoots(res.roots,m,n);
          if(pts.length===2){
            seg(pts[0].x,pts[0].y,pts[1].x,pts[1].y,COL.chord,2.8);
            dot(pts[0].x,pts[0].y,"#0d9488",4);dot(pts[1].x,pts[1].y,"#0d9488",4);
          }
        }
      }
      break;
    }

    case "s_ftri":{
      const a=DEMO.ellA, b=DEMO.ellB, c=Math.sqrt(a*a-b*b);
      drawEllipse(a,b,COL.ellipse,2.4);
      const Pp={x:a*Math.cos(p.t),y:b*Math.sin(p.t)};
      if(fill)fillTriangle({x:-c,y:0},{x:c,y:0},Pp);
      seg(-c,0,Pp.x,Pp.y,COL.focus,1.7,true);
      seg(c,0,Pp.x,Pp.y,COL.focus,1.7,true);
      seg(-c,0,c,0,COL.focus,1.7);
      dot(-c,0,COL.focus,4);dot(c,0,COL.focus,4);
      dot(Pp.x,Pp.y,COL.pointP,5);
      labelP("P",Pp.x,Pp.y,COL.pointP,12,-12);
      break;
    }

    case "s_ecc":{
      const e=p.e, d0=p.d0;
      const col=(e<0.02)?COL.circle:(e<1?COL.ellipse:(Math.abs(e-1)<0.02?COL.parabola:COL.hyperbola));
      drawUnified(e,d0,col,2.5);
      const Pp=getP();
      if(isNum(Pp.x)&&isNum(Pp.y)){dot(Pp.x,Pp.y,COL.pointP,5);labelP("P",Pp.x,Pp.y,COL.pointP,12,-12);}
      dot(0,0,COL.focus,4);
      break;
    }

    case "s_circ":{
      const a=DEMO.ellA, b=clamp(p.bSlide,1e-3,a);
      drawCircle(0,0,a,"rgba(37,99,235,.45)",1.5);
      drawEllipse(a,b,COL.ellipse,2.5);
      dot(0,0,"#475569",3);
      txt("圆 b=a="+fmt(a,2),0,a,"#2563eb",10,"center",[0,-10]);
      txt("b="+fmt(b,2),a*0.7,-b-0.3,"#16a34a",10,"left");
      break;
    }

    case "s_ellhyp":{
      const c=DEMO.synC;
      const a1=DEMO.synEllA, b1=Math.sqrt(Math.max(a1*a1-c*c,0));
      const a2=DEMO.synHypA, b2=Math.sqrt(Math.max(c*c-a2*a2,0));
      if(b1>0)drawEllipse(a1,b1,COL.ellipse,2.2);
      if(b2>0)drawHyperbola(a2,b2,COL.hyperbola,2.2);
      lineThru(-1,-(b2/a2),1,b2/a2,"rgba(124,58,237,.45)",1.1,true);
      lineThru(-1,b2/a2,1,-(b2/a2),"rgba(124,58,237,.45)",1.1,true);
      dot(-c,0,COL.focus,4);dot(c,0,COL.focus,4);
      txt("共焦点 c="+fmt(c,2),0,view.oy+view.ext*0.9,"#334155",11);
      break;
    }

    case "s_hypPara":{
      const a=DEMO.hypA,b=DEMO.hypB,c=Math.sqrt(a*a+b*b);
      drawHyperbola(a,b,COL.hyperbola,2.2);
      lineThru(-1,-(b/a),1,b/a,"rgba(124,58,237,.45)",1.1,true);
      lineThru(-1,(b/a),1,-(b/a),"rgba(124,58,237,.45)",1.1,true);
      drawParabola(DEMO.parP,0,COL.parabola,2.2);
      dot(-c,0,COL.focus,3);dot(c,0,COL.focus,3);
      dot(DEMO.parP/2,0,COL.focus,3);
      txt("双曲线 e>1（有渐近线）",0,view.oy+view.ext*0.82,"#7c3aed",10);
      txt("抛物线 e=1（无渐近线）",0,view.oy+view.ext*0.95,"#db2777",10);
      break;
    }

    case "s_optics":{
      const a=DEMO.ellA,b=DEMO.ellB,c=Math.sqrt(a*a-b*b);
      drawEllipse(a,b,COL.ellipse,2.4);
      const Pp={x:a*Math.cos(p.t),y:b*Math.sin(p.t)};
      seg(-c,0,Pp.x,Pp.y,"#3b82f6",1.7);
      seg(Pp.x,Pp.y,c,0,"#3b82f6",1.7);
      dot(-c,0,COL.focus,4);dot(c,0,COL.focus,4);
      dot(Pp.x,Pp.y,COL.pointP,5);
      labelP("P",Pp.x,Pp.y,COL.pointP,12,-12);
      txt("F₁ → P → F₂ 反射",0,view.oy+view.ext*0.9,"#3b82f6",10);
      break;
    }

    case "s_extreme":{
      const a=DEMO.ellA,b=DEMO.ellB,c=Math.sqrt(a*a-b*b);
      drawEllipse(a,b,COL.ellipse,2.4);
      const Pp={x:a*Math.cos(p.t),y:b*Math.sin(p.t)};
      seg(-c,0,Pp.x,Pp.y,COL.focus,1.6,true);
      seg(c,0,Pp.x,Pp.y,COL.focus,1.6,true);
      dot(-c,0,COL.focus,4);dot(c,0,COL.focus,4);
      dot(Pp.x,Pp.y,COL.pointP,5);
      labelP("P",Pp.x,Pp.y,COL.pointP,12,-12);
      txt("a+c="+fmt(a+c,2)+"  a−c="+fmt(a-c,2),0,view.oy+view.ext*0.9,"#334155",10);
      break;
    }

    case "s_card":{
      drawCircle(0,0,1.2,COL.circle,1.4);
      drawEllipse(3,2,COL.ellipse,1.5);
      drawHyperbola(1.5,1.15,COL.hyperbola,1.5);
      drawParabola(1.5,0,COL.parabola,1.5);
      txt("圆 e=0｜椭圆 0<e<1｜抛物线 e=1｜双曲线 e>1",0,view.oy+view.ext*0.9,"#334155",10);
      break;
    }
  }
}

<script>
/* =========================================================
   第七段：数值面板 / 知识卡片
   ========================================================= */

/* ---------- 面板渲染：标签不变时只更新 textContent ---------- */
let _panelKeys=[], _panelEls=[];
function renderPanel(arr){
  const box=$("panel");
  const keys=arr.map(function(x){return x[0];});
  let same=keys.length===_panelKeys.length;
  if(same){
    for(let i=0;i<keys.length;i++){if(keys[i]!==_panelKeys[i]){same=false;break;}}
  }
  if(!same){
    box.innerHTML="";
    _panelEls=[];
    for(const it of arr){
      const d=document.createElement("div");
      d.className="vchip";
      const l=document.createElement("span");
      l.className="l"; l.textContent=it[0];
      const b=document.createElement("b");
      b.textContent=it[1];
      d.appendChild(l); d.appendChild(b);
      box.appendChild(d);
      _panelEls.push(b);
    }
    _panelKeys=keys.slice();
  }else{
    for(let i=0;i<arr.length;i++){
      if(_panelEls[i])_panelEls[i].textContent=arr[i][1];
    }
  }
}

function updatePanel(){
  const m=state.module,s=state.submode;
  let arr=[];
  if(m==="circle")arr=panelCircle(s);
  else if(m==="ellipse")arr=panelEllipse(s);
  else if(m==="hyperbola")arr=panelHyperbola(s);
  else if(m==="parabola")arr=panelParabola(s);
  else arr=panelSyn(s);
  renderPanel(arr);
}

/* =========================================================
   圆
   ========================================================= */
function panelCircle(s){
  const p=state.params;
  const h=p.h,k=p.k,r=p.r;
  const D=-2*h,E=-2*k,F=h*h+k*k-r*r;
  const A=[];
  const eqStd="(x"+(h>=0?"−":"+")+fmt(Math.abs(h),2)+")²+(y"+(k>=0?"−":"+")+fmt(Math.abs(k),2)+")²="+fmt(r*r,2);

  if(s==="c_def"){
    A.push(["圆心 O","("+fmt(h)+", "+fmt(k)+")"]);
    A.push(["半径 r",fmt(r)]);
    A.push(["|OP|",fmt(Math.hypot(getP().x-h,getP().y-k))]);
    A.push(["标准方程",eqStd]);
    A.push(["一般方程","x²+y²"+(D>=0?"+":"−")+fmt(Math.abs(D),2)+"x"+(E>=0?"+":"−")+fmt(Math.abs(E),2)+"y"+(F>=0?"+":"−")+fmt(Math.abs(F),2)+"=0"]);
  }else if(s==="c_std"){
    A.push(["圆心 a",fmt(h)]);
    A.push(["圆心 b",fmt(k)]);
    A.push(["半径 r",fmt(r)]);
    A.push(["标准方程",eqStd]);
    A.push(["D,E,F",fmt(D)+", "+fmt(E)+", "+fmt(F)]);
  }else if(s==="c_gen"){
    const Dg=p.Dg,Eg=p.Eg,Fg=p.Fg;
    const disc=Dg*Dg+Eg*Eg-4*Fg;
    A.push(["D",fmt(Dg)]);
    A.push(["E",fmt(Eg)]);
    A.push(["F",fmt(Fg)]);
    A.push(["D²+E²−4F",fmt(disc)]);
    A.push(["判定",disc>0?"表示圆":"不表示圆"]);
    A.push(["圆心","("+fmt(-Dg/2)+", "+fmt(-Eg/2)+")"]);
    A.push(["半径",disc>0?fmt(Math.sqrt(disc)/2):"—"]);
    A.push(["方程","x²+y²"+(Dg>=0?"+":"−")+fmt(Math.abs(Dg),2)+"x"+(Eg>=0?"+":"−")+fmt(Math.abs(Eg),2)+"y"+(Fg>=0?"+":"−")+fmt(Math.abs(Fg),2)+"=0"]);
  }else if(s==="c_par"){
    const Pp=getP();
    const deg=((p.t*180/Math.PI)%360+360)%360;
    A.push(["θ（度）",fmt(deg,1)+"°"]);
    A.push(["θ（弧度）",fmt(p.t,3)]);
    A.push(["cosθ",fmt(Math.cos(p.t),3)]);
    A.push(["sinθ",fmt(Math.sin(p.t),3)]);
    A.push(["x",fmt(Pp.x)]);
    A.push(["y",fmt(Pp.y)]);
  }else if(s==="c_pq"){
    const d=Math.hypot(p.qx-h,p.qy-k);
    const rel=Math.abs(d-r)<0.05?"圆上":(d<r?"圆内":"圆外");
    A.push(["|OQ|",fmt(d)]);
    A.push(["半径 r",fmt(r)]);
    A.push(["比较",fmt(d)+(d<r?" < ":Math.abs(d-r)<0.05?" = ":" > ")+fmt(r)]);
    A.push(["位置关系",rel]);
  }else if(s==="c_lc"){
    const res=circleLine(h,k,r,p.lm,p.ln);
    const rel=Math.abs(res.d-r)<0.03?"相切":(res.d<r?"相交":"相离");
    A.push(["直线","y="+fmt(p.lm,2)+"x"+(p.ln>=0?"+":"−")+fmt(Math.abs(p.ln),2)]);
    A.push(["圆心到直线 d",fmt(res.d)]);
    A.push(["半径 r",fmt(r)]);
    A.push(["位置关系",rel]);
    A.push(["弦长",(res.d<r)?fmt(2*Math.sqrt(Math.max(r*r-res.d*res.d,0))):"—"]);
    A.push(["判别式 Δ",fmt(res.disc)]);
  }else if(s==="c_chord"){
    const res=circleLine(h,k,r,p.lm,p.ln);
    const d=res.d;
    A.push(["弦心距 d",fmt(d)]);
    A.push(["r²−d²",d<r?fmt(r*r-d*d):"—"]);
    A.push(["半弦 √(r²−d²)",d<r?fmt(Math.sqrt(r*r-d*d)):"—"]);
    A.push(["弦长 2√(r²−d²)",d<r?fmt(2*Math.sqrt(r*r-d*d)):"—"]);
    A.push(["关系","r²=d²+(半弦)²"]);
  }else if(s==="c_diam"){
    const res=circleLine(h,k,r,p.lm,p.ln);
    A.push(["弦心距 d",fmt(res.d)]);
    A.push(["弦长",res.d<r?fmt(2*Math.sqrt(Math.max(r*r-res.d*res.d,0))):"—"]);
    A.push(["结论","垂直于弦的直径平分弦"]);
    A.push(["推论","且平分弦所对的两条弧"]);
  }else if(s==="c_tan"){
    const d=Math.hypot(p.px-h,p.py-k);
    const tl=d>r?Math.sqrt(d*d-r*r):NaN;
    A.push(["|OQ|",fmt(d)]);
    A.push(["半径 r",fmt(r)]);
    A.push(["切线长 √(d²−r²)",d>r?fmt(tl):"—"]);
    A.push(["切线条数",d>r?"2":(Math.abs(d-r)<0.05?"1":"0")]);
    if(d>r){
      /* 切点弦方程：以 Q 为极点的极线 */
      const dx=p.px-h, dy=p.py-k;
      const C=-(dx*h+dy*k+r*r);
      A.push(["切点弦","(x−h)(x_Q−h)+(y−k)(y_Q−k)=r²"]);
      A.push(["切点弦系数","A="+fmt(dx)+", B="+fmt(dy)+", C="+fmt(C)]);
    }else{
      A.push(["切点弦","—"]);
    }
  }else if(s==="c_ang"){
    A.push(["圆心角",fmt(p.ang,1)+"°"]);
    A.push(["圆周角",fmt(p.ang/2,1)+"°"]);
    A.push(["关系","圆周角 = ½ 圆心角"]);
    A.push(["直径所对","90°"]);
  }else if(s==="c_arc"){
    const rad=p.ang*Math.PI/180;
    A.push(["角度",fmt(p.ang,1)+"°"]);
    A.push(["弧度",fmt(rad,3)+" rad"]);
    A.push(["弧长 l=rθ",fmt(r*rad)]);
    A.push(["扇形 S=½r²θ",fmt(0.5*r*r*rad)]);
    A.push(["S=½lr",fmt(0.5*(r*rad)*r)]);
    A.push(["换算","180° = π rad"]);
  }else if(s==="c_cc"){
    const d=Math.hypot(p.h2-h,p.k2-k),sum=r+p.r2,dif=Math.abs(r-p.r2);
    let rel;
    if(d<1e-6)rel="同心";
    else if(d>sum+1e-6)rel="外离";
    else if(Math.abs(d-sum)<1e-6)rel="外切";
    else if(d<sum&&d>dif)rel="相交";
    else if(Math.abs(d-dif)<1e-6)rel="内切";
    else rel="内含";
    A.push(["圆心距 d",fmt(d)]);
    A.push(["r₁",fmt(r)]);
    A.push(["r₂",fmt(p.r2)]);
    A.push(["r₁+r₂",fmt(sum)]);
    A.push(["|r₁−r₂|",fmt(dif)]);
    A.push(["位置关系",rel]);
  }else if(s==="c_common"){
    const d=Math.hypot(p.h2-h,p.k2-k),R1=r,R2=p.r2;
    let chord=null;
    if(d>1e-9&&d<R1+R2-1e-6&&d>Math.abs(R1-R2)+1e-6){
      const ax=(d*d+R1*R1-R2*R2)/(2*d);
      chord=2*Math.sqrt(Math.max(R1*R1-ax*ax,0));
    }
    const Aco=2*(p.h2-h),Bco=2*(p.k2-p.k);
    const Cco=h*h+k*k-R1*R1-(p.h2*p.h2+p.k2*p.k2-R2*R2);
    A.push(["圆心距 d",fmt(d)]);
    A.push(["公共弦长",chord===null?"无公共弦":fmt(chord)]);
    A.push(["公共弦直线","2(h₂−h₁)x+2(k₂−k₁)y+C=0"]);
    A.push(["A,B,C",fmt(Aco)+", "+fmt(Bco)+", "+fmt(Cco)]);
  }else if(s==="c_ctan"){
    const d=Math.hypot(p.h2-h,p.k2-k),sum=r+p.r2,dif=Math.abs(r-p.r2);
    let ext=0,intn=0;
    if(d>sum+1e-6){ext=2;intn=2;}
    else if(Math.abs(d-sum)<1e-6){ext=2;intn=1;}
    else if(d<sum&&d>dif+1e-6){ext=2;intn=0;}
    else if(Math.abs(d-dif)<1e-6){ext=1;intn=0;}
    A.push(["圆心距 d",fmt(d)]);
    A.push(["外公切线条数",String(ext)]);
    A.push(["内公切线条数",String(intn)]);
    A.push(["外公切线长",d>Math.abs(r-p.r2)?fmt(Math.sqrt(Math.max(d*d-(r-p.r2)*(r-p.r2),0))):"—"]);
    A.push(["内公切线长",d>r+p.r2?fmt(Math.sqrt(Math.max(d*d-(r+p.r2)*(r+p.r2),0))):"—"]);
    A.push(["总条数",String(ext+intn)]);
  }else if(s==="c_sys"){
    A.push(["λ",fmt(p.lam,2)]);
    A.push(["圆系","圆₁+λ(圆₁−圆₂)=0"]);
    A.push(["λ=−1","公共弦所在直线"]);
    A.push(["两圆 D₁,D₂",fmt(-2*h)+", "+fmt(-2*p.h2)]);
    A.push(["两圆 E₁,E₂",fmt(-2*k)+", "+fmt(-2*p.k2)]);
    A.push(["两圆 F₁,F₂",fmt(h*h+k*k-r*r)+", "+fmt(p.h2*p.h2+p.k2*p.k2-p.r2*p.r2)]);
  }else if(s==="c_sym"){
    A.push(["原圆心","("+fmt(h)+", "+fmt(k)+")"]);
    A.push(["关于圆心对称","同圆"]);
    A.push(["关于 x 轴对称","("+fmt(h)+", "+fmt(-k)+")"]);
    A.push(["关于 y 轴对称","("+fmt(-h)+", "+fmt(k)+")"]);
    A.push(["关于 y=x 对称","("+fmt(k)+", "+fmt(h)+")"]);
  }
  return A;
}

/* =========================================================
   椭圆
   ========================================================= */
function panelEllipse(s){
  const p=state.params;
  const a=p.a,c=p.c,b=eb(),e=c/a;
  const A=[];
  const eq="x²/"+fmt(a*a,2)+" + y²/"+fmt(b*b,2)+" = 1";

  if(s==="e_def1"){
    const Pp=getP();
    const pf1=Math.hypot(Pp.x+c,Pp.y),pf2=Math.hypot(Pp.x-c,Pp.y);
    A.push(["PF₁",fmt(pf1)]);
    A.push(["PF₂",fmt(pf2)]);
    A.push(["PF₁+PF₂",fmt(pf1+pf2)]);
    A.push(["2a",fmt(2*a)]);
  }else if(s==="e_def2"){
    const Pp=getP();
    const pf=Math.hypot(Pp.x-c,Pp.y);
    const dir=c>1e-6?a*a/c:NaN;
    const d=isNum(dir)?Math.abs(Pp.x-dir):NaN;
    A.push(["PF",fmt(pf)]);
    A.push(["d（到准线）",fmt(d)]);
    A.push(["PF/d",isNum(d)&&d>0?fmt(pf/d,3):"—"]);
    A.push(["e=c/a",fmt(e,3)]);
    A.push(["准线 x=a²/c",fmt(dir)]);
    A.push(["左准线",isNum(dir)?fmt(-dir):"—"]);
  }else if(s==="e_def3"){
    const Pp=getP();
    const k1=Math.abs(Pp.x+a)<0.05?null:Pp.y/(Pp.x+a);
    const k2=Math.abs(Pp.x-a)<0.05?null:Pp.y/(Pp.x-a);
    const prod=(k1!==null&&k2!==null)?k1*k2:null;
    A.push(["k₁",k1===null?"不存在":fmt(k1,3)]);
    A.push(["k₂",k2===null?"不存在":fmt(k2,3)]);
    A.push(["k₁·k₂",prod===null?"—":fmt(prod,3)]);
    A.push(["−b²/a²",fmt(-b*b/(a*a),3)]);
  }else if(s==="e_std"){
    A.push(["a",fmt(a)]);
    A.push(["b",fmt(b)]);
    A.push(["c",fmt(c)]);
    A.push(["e",fmt(e,3)]);
    A.push(["方程",eq]);
    A.push(["b²=a²−c²",fmt(b*b,2)+" = "+fmt(a*a,2)+" − "+fmt(c*c,2)]);
  }else if(s==="e_par"){
    const Pp=getP();
    A.push(["t（离心角）",fmt(p.t,3)]);
    A.push(["x=a cos t",fmt(Pp.x)]);
    A.push(["y=b sin t",fmt(Pp.y)]);
    A.push(["tan t=(a/b)tanθ","t 不是极角"]);
  }else if(s==="e_elem"){
    A.push(["a",fmt(a)]);
    A.push(["b",fmt(b)]);
    A.push(["c",fmt(c)]);
    A.push(["e",fmt(e,3)]);
    A.push(["焦点","(±"+fmt(c)+", 0)"]);
    A.push(["顶点","(±"+fmt(a)+",0), (0,±"+fmt(b)+")"]);
  }else if(s==="e_fr"){
    const Pp=getP();
    A.push(["x_P",fmt(Pp.x)]);
    A.push(["PF₁=a+ex",fmt(a+e*Pp.x)]);
    A.push(["PF₂=a−ex",fmt(a-e*Pp.x)]);
    A.push(["和",fmt((a+e*Pp.x)+(a-e*Pp.x))]);
    A.push(["2a",fmt(2*a)]);
  }else if(s==="e_ftri"){
    const Pp=getP();
    const v1={x:-c-Pp.x,y:-Pp.y},v2={x:c-Pp.x,y:-Pp.y};
    const pf1=Math.hypot(v1.x,v1.y),pf2=Math.hypot(v2.x,v2.y);
    const cosT=(v1.x*v2.x+v1.y*v2.y)/(pf1*pf2);
    const th=Math.acos(clamp(cosT,-1,1));
    A.push(["PF₁",fmt(pf1)]);
    A.push(["PF₂",fmt(pf2)]);
    A.push(["F₁F₂",fmt(2*c)]);
    A.push(["θ",fmt(th*180/Math.PI,1)+"°"]);
    A.push(["S=b²tan(θ/2)",fmt(b*b*Math.tan(th/2))]);
    A.push(["实际面积",fmt(0.5*(2*c)*Math.abs(Pp.y))]);
  }else if(s==="e_fchord"){
    const lr=b*b/a;
    A.push(["通径 2b²/a",fmt(2*lr)]);
    if(isNum(p.lm)){
      const m=p.lm,n=-m*c;
      const res=ellipseLine(a,b,m,n);
      if(res.roots.length===2){
        const pts=pointsFromRoots(res.roots,m,n);
        if(pts.length===2){
          A.push(["焦点弦 |AB|",fmt(chordLen(res.roots,m))]);
          A.push(["x₁x₂",fmt(pts[0].x*pts[1].x)]);
          A.push(["y₁y₂",fmt(pts[0].y*pts[1].y)]);
        }
      }else{
        A.push(["焦点弦 |AB|","—"]);
        A.push(["x₁x₂","—"]);
        A.push(["y₁y₂","—"]);
      }
    }
    A.push(["|AB|min",fmt(2*lr)]);
    A.push(["|AB|max",fmt(2*a)]);
  }else if(s==="e_mid"){
    const Pp=getP();
    const k=Math.abs(Pp.y)<0.05?null:-b*b*Pp.x/(a*a*Pp.y);
    A.push(["中点 M","("+fmt(Pp.x)+", "+fmt(Pp.y)+")"]);
    A.push(["弦斜率 k",k===null?"不存在":fmt(k,3)]);
    A.push(["点差法","k=−b²x₀/(a²y₀)"]);
    A.push(["中点需在椭圆内","否则无弦"]);
  }else if(s==="e_ecc"){
    A.push(["e=c/a",fmt(e,3)]);
    A.push(["范围","0<e<1"]);
    A.push(["b/a",fmt(b/a,3)]);
    A.push(["√(1−e²)",fmt(Math.sqrt(Math.max(1-e*e,0)),3)]);
  }else if(s==="e_dir"){
    const d=a*a/c;
    A.push(["e",fmt(e,3)]);
    A.push(["右准线 x=a²/c",fmt(d)]);
    A.push(["左准线",fmt(-d)]);
  }else if(s==="e_line"){
    const res=ellipseLine(a,b,p.lm,p.ln);
    A.push(["直线","y="+fmt(p.lm,2)+"x"+(p.ln>=0?"+":"−")+fmt(Math.abs(p.ln),2)]);
    A.push(["判别式 Δ",fmt(res.disc)]);
    A.push(["位置关系",positionFromDisc(res.disc)]);
    A.push(["弦长",res.roots.length===2?fmt(chordLen(res.roots,p.lm)):"—"]);
  }else if(s==="e_tan"){
    const Pp=getP();
    A.push(["切点 P","("+fmt(Pp.x)+", "+fmt(Pp.y)+")"]);
    A.push(["切线","xx₀/a² + yy₀/b² = 1"]);
    A.push(["代入",fmt(Pp.x,2)+"x/"+fmt(a*a,2)+" + "+fmt(Pp.y,2)+"y/"+fmt(b*b,2)+" = 1"]);
    A.push(["斜率不存在","切线为竖直线"]);
  }else if(s==="e_circle"){
    const bb=clamp(p.bSlide,1e-6,a);
    const ee=Math.sqrt(Math.max(a*a-bb*bb,0))/a;
    A.push(["a",fmt(a)]);
    A.push(["b",fmt(bb)]);
    A.push(["e",fmt(ee,3)]);
    A.push(["b=a 时","圆，e=0"]);
  }
  return A;
}

/* =========================================================
   双曲线
   ========================================================= */
function panelHyperbola(s){
  const p=state.params;
  const a=p.a,b=p.b,c=hc(),e=he();
  const A=[];
  const eq="x²/"+fmt(a*a,2)+" − y²/"+fmt(b*b,2)+" = 1";
  const asym="y = ±("+fmt(b/a,2)+")x";

  if(s==="h_def1"){
    const Pp=getP();
    const pf1=Math.hypot(Pp.x+c,Pp.y),pf2=Math.hypot(Pp.x-c,Pp.y);
    A.push(["PF₁",fmt(pf1)]);
    A.push(["PF₂",fmt(pf2)]);
    A.push(["|PF₁−PF₂|",fmt(Math.abs(pf1-pf2))]);
    A.push(["2a",fmt(2*a)]);
    A.push(["所在支",Pp.x>=0?"右支":"左支"]);
  }else if(s==="h_def2"){
    const Pp=getP();
    const pf=Math.hypot(Pp.x-c,Pp.y);
    const dir=a*a/c;
    const d=Math.abs(Pp.x-dir);
    A.push(["PF",fmt(pf)]);
    A.push(["d（到准线）",fmt(d)]);
    A.push(["PF/d",d>0?fmt(pf/d,3):"—"]);
    A.push(["e=c/a",fmt(e,3)]);
    A.push(["准线 x=a²/c",fmt(dir)]);
  }else if(s==="h_def3"){
    const Pp=getP();
    const k1=Math.abs(Pp.x+a)<0.05?null:Pp.y/(Pp.x+a);
    const k2=Math.abs(Pp.x-a)<0.05?null:Pp.y/(Pp.x-a);
    const prod=(k1!==null&&k2!==null)?k1*k2:null;
    A.push(["k₁",k1===null?"不存在":fmt(k1,3)]);
    A.push(["k₂",k2===null?"不存在":fmt(k2,3)]);
    A.push(["k₁·k₂",prod===null?"—":fmt(prod,3)]);
    A.push(["b²/a²",fmt(b*b/(a*a),3)]);
  }else if(s==="h_std"){
    A.push(["a",fmt(a)]);
    A.push(["b",fmt(b)]);
    A.push(["c",fmt(c)]);
    A.push(["e=c/a",fmt(e,3)]);
    A.push(["方程",eq]);
    A.push(["c²=a²+b²",fmt(c*c,2)]);
  }else if(s==="h_par"){
    const Pp=getP();
    const u=1.3*Math.sin(p.t);
    A.push(["连续参数 u",fmt(u,3)]);
    A.push(["x=±a·cosh u",fmt(Pp.x)]);
    A.push(["y=b·sinh u",fmt(Pp.y)]);
    A.push(["sec/tan 形式","x=a·sec t, y=b·tan t"]);
    A.push(["注意","t=π/2 处有奇点"]);
    A.push(["离心率 e",fmt(e,3)]);
  }else if(s==="h_elem"){
    A.push(["实轴长 2a",fmt(2*a)]);
    A.push(["虚轴长 2b",fmt(2*b)]);
    A.push(["c",fmt(c)]);
    A.push(["e",fmt(e,3)]);
    A.push(["焦点","(±"+fmt(c)+",0)"]);
    A.push(["顶点","(±"+fmt(a)+",0)"]);
  }else if(s==="h_asy"){
    A.push(["渐近线",asym]);
    A.push(["b/a",fmt(b/a,3)]);
    A.push(["e",fmt(e,3)]);
    A.push(["等轴双曲线","a=b 时 e=√2≈1.414"]);
  }else if(s==="h_conj"){
    A.push(["原双曲线",eq]);
    A.push(["共轭双曲线","y²/"+fmt(b*b,2)+" − x²/"+fmt(a*a,2)+" = 1"]);
    A.push(["共同渐近线",asym]);
  }else if(s==="h_fr"){
    const Pp=getP();
    const pf1=Math.hypot(Pp.x+c,Pp.y),pf2=Math.hypot(Pp.x-c,Pp.y);
    const right=Pp.x>=0;
    A.push(["所在支",right?"右支":"左支"]);
    A.push(["PF₁",fmt(pf1)]);
    A.push(["PF₂",fmt(pf2)]);
    A.push(["差",fmt(Math.abs(pf1-pf2))]);
    A.push(["2a",fmt(2*a)]);
    A.push(["公式",right?"PF₁=ex+a, PF₂=ex−a":"PF₁=−ex−a, PF₂=−ex+a"]);
  }else if(s==="h_ftri"){
    const Pp=getP();
    const v1={x:-c-Pp.x,y:-Pp.y},v2={x:c-Pp.x,y:-Pp.y};
    const pf1=Math.hypot(v1.x,v1.y),pf2=Math.hypot(v2.x,v2.y);
    const cosT=(v1.x*v2.x+v1.y*v2.y)/(pf1*pf2);
    const th=Math.acos(clamp(cosT,-1,1));
    A.push(["PF₁",fmt(pf1)]);
    A.push(["PF₂",fmt(pf2)]);
    A.push(["F₁F₂",fmt(2*c)]);
    A.push(["θ",fmt(th*180/Math.PI,1)+"°"]);
    A.push(["S=b²/tan(θ/2)",fmt(b*b/Math.tan(th/2))]);
  }else if(s==="h_fchord"){
    const lr=b*b/a;
    A.push(["通径 2b²/a",fmt(2*lr)]);
    if(isNum(p.lm)){
      const m=p.lm,n=-m*c;
      const res=hyperbolaLine(a,b,m,n);
      if(res.roots.length===2&&!res.parallel){
        const pts=pointsFromRoots(res.roots,m,n);
        if(pts.length===2){
          A.push(["|AB|",fmt(chordLen(res.roots,m))]);
          A.push(["x₁x₂",fmt(pts[0].x*pts[1].x)]);
          A.push(["y₁y₂",fmt(pts[0].y*pts[1].y)]);
        }
      }else{
        A.push(["|AB|","—"]);
        A.push(["x₁x₂","—"]);
        A.push(["y₁y₂","—"]);
      }
    }
  }else if(s==="h_mid"){
    const Pp=getP();
    const k=Math.abs(Pp.y)<0.05?null:b*b*Pp.x/(a*a*Pp.y);
    A.push(["中点 M","("+fmt(Pp.x)+", "+fmt(Pp.y)+")"]);
    A.push(["弦斜率 k",k===null?"不存在":fmt(k,3)]);
    A.push(["点差法","k=b²x₀/(a²y₀)"]);
  }else if(s==="h_ecc"){
    A.push(["e=c/a",fmt(e,3)]);
    A.push(["范围","e>1"]);
    A.push(["b/a",fmt(b/a,3)]);
    A.push(["√(e²−1)",fmt(Math.sqrt(Math.max(e*e-1,0)),3)]);
  }else if(s==="h_dir"){
    const d=a*a/c;
    A.push(["e",fmt(e,3)]);
    A.push(["右准线 x=a²/c",fmt(d)]);
    A.push(["左准线",fmt(-d)]);
  }else if(s==="h_line"){
    const res=hyperbolaLine(a,b,p.lm,p.ln);
    let rel;
    if(res.parallel)rel="与渐近线平行（一个交点）";
    else rel=positionFromDisc(res.disc);
    A.push(["直线","y="+fmt(p.lm,2)+"x"+(p.ln>=0?"+":"−")+fmt(Math.abs(p.ln),2)]);
    A.push(["判别式 Δ",fmt(res.disc)]);
    A.push(["位置关系",rel]);
    A.push(["弦长",(res.roots.length===2&&!res.parallel)?fmt(chordLen(res.roots,p.lm)):"—"]);
  }else if(s==="h_tan"){
    const Pp=getP();
    A.push(["切点 P","("+fmt(Pp.x)+", "+fmt(Pp.y)+")"]);
    A.push(["切线","xx₀/a² − yy₀/b² = 1"]);
    A.push(["斜率不存在","切线为竖直线"]);
  }else if(s==="h_ell"){
    const aE=c/0.6, bE=Math.sqrt(Math.max(aE*aE-c*c,0));
    A.push(["公共 c",fmt(c)]);
    A.push(["椭圆 a,b,e",fmt(aE)+", "+fmt(bE)+", "+fmt(c/aE,3)]);
    A.push(["双曲线 a,b,e",fmt(a)+", "+fmt(b)+", "+fmt(e,3)]);
  }
  return A;
}

/* =========================================================
   抛物线
   ========================================================= */
function panelParabola(s){
  const p=state.params;
  const pp=p.p, form=p.pform;
  const F=paraFocus(pp,form), D=paraDirectrix(pp,form);
  const A=[];
  const eqs=["y² = "+fmt(2*pp,2)+"x","y² = −"+fmt(2*pp,2)+"x","x² = "+fmt(2*pp,2)+"y","x² = −"+fmt(2*pp,2)+"y"];
  const dirStr=(D.x!==undefined)?"x = "+fmt(D.x,2):"y = "+fmt(D.y,2);

  if(s==="p_def"){
    const Pp=getP();
    const pf=Math.hypot(Pp.x-F.x,Pp.y-F.y);
    const d=(D.x!==undefined)?Math.abs(Pp.x-D.x):Math.abs(Pp.y-D.y);
    A.push(["PF",fmt(pf)]);
    A.push(["d（到准线）",fmt(d)]);
    A.push(["PF/d",d>0?fmt(pf/d,3):"—"]);
    A.push(["e",fmt(1)]);
  }else if(s==="p_std"){
    A.push(["p",fmt(pp)]);
    A.push(["方程",eqs[form]]);
    A.push(["焦点","("+fmt(F.x)+", "+fmt(F.y)+")"]);
    A.push(["准线",dirStr]);
    A.push(["开口",["向右","向左","向上","向下"][form]]);
  }else if(s==="p_fd"){
    A.push(["p",fmt(pp)]);
    A.push(["焦点 F","("+fmt(F.x)+", "+fmt(F.y)+")"]);
    A.push(["准线",dirStr]);
    A.push(["方程",eqs[form]]);
  }else if(s==="p_par"){
    const Pp=getP();
    A.push(["t",fmt(p.t,3)]);
    A.push(["x",fmt(Pp.x)]);
    A.push(["y",fmt(Pp.y)]);
    A.push(["参数方程",form===0?"x=2pt², y=2pt":"按开口方向对称"]);
  }else if(s==="p_fr"){
    const Pp=getP();
    const pf=Math.hypot(Pp.x-F.x,Pp.y-F.y);
    const fml=["x+p/2","−x+p/2","y+p/2","−y+p/2"][form];
    const val=[Pp.x+pp/2,-Pp.x+pp/2,Pp.y+pp/2,-Pp.y+pp/2][form];
    A.push(["P","("+fmt(Pp.x)+", "+fmt(Pp.y)+")"]);
    A.push(["PF="+fml,fmt(val)]);
    A.push(["实际 PF",fmt(pf)]);
    A.push(["e",fmt(1)]);
  }else if(s==="p_lr"){
    A.push(["p",fmt(pp)]);
    A.push(["通径 2p",fmt(2*pp)]);
    A.push(["说明","过焦点垂直于对称轴"]);
  }else if(s==="p_fchord"){
    const m=p.lm, n=-m*pp/2;   /* 过焦点 (p/2,0) */
    const res=parabolaLineForm(pp,m,n,0);
    if(res.roots.length===2){
      const pts=pointsFromRoots(res.roots,m,n);
      if(pts.length===2){
        const y1=pts[0].y,y2=pts[1].y,x1=pts[0].x,x2=pts[1].x;
        const t1=y1/(2*pp),t2=y2/(2*pp);
        A.push(["A","("+fmt(x1)+", "+fmt(y1)+")"]);
        A.push(["B","("+fmt(x2)+", "+fmt(y2)+")"]);
        A.push(["t₁,t₂",fmt(t1,3)+", "+fmt(t2,3)]);
        A.push(["t₁·t₂",fmt(t1*t2)]);
        A.push(["y₁y₂",fmt(y1*y2)]);
        A.push(["x₁x₂",fmt(x1*x2)]);
        A.push(["弦长 x₁+x₂+p",fmt(x1+x2+pp)]);
        A.push(["最短 2p",fmt(2*pp)]);
      }
    }else{
      A.push(["焦点弦","—"]);
      A.push(["t₁·t₂","—"]);
    }
  }else if(s==="p_ecc"){
    A.push(["e",fmt(1)]);
    A.push(["说明","抛物线离心率恒为 1"]);
    A.push(["对比","e=1 是临界状态"]);
  }else if(s==="p_line"){
    const res=parabolaLineForm(pp,p.lm,p.ln,form);
    let rel;
    if(Math.abs(res.A)<1e-9)rel="水平直线（一个交点）";
    else rel=positionFromDisc(res.disc);
    A.push(["直线","y="+fmt(p.lm,2)+"x"+(p.ln>=0?"+":"−")+fmt(Math.abs(p.ln),2)]);
    A.push(["判别式 Δ",fmt(res.disc)]);
    A.push(["位置关系",rel]);
    A.push(["弦长",res.roots.length===2?fmt(chordLen(res.roots,p.lm)):"—"]);
  }else if(s==="p_tan"){
    const Pp=getP();
    A.push(["切点 P","("+fmt(Pp.x)+", "+fmt(Pp.y)+")"]);
    A.push(["切线","y₀y = p(x+x₀)"]);
    A.push(["y₀=0 时","切线为竖直线"]);
    A.push(["拓展","焦点弦两端切线交于准线"]);
  }else if(s==="p_mid"){
    const Pp=getP();
    let k=null;
    if(form===0||form===1)k=Math.abs(Pp.y)<0.05?null:(form===0?pp:-pp)/Pp.y;
    else k=(form===2?Pp.x:-Pp.x)/pp;
    A.push(["中点 M","("+fmt(Pp.x)+", "+fmt(Pp.y)+")"]);
    A.push(["弦斜率 k",k===null?"不存在":fmt(k,3)]);
    A.push(["点差法",form===0?"k=p/y₀":"按开口方向对应"]);
  }else if(s==="p_app"){
    A.push(["应用","平行光反射聚焦于焦点"]);
    A.push(["焦点","("+fmt(F.x)+", "+fmt(F.y)+")"]);
    A.push(["p",fmt(pp)]);
  }else if(s==="p_rel"){
    A.push(["抛物线 e",fmt(1)]);
    A.push(["椭圆 e","0<e<1"]);
    A.push(["双曲线 e","e>1"]);
    A.push(["结论","e=1 为临界"]);
  }
  return A;
}

/* =========================================================
   综合
   ========================================================= */
function panelSyn(s){
  const p=state.params;
  const A=[];
  if(s==="s_uni"){
    const Pp=getP();
    const e=p.e, d0=p.d0;
    const type=e<0.02?"圆":(e<1?"椭圆":(Math.abs(e-1)<0.02?"抛物线":"双曲线"));
    const pf=Math.hypot(Pp.x,Pp.y);
    const d=Math.abs(Pp.x+d0);
    A.push(["e",fmt(e,3)]);
    A.push(["曲线类型",type]);
    A.push(["极坐标方程","r=ed/(1−e·cosθ)"]);
    A.push(["θ",fmt(((p.t*180/Math.PI)%360+360)%360,1)+"°"]);
    A.push(["r=PF",fmt(pf)]);
    A.push(["d",fmt(d)]);
    A.push(["PF/d",d>0?fmt(pf/d,3):"—"]);
    A.push(["准线",e<0.02?"退化（e=0）":"x=−"+fmt(d0)]);
  }else if(s==="s_disc"){
    const idx=clamp(Math.round(p.discCase),0,6);
    const data=[
      ["圆",1,1,0,0,-4],
      ["椭圆",4,9,0,0,-36],
      ["双曲线",1,-1,0,0,-1],
      ["抛物线",0,1,-4,0,0],
      ["两直线",1,-1,0,0,0],
      ["一点",1,1,0,0,0],
      ["空集",1,1,0,0,1]
    ][idx];
    A.push(["类型",data[0]]);
    A.push(["A",fmt(data[1])]);
    A.push(["B",fmt(data[2])]);
    A.push(["D",fmt(data[3])]);
    A.push(["E",fmt(data[4])]);
    A.push(["F",fmt(data[5])]);
  }else if(s==="s_compare"){
    A.push(["圆","e=0, c=0"]);
    A.push(["椭圆","0<e<1, c²=a²−b²"]);
    A.push(["双曲线","e>1, c²=a²+b²"]);
    A.push(["抛物线","e=1"]);
    A.push(["通径","椭圆/双曲线 2b²/a；抛物线 2p"]);
  }else if(s==="s_table"){
    A.push(["圆","e=0"]);
    A.push(["椭圆","e<1"]);
    A.push(["双曲线","e>1"]);
    A.push(["抛物线","e=1"]);
    A.push(["说明","详见知识卡片"]);
  }else if(s==="s_line"){
    const m=p.lm,n=p.ln;
    let res,rel,typeName;
    if(p.ctype===0){
      const a=DEMO.ellA,b=DEMO.ellB;res=ellipseLine(a,b,m,n);
      rel=positionFromDisc(res.disc);typeName="椭圆";
    }else if(p.ctype===1){
      const a=DEMO.hypA,b=DEMO.hypB;res=hyperbolaLine(a,b,m,n);
      rel=res.parallel?"平行渐近线（一个交点）":positionFromDisc(res.disc);typeName="双曲线";
    }else{
      res=parabolaLineForm(DEMO.parP,m,n,0);
      rel=positionFromDisc(res.disc);typeName="抛物线";
    }
    A.push(["曲线类型",typeName]);
    A.push(["直线","y="+fmt(m,2)+"x"+(n>=0?"+":"−")+fmt(Math.abs(n),2)]);
    A.push(["Δ",fmt(res.disc)]);
    A.push(["关系",rel]);
    A.push(["弦长",res.roots.length===2?fmt(chordLen(res.roots,m)):"—"]);
  }else if(s==="s_chord"){
    const a=DEMO.ellA,b=DEMO.ellB;
    const x0=a*0.55*Math.cos(p.t), y0=b*0.55*Math.sin(p.t);
    const k=Math.abs(y0)<0.05?null:-b*b*x0/(a*a*y0);
    A.push(["中点 M","("+fmt(x0)+", "+fmt(y0)+")"]);
    A.push(["弦斜率 k",k===null?"不存在":fmt(k,3)]);
    A.push(["椭圆","k=−b²x₀/(a²y₀)"]);
    A.push(["双曲线","k=b²x₀/(a²y₀)"]);
    A.push(["抛物线","k=p/y₀"]);
  }else if(s==="s_polar"){
    const a=DEMO.ellA,b=DEMO.ellB;
    const x0=a*Math.cos(p.t),y0=b*Math.sin(p.t);
    A.push(["切点 P","("+fmt(x0)+", "+fmt(y0)+")"]);
    A.push(["椭圆切线","xx₀/a²+yy₀/b²=1"]);
    A.push(["双曲线切线","xx₀/a²−yy₀/b²=1"]);
    A.push(["抛物线切线","y₀y=p(x+x₀)"]);
    A.push(["极线","外点切点弦即极线"]);
  }else if(s==="s_fchord"){
    const a=DEMO.ellA,b=DEMO.ellB;
    A.push(["椭圆通径 2b²/a",fmt(2*b*b/a)]);
    A.push(["双曲线通径 2b²/a","同式"]);
    A.push(["抛物线通径 2p",fmt(2*DEMO.parP)]);
  }else if(s==="s_ftri"){
    const a=DEMO.ellA,b=DEMO.ellB,c=Math.sqrt(a*a-b*b);
    const aH=1.5,bH=Math.sqrt(Math.max(c*c-aH*aH,0));
    const Pp={x:a*Math.cos(p.t),y:b*Math.sin(p.t)};
    const v1={x:-c-Pp.x,y:-Pp.y},v2={x:c-Pp.x,y:-Pp.y};
    const pf1=Math.hypot(v1.x,v1.y),pf2=Math.hypot(v2.x,v2.y);
    const cosT=(v1.x*v2.x+v1.y*v2.y)/(pf1*pf2);
    const th=Math.acos(clamp(cosT,-1,1));
    A.push(["θ",fmt(th*180/Math.PI,1)+"°"]);
    A.push(["椭圆 S=b²tan(θ/2)",fmt(b*b*Math.tan(th/2))]);
    A.push(["双曲线 S=bH²/tan(θ/2)",fmt(bH*bH/Math.tan(th/2))]);
    A.push(["抛物线","只有一个焦点，无焦点三角形"]);
  }else if(s==="s_ecc"){
    const e=p.e;
    A.push(["e",fmt(e,3)]);
    A.push(["类型",e<0.02?"圆":(e<1?"椭圆":(Math.abs(e-1)<0.02?"抛物线":"双曲线"))]);
    A.push(["焦点","F(0,0)"]);
    A.push(["准线",e<0.02?"退化":"x=−"+fmt(p.d0)]);
  }else if(s==="s_circ"){
    const a=DEMO.ellA,b=clamp(p.bSlide,1e-3,a);
    const e=Math.sqrt(Math.max(a*a-b*b,0))/a;
    A.push(["a",fmt(a)]);
    A.push(["b",fmt(b)]);
    A.push(["e",fmt(e,3)]);
    A.push(["b=a 时","圆，e=0"]);
  }else if(s==="s_ellhyp"){
    const c=DEMO.synC,a1=DEMO.synEllA,a2=DEMO.synHypA;
    const b1=Math.sqrt(Math.max(a1*a1-c*c,0));
    const b2=Math.sqrt(Math.max(c*c-a2*a2,0));
    A.push(["公共 c",fmt(c)]);
    A.push(["椭圆 a,b,e",fmt(a1)+", "+fmt(b1)+", "+fmt(c/a1,3)]);
    A.push(["双曲线 a,b,e",fmt(a2)+", "+fmt(b2)+", "+fmt(c/a2,3)]);
  }else if(s==="s_hypPara"){
    A.push(["双曲线 e","e>1"]);
    A.push(["抛物线 e","e=1"]);
    A.push(["双曲线","有渐近线"]);
    A.push(["抛物线","无渐近线"]);
  }else if(s==="s_optics"){
    A.push(["椭圆","F₁→P→F₂ 反射"]);
    A.push(["双曲线","反射光反向延长过另一焦点"]);
    A.push(["抛物线","平行光聚焦于焦点"]);
  }else if(s==="s_extreme"){
    const a=DEMO.ellA,b=DEMO.ellB,c=Math.sqrt(a*a-b*b);
    A.push(["a",fmt(a)]);
    A.push(["c",fmt(c)]);
    A.push(["PF 最大 a+c",fmt(a+c)]);
    A.push(["PF 最小 a−c",fmt(a-c)]);
  }else if(s==="s_card"){
    A.push(["圆","e=0"]);
    A.push(["椭圆","0<e<1"]);
    A.push(["抛物线","e=1"]);
    A.push(["双曲线","e>1"]);
    A.push(["统一","PF/d=e"]);
  }
  return A;
}

  return"";
}

  const html=(CARDS[m]&&CARDS[m][s])?CARDS[m][s]:"";

<style>
/* 桌面端一级/二级按钮允许换行，避免横向挤压 */
@media (min-width:768px){
  #modules,#submodes{flex-wrap:wrap;overflow:visible}
}
</style>
<script>
/* =========================================================
   第八段：参数控件 / 校验应用 / 按钮 / 快捷键 / 初始化
   ========================================================= */

/* ---------- 数值输入显示格式 ---------- */
function fmtInput(v,step){
  if(!isNum(v))return"";
  const dec=step>=1?0:(step>=0.1?1:2);
  return (+v.toFixed(dec)).toString();
}

/* ---------- 当前场景参数描述表 ---------- */
let _specs={};
let _rows=[];

/* ---------- 应用参数（统一校验、钳制、同步、重绘） ---------- */
function applyParam(key,value){
  const spec=_specs[key];
  if(!isNum(value))return {ok:false,msg:"请输入有效数字"};
  if(spec&&typeof spec.check==="function"){
    const r=spec.check(value);
    if(r&&!r.ok)return r;
  }
  let v=value;
  if(spec){
    if(isNum(spec.min))v=Math.max(v,spec.min);
    if(isNum(spec.max))v=Math.min(v,spec.max);
    if(typeof spec.slide==="function")v=spec.slide(v);
  }
  state.params[key]=v;
  if(key==="Dg"||key==="Eg"||key==="Fg")syncGenFromDEF();
  syncControls();
  requestRender();
  return {ok:true,msg:""};
}
/* 由 D、E、F 反推圆心与半径；D²+E²−4F≤0 时半径置 0（触发校验失败） */
function syncGenFromDEF(){
  const p=state.params;
  const disc=p.Dg*p.Dg+p.Eg*p.Eg-4*p.Fg;
  p.h=-p.Dg/2;
  p.k=-p.Eg/2;
  p.r=disc>0?Math.sqrt(disc)/2:0;
}

/* ---------- 同步所有控件显示值 ---------- */
function syncControls(){
  for(const r of _rows){
    const v=state.params[r.key];
    if(!isNum(v))continue;
    r.range.value=v;
    if(document.activeElement!==r.num){
      r.num.value=fmtInput(v,r.step);
    }
  }
}

/* ---------- 生成一行参数控件 ---------- */
function makeRow(label,key,min,max,step,opt){
  opt=opt||{};
  _specs[key]={min:min,max:max,step:step,check:opt.check,slide:opt.slide};
  const el=document.createElement("div");
  el.className="prow";

  const lab=document.createElement("span");
  lab.className="plab";lab.textContent=label;

  const range=document.createElement("input");
  range.type="range";range.min=min;range.max=max;range.step=step;
  range.value=state.params[key];

  const num=document.createElement("input");
  num.type="text";num.className="pnum";
  num.inputMode="decimal";num.autocomplete="off";
  num.value=fmtInput(state.params[key],step);

  const minus=document.createElement("button");
  minus.className="pstep";minus.type="button";minus.textContent="−";
  const plus=document.createElement("button");
  plus.className="pstep";plus.type="button";plus.textContent="+";

  const err=document.createElement("span");
  err.className="perr";

  el.appendChild(lab);el.appendChild(range);el.appendChild(num);
  el.appendChild(minus);el.appendChild(plus);el.appendChild(err);
  $("params").appendChild(el);

  const row={key:key,el:el,range:range,num:num,err:err,step:step,min:min,max:max};
  _rows.push(row);

  /* 滑条：允许 slide 做数学约束修正 */
  range.addEventListener("input",function(){
    let v=parseFloat(range.value);
    if(opt.slide)v=opt.slide(v);
    if(!isNum(v))return;
    state.params[key]=v;
    if(key==="Dg"||key==="Eg"||key==="Fg")syncGenFromDEF();
    num.value=fmtInput(state.params[key],step);
    el.classList.remove("err");err.textContent="";
    requestRender();
  });

  /* 数字框提交 */
  function commit(){
    const raw=parseNum(num.value);
    const res=applyParam(key,raw);
    if(!res.ok){
      el.classList.add("err");
      err.textContent=res.msg;
      num.value=fmtInput(state.params[key],step);
    }else{
      el.classList.remove("err");
      err.textContent="";
    }
  }
  num.addEventListener("keydown",function(ev){
    if(ev.key==="Enter"){
      ev.preventDefault();commit();num.blur();
    }else if(ev.key==="Escape"){
      ev.preventDefault();
      num.value=fmtInput(state.params[key],step);
      el.classList.remove("err");err.textContent="";
      num.blur();
    }
  });
  num.addEventListener("blur",commit);
  num.addEventListener("focus",function(){
    setTimeout(function(){try{num.scrollIntoView({block:"center",behavior:"smooth"});}catch(e){}},250);
  });

  function stepBy(dir){
    const cur=isNum(state.params[key])?state.params[key]:0;
    const res=applyParam(key,cur+dir*step);
    if(!res.ok){el.classList.add("err");err.textContent=res.msg;}
    else{el.classList.remove("err");err.textContent="";}
  }
  minus.addEventListener("click",function(){stepBy(-1);});
  plus.addEventListener("click",function(){stepBy(1);});

  return row;
}

/* ---------- 选项按钮组 ---------- */
function makeChoice(label,opts,key){
  const row=document.createElement("div");
  row.className="choice-row";
  const lab=document.createElement("span");
  lab.className="plab";lab.textContent=label;
  row.appendChild(lab);
  opts.forEach(function(o){
    const b=document.createElement("button");
    b.type="button";
    b.className="btn"+(state.params[key]===o[0]?" sel":"");
    b.textContent=o[1];
    b.addEventListener("click",function(){
      state.params[key]=o[0];
      const btns=row.querySelectorAll("button");
      for(let i=0;i<btns.length;i++)btns[i].classList.remove("sel");
      b.classList.add("sel");
      requestRender();
    });
    row.appendChild(b);
  });
  $("params").appendChild(row);
}

/* ---------- 按模块/子模式构建控件 ---------- */
function buildControls(){
  $("params").innerHTML="";
  _specs={};_rows=[];
  const m=state.module, s=state.submode;

  const chkPos=function(v){
    return (isNum(v)&&v>0)?{ok:true}:{ok:false,msg:"数值必须大于 0"};
  };

  if(m==="circle"){
    if(s==="c_gen"){
      makeRow("D","Dg",-10,10,0.1);
      makeRow("E","Eg",-10,10,0.1);
      makeRow("F","Fg",-20,10,0.1);
    }else if(s==="c_cc"||s==="c_common"||s==="c_ctan"||s==="c_sys"){
      makeRow("h₂","h2",-8,8,0.1);
      makeRow("k₂","k2",-8,8,0.1);
      makeRow("r₁","r",0.5,4,0.1,{check:chkPos});
      makeRow("r₂","r2",0.5,4,0.1,{check:chkPos});
      if(s==="c_sys")makeRow("λ","lam",-3,3,0.1);
    }else if(s==="c_lc"||s==="c_chord"||s==="c_diam"){
      makeRow("h","h",-6,6,0.1);
      makeRow("k","k",-6,6,0.1);
      makeRow("r","r",0.5,5,0.1,{check:chkPos});
      makeRow("斜率","lm",-3,3,0.1);
      makeRow("截距","ln",-6,6,0.1);
    }else if(s==="c_ang"||s==="c_arc"){
      makeRow("r","r",0.5,5,0.1,{check:chkPos});
      makeRow("角度","ang",5,180,1);
    }else if(s==="c_pq"){
      makeRow("r","r",0.5,5,0.1,{check:chkPos});
      makeRow("Qx","qx",-8,8,0.1);
      makeRow("Qy","qy",-8,8,0.1);
    }else if(s==="c_tan"){
      makeRow("r","r",0.5,5,0.1,{check:chkPos});
      makeRow("Qx","px",-8,8,0.1);
      makeRow("Qy","py",-8,8,0.1);
    }else if(s==="c_sym"){
      makeRow("h","h",-6,6,0.1);
      makeRow("k","k",-6,6,0.1);
      makeRow("r","r",0.5,5,0.1,{check:chkPos});
    }else{
      makeRow("h","h",-6,6,0.1);
      makeRow("k","k",-6,6,0.1);
      makeRow("r","r",0.5,5,0.1,{check:chkPos});
    }
  }
  else if(m==="ellipse"){
    if(s==="e_circle"){
      makeRow("a","a",2,7,0.1,{check:chkPos});
      makeRow("b","bSlide",0.2,7,0.05,{
        check:chkPos,
        slide:function(v){return Math.min(v,P().a);}
      });
    }else{
      makeRow("a","a",2,7,0.1,{
        check:function(v){
          if(!(v>0))return {ok:false,msg:"a 必须大于 0"};
          if(v<=P().c)return {ok:false,msg:"a 必须大于 c，否则 b²=a²−c² 不为正"};
          return {ok:true};
        },
        slide:function(v){return Math.max(v,P().c+0.05);}
      });
      makeRow("c","c",0.2,6.5,0.05,{
        check:function(v){
          if(!(v>0))return {ok:false,msg:"c 必须大于 0"};
          if(v>=P().a)return {ok:false,msg:"c 必须小于 a"};
          return {ok:true};
        },
        slide:function(v){return Math.min(v,P().a-0.05);}
      });
      if(s==="e_line"||s==="e_fchord"){
        makeRow("斜率","lm",-3,3,0.1);
      }
      if(s==="e_line"){
        makeRow("截距","ln",-6,6,0.1);
      }
    }
  }
  else if(m==="hyperbola"){
    makeRow("a","a",0.5,5,0.1,{check:chkPos});
    makeRow("b","b",0.5,5,0.1,{check:chkPos});
    if(s==="h_line"){
      makeRow("斜率","lm",-3,3,0.1);
      makeRow("截距","ln",-6,6,0.1);
    }
    if(s==="h_fchord"){
      makeRow("斜率","lm",-3,3,0.1);
    }
  }
  else if(m==="parabola"){
    if(s!=="p_fchord"){
      makeChoice("开口",[[0,"y²=2px"],[1,"y²=−2px"],[2,"x²=2py"],[3,"x²=−2py"]],"pform");
    }
    makeRow("p","p",0.5,4,0.1,{check:chkPos});
    if(s==="p_fchord"){
      makeRow("斜率","lm",-2.5,2.5,0.1);
    }
    if(s==="p_line"){
      makeRow("斜率","lm",-3,3,0.1);
      makeRow("截距","ln",-6,6,0.1);
    }
  }
  else{
    if(s==="s_uni"||s==="s_ecc"){
      makeRow("e","e",0,2,0.01,{
        check:function(v){return (isNum(v)&&v>=0)?{ok:true}:{ok:false,msg:"e 必须大于或等于 0"};}
      });
      makeRow("d","d0",1,3,0.1,{check:chkPos});
    }else if(s==="s_disc"){
      makeRow("示例","discCase",0,6,1);
    }else if(s==="s_line"){
      makeChoice("曲线",[[0,"椭圆"],[1,"双曲线"],[2,"抛物线"]],"ctype");
      makeRow("斜率","lm",-3,3,0.1);
      makeRow("截距","ln",-6,6,0.1);
    }else if(s==="s_circ"){
      makeRow("b","bSlide",0.2,3,0.05,{check:chkPos});
    }else if(s==="s_fchord"){
      makeRow("斜率","lm",-2.5,2.5,0.1);
    }
  }

  syncControls();
}

/* ---------- 模块 / 子模式按钮 ---------- */
function buildModules(){
  const box=$("modules");
  box.innerHTML="";
  let i=0;
  for(const key in MODULES){
    const b=document.createElement("button");
    b.type="button";
    b.className="btn module"+(state.module===key?" sel":"");
    b.textContent=MODULES[key].name;
    b.setAttribute("data-module",key);
    b.addEventListener("click",function(){selectModule(key);});
    box.appendChild(b);
    i++;
  }
}
function buildSubmodes(){
  const box=$("submodes");
  box.innerHTML="";
  const subs=MODULES[state.module]?MODULES[state.module].subs:[];
  for(const it of subs){
    const b=document.createElement("button");
    b.type="button";
    b.className="btn sub"+(state.submode===it[0]?" sel":"");
    b.textContent=it[1];
    b.addEventListener("click",function(){selectSubmode(it[0]);});
    box.appendChild(b);
  }
}

/* ---------- 默认参数微调 ---------- */
function tuneDefaults(){
  const p=state.params;
  if(state.module==="circle"){
    if(state.submode==="c_common"||state.submode==="c_cc"||state.submode==="c_sys"){
      p.h2=3.0;p.k2=0;p.r2=2.6;
    }
    if(state.submode==="c_ctan"){
      p.h2=5.0;p.k2=0;p.r2=1.6;
    }
  }
}

/* ---------- 场景刷新 ---------- */
function applyScene(){
  resetParams();
  tuneDefaults();
  buildModules();
  buildSubmodes();
  buildControls();
  setFormula();
  syncControls();
  requestRender();
}
function selectModule(m){
  if(!MODULES[m])return;
  state.module=m;
  state.submode=MODULES[m].subs[0][0];
  state.anim.playing=false;
  updatePlayBtn();
  applyScene();
}
function selectSubmode(s){
  state.submode=s;
  state.anim.playing=false;
  updatePlayBtn();
  applyScene();
}
function selectModuleByIndex(i){
  const keys=Object.keys(MODULES);
  if(keys[i])selectModule(keys[i]);
}

/* ---------- 播放 / 缩放 ---------- */
function updatePlayBtn(){
  $("btnPlay").textContent=state.anim.playing?"⏸ 暂停":"▶ 播放";
}
function togglePlay(){
  state.anim.playing=!state.anim.playing;
  updatePlayBtn();
  requestRender();
}
function zoomBy(f){
  state.zoom=clamp(state.zoom*f,0.4,6);
  requestRender();
}
function resetView(){
  state.zoom=1;state.panX=0;state.panY=0;
  requestRender();
}
function doReset(){
  state.anim.playing=false;
  updatePlayBtn();
  resetParams();
  tuneDefaults();
  buildControls();
  setFormula();
  syncControls();
  requestRender();
}

/* ---------- 工具栏绑定 ---------- */
$("btnPlay").addEventListener("click",togglePlay);
$("btnStepBack").addEventListener("click",function(){stepT(-1);requestRender();});
$("btnStepFwd").addEventListener("click",function(){stepT(1);requestRender();});
$("btnReset").addEventListener("click",doReset);
$("btnZoomIn").addEventListener("click",function(){zoomBy(1.25);});
$("btnZoomOut").addEventListener("click",function(){zoomBy(1/1.25);});
$("btnZoomView").addEventListener("click",resetView);
$("btnHelp").addEventListener("click",function(){
  const hv=$("helpBox");
  hv.open=!hv.open;
  if(hv.open)hv.scrollIntoView({block:"nearest",behavior:"smooth"});
});

/* ---------- 开关 ---------- */
$("tgAux").addEventListener("change",function(e){state.showAux=e.target.checked;requestRender();});
$("tgCard").addEventListener("change",function(e){
  state.showCard=e.target.checked;
  $("cardBox").style.display=e.target.checked?"":"none";
});
$("tgLegend").addEventListener("change",function(e){
  state.showLegend=e.target.checked;
  $("legendBox").style.display=e.target.checked?"":"none";
});
$("tgGrid").addEventListener("change",function(e){state.showGrid=e.target.checked;requestRender();});
$("tgTicks").addEventListener("change",function(e){state.showTicks=e.target.checked;requestRender();});
$("tgFill").addEventListener("change",function(e){state.showFill=e.target.checked;requestRender();});
$("tgCoord").addEventListener("change",function(e){state.showCoord=e.target.checked;requestRender();});

/* ---------- 鼠标坐标显示 ---------- */
let _hover=null;
cv.addEventListener("pointermove",function(e){
  const r=cv.getBoundingClientRect();
  _hover={x:e.clientX-r.left,y:e.clientY-r.top};
  if(state.showCoord)requestRender();
});
cv.addEventListener("pointerleave",function(){
  _hover=null;
  if(state.showCoord)requestRender();
});
function drawCoordOverlay(){
  if(!state.showCoord||!_hover)return;
  if(!isNum(H)||H<=0)return;
  const mx=MX(_hover.x), my=MY(_hover.y);
  if(!isNum(mx)||!isNum(my))return;
  const s="("+fmt(mx,2)+", "+fmt(my,2)+")";
  ctx.font="11px sans-serif";
  const w=ctx.measureText(s).width+12;
  ctx.fillStyle="rgba(255,255,255,.88)";
  ctx.fillRect(8,H-28,w,20);
  ctx.strokeStyle="#cbd5e1";ctx.lineWidth=1;ctx.setLineDash([]);
  ctx.strokeRect(8,H-28,w,20);
  ctx.fillStyle="#475569";ctx.textAlign="left";ctx.textBaseline="middle";
  ctx.fillText(s,14,H-18);
}
/* 在原始 render 之后叠加坐标文字 */
(function wrapRender(){
  const base=render;
  render=function(){
    base();
    drawCoordOverlay();
  };
})();

/* ---------- 键盘快捷键 ---------- */
document.addEventListener("keydown",function(e){
  const tag=(e.target&&e.target.tagName)?e.target.tagName.toLowerCase():"";
  const editing=(tag==="input"||tag==="textarea"||tag==="select");
  if(editing)return;

  if(e.code==="Space"){e.preventDefault();togglePlay();return;}
  if(e.key==="ArrowLeft"){e.preventDefault();stepT(-1);requestRender();return;}
  if(e.key==="ArrowRight"){e.preventDefault();stepT(1);requestRender();return;}
  if(e.key==="+"||e.key==="="){e.preventDefault();zoomBy(1.25);return;}
  if(e.key==="-"||e.key==="_"){e.preventDefault();zoomBy(1/1.25);return;}
  if(e.key==="0"){e.preventDefault();resetView();return;}
  if(e.key==="r"||e.key==="R"){e.preventDefault();doReset();return;}
  if(e.key>="1"&&e.key<="5"){e.preventDefault();selectModuleByIndex(parseInt(e.key,10)-1);return;}
});

/* ---------- 参数导入 / 导出 ---------- */
$("btnCopyParams").addEventListener("click",function(){
  const data={module:state.module,submode:state.submode,params:{}};
  for(const k in state.params){
    if(Object.prototype.hasOwnProperty.call(state.params,k))data.params[k]=state.params[k];
  }
  const txt=JSON.stringify(data,null,2);
  $("pasteBox").value=txt;
  $("ioMsg").style.color="#059669";
  $("ioMsg").textContent="已生成参数文本，可手动复制。";
  try{ $("pasteBox").focus(); $("pasteBox").select(); }catch(e){}
});
$("btnApplyPaste").addEventListener("click",function(){
  const txt=$("pasteBox").value.trim();
  const msg=$("ioMsg");
  if(!txt){msg.style.color="#dc2626";msg.textContent="粘贴内容为空。";return;}
  let obj=null;
  try{ obj=JSON.parse(txt); }catch(e){ obj=null; }

  if(!obj){
    /* 退化为 key=value 行解析 */
    obj={params:{}};
    const lines=txt.split(/[\n,;]+/);
    for(const line of lines){
      const kv=line.split("=");
      if(kv.length===2){
        const k=kv[0].trim();
        const v=parseFloat(kv[1]);
        if(isNum(v))obj.params[k]=v;
      }
    }
  }

  const flat=(obj&&obj.params)?obj.params:obj;
  if(!flat||typeof flat!=="object"){msg.style.color="#dc2626";msg.textContent="无法解析参数文本。";return;}

  if(obj&&obj.module&&MODULES[obj.module])state.module=obj.module;
  if(obj&&obj.submode)state.submode=obj.submode;

  resetParams();
  let count=0;
  for(const k in flat){
    if(!Object.prototype.hasOwnProperty.call(state.params,k))continue;
    const v=parseFloat(flat[k]);
    if(isNum(v)){state.params[k]=v;count++;}
  }
  tuneDefaults();
  buildModules();
  buildSubmodes();
  buildControls();
  setFormula();
  syncControls();
  requestRender();

  msg.style.color="#059669";
  msg.textContent="已应用 "+count+" 项参数。";
});

/* ---------- 初始化 ---------- */
function init(){
  buildLegend();
  buildModules();
  buildSubmodes();
  buildControls();
  setFormula();
  updatePlayBtn();
  observeCanvasSize();
  resize();
  requestAnimationFrame(loop);
}
init();
</script>
