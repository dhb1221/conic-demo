<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>高中圆、椭圆、双曲线、抛物线及圆锥曲线综合交互演示</title>
<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --ink:#0f172a; --muted:#64748b;
  --line:#e3e8f0; --line-2:#cbd5e1;
  --primary:#2f5bea; --primary-soft:#eef2ff; --primary-line:#c7d2fe;
  --accent:#0ea5e9;
  --danger:#dc2626; --danger-soft:#fef2f2;
  --ok:#059669;
  --r:12px; --r-sm:9px; --sp:12px;
  --shadow:0 2px 12px rgba(15,23,42,.06);
  --shadow-soft:0 1px 4px rgba(15,23,42,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
body{padding:10px 10px 36px;max-width:1600px;margin:0 auto}

h1{font-size:18px;line-height:1.35;margin:2px 0 10px;text-align:center;font-weight:700;letter-spacing:.2px}
h2{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:600;letter-spacing:.3px}

/* ---------- 顶部标题与帮助 ---------- */
.app-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.app-header h1{flex:1;margin:0;text-align:center}
#btnHelp{flex:0 0 auto;min-width:40px;min-height:40px;border-radius:50%;
  border:1px solid var(--line);background:#fff;color:var(--muted);font-size:15px;font-weight:700;
  cursor:pointer;box-shadow:var(--shadow-soft)}
#btnHelp:active{background:#eef2f7}

/* ---------- 一级 / 二级按钮 ---------- */
#modules,#submodes{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;padding:2px 1px 6px;
  -webkit-overflow-scrolling:touch;scrollbar-width:thin}
#modules::-webkit-scrollbar,#submodes::-webkit-scrollbar{height:4px}
#modules::-webkit-scrollbar-thumb,#submodes::-webkit-scrollbar-thumb{background:#dbe3ee;border-radius:2px}
.btn{flex:0 0 auto;min-height:44px;padding:8px 12px;border:1px solid var(--line);background:#fff;
  border-radius:var(--r-sm);font-size:15px;color:var(--ink);cursor:pointer;
  touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;
  white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn:active{background:#eef2f7}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 一级模块：更强的视觉权重 */
.btn.module{font-size:15px;font-weight:600;background:#fff;color:#334155;border-color:var(--line)}
.btn.module.sel{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(47,91,234,.25)}
/* 二级子模式：次级、轻量 */
.btn.sub{min-height:40px;font-size:13.5px;font-weight:500;background:#fff;color:#475569;border-color:var(--line)}
.btn.sub.sel{background:var(--primary-soft);border-color:var(--primary-line);color:var(--primary);font-weight:600}

/* ---------- 页面布局：手机单列，桌面两栏 ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:8px}
.stage{min-width:0;display:flex;flex-direction:column;gap:10px}
.side{min-width:0;display:flex;flex-direction:column;gap:10px}

.card-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:12px;box-shadow:var(--shadow-soft)}

/* ---------- 画布与错误提示 ---------- */
.canvas-wrap{position:relative;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:8px;box-shadow:var(--shadow)}
canvas{display:block;width:100%;height:clamp(260px,45vh,420px);background:#fff;
  border-radius:var(--r-sm);touch-action:none;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none}
#errBox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  max-width:84%;padding:10px 14px;border-radius:10px;background:rgba(255,255,255,.94);
  border:1px solid #fca5a5;color:#b91c1c;font-size:13px;line-height:1.5;text-align:center;
  display:none;pointer-events:none;box-shadow:0 6px 20px rgba(15,23,42,.10);z-index:3}

/* ---------- 工具栏 ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.toolbar .btn{min-height:40px;font-size:13.5px;padding:6px 11px;background:#fff;color:#334155}
.toolbar .btn.strong{background:var(--primary);color:#fff;border-color:var(--primary)}
.toolbar .btn.strong:active{background:#224bd0}

/* ---------- 参数行 ---------- */
.prow{display:flex;align-items:center;gap:6px;min-height:46px;flex-wrap:wrap;padding:2px 0}
.prow .plab{flex:0 0 64px;font-size:12px;color:var(--muted);line-height:1.2}
.prow input[type=range]{flex:1 1 96px;min-width:56px;height:34px;accent-color:var(--primary)}
.prow .pnum{flex:0 0 68px;height:36px;font-size:13px;text-align:right;
  border:1px solid var(--line-2);border-radius:8px;padding:0 6px;background:#fff;color:var(--ink);
  font-variant-numeric:tabular-nums;transition:border-color .15s,box-shadow .15s}
.prow .pnum:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.prow.err .pnum{border-color:var(--danger);background:var(--danger-soft);box-shadow:0 0 0 3px #fee2e2}
.prow .pstep{flex:0 0 30px;height:34px;padding:0;font-size:16px;line-height:1;border-radius:8px;
  border:1px solid var(--line);background:#fff;color:#475569;cursor:pointer;touch-action:manipulation}
.prow .pstep:active{background:#eef2f7}
.prow .pstep:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.prow .perr{flex:1 1 100%;font-size:11.5px;color:var(--danger);display:none;padding-left:2px;line-height:1.4}
.prow.err .perr{display:block}

/* ---------- 选项按钮组 ---------- */
.choice-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:4px 0;min-height:42px}
.choice-row .plab{flex:0 0 64px;font-size:12px;color:var(--muted)}
.choice-row .btn{min-height:38px;font-size:13px;padding:6px 10px;background:#fff;color:#475569}
.choice-row .btn.sel{background:var(--primary-soft);border-color:var(--primary-line);color:var(--primary);font-weight:600}

/* ---------- 开关 ---------- */
.toggle-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tgl{display:inline-flex;align-items:center;gap:6px;min-height:40px;font-size:12.5px;background:#fff;
  border:1px solid var(--line);border-radius:9px;padding:5px 10px;cursor:pointer;
  color:#475569;touch-action:manipulation}
.tgl input{width:17px;height:17px;accent-color:var(--primary);margin:0}
.tgl:focus-within{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- 数值面板 ---------- */
#panel{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.vchip{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:5px 7px;min-width:0}
.vchip .l{color:var(--muted);display:block;font-size:11px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vchip b{font-weight:600;font-variant-numeric:tabular-nums;word-break:break-all;font-size:12.5px}

/* ---------- 知识卡片 ---------- */
details.card{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;box-shadow:var(--shadow-soft)}
details.card summary{padding:11px 12px;font-weight:600;cursor:pointer;background:#f8fafc;
  list-style:none;font-size:13.5px;color:#334155}
details.card summary::-webkit-details-marker{display:none}
details.card summary::before{content:"▸ ";color:var(--primary);font-weight:700}
details.card[open] summary::before{content:"▾ "}
details.card .body{padding:12px;font-size:13px;color:#334155;border-top:1px solid var(--line);line-height:1.65}
details.card .body table{border-collapse:collapse;width:100%;font-size:12px}
details.card .body td,details.card .body th{border:1px solid var(--line);padding:4px 6px;text-align:center}
details.card .body b{color:var(--primary)}

/* ---------- 参数导入导出 ---------- */
details.io{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-soft)}
details.io summary{padding:10px 12px;font-size:12.5px;font-weight:600;cursor:pointer;list-style:none;background:#f8fafc;color:#475569}
details.io summary::-webkit-details-marker{display:none}
details.io .body{padding:10px 12px;border-top:1px solid var(--line)}
details.io textarea{width:100%;min-height:60px;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;
  border:1px solid var(--line-2);border-radius:8px;padding:6px;margin-top:6px;resize:vertical;background:#fff;color:var(--ink)}
details.io textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
details.io .msg{font-size:12px;color:var(--danger);margin-top:4px;min-height:16px}
details.io .btn{min-height:38px;font-size:12.5px}

/* ---------- 图例 ---------- */
#legend{display:flex;flex-wrap:wrap;gap:6px}
#legend .li{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:#fff;
  border:1px solid var(--line);border-radius:8px;padding:4px 8px;color:#475569}
#legend .sw{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.15)}
#legend .ln{width:16px;height:0;border-top:2px solid;display:inline-block}

/* ---------- 快捷键帮助 ---------- */
.kbd{display:inline-block;min-width:20px;padding:1px 5px;border:1px solid var(--line-2);
  border-bottom-width:2px;border-radius:5px;background:#f8fafc;font-size:11px;
  font-family:ui-monospace,Menlo,Consolas,monospace;color:#475569;margin-right:4px}
.help-table{width:100%;font-size:12px;border-collapse:collapse}
.help-table td{padding:4px 2px;border-bottom:1px dashed var(--line);color:#475569}
.help-table tr:last-child td{border-bottom:none}

.hidden{display:none!important}

/* ---------- 平板：两栏 ---------- */
@media (min-width:768px){
  body{padding:14px 16px 40px}
  h1{font-size:20px;text-align:left;margin:0}
  .app-header{margin-bottom:10px}
  .layout{grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start;margin-top:10px}
  .side{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto;padding-right:2px}
  canvas{height:clamp(420px,60vh,720px)}
  #panel{grid-template-columns:repeat(3,minmax(0,1fr))}
  .toolbar .btn{min-height:36px;font-size:13px}
  .btn.module{font-size:14.5px}
}
/* ---------- 宽屏：更大绘图区 ---------- */
@media (min-width:1280px){
  .layout{grid-template-columns:minmax(0,1fr) 390px;gap:16px}
  #panel{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stage{gap:12px}
}
/* ---------- 手机横屏：压缩 Canvas ---------- */
@media (max-height:520px) and (orientation:landscape){
  canvas{height:clamp(220px,55vh,360px)}
  h1{font-size:16px}
  body{padding:8px 10px 24px}
}
/* ---------- 减弱动效 ---------- */
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
/* ---------- 桌面端 hover 轻微反馈 ---------- */
@media (hover:hover) and (pointer:fine){
  .btn:hover{border-color:var(--line-2);background:#fafbfe}
  .btn.module.sel:hover{background:#2a51d6}
  .btn.sub.sel:hover{background:#e4eafe}
  .pstep:hover{background:#f1f5f9}
  .tgl:hover{border-color:var(--line-2)}
}
</style>
</head>
<body>

<header class="app-header">
  <h1>高中圆、椭圆、双曲线、抛物线及圆锥曲线综合交互演示</h1>
  <button id="btnHelp" title="快捷键说明" aria-label="快捷键说明">?</button>
</header>

<nav id="modules" aria-label="一级模块"></nav>
<nav id="submodes" aria-label="二级子模式"></nav>

<main class="layout">
  <section class="stage">
    <div class="canvas-wrap">
      <canvas id="cv"></canvas>
      <div id="errBox" role="status" aria-live="polite"></div>
    </div>
  </section>

  <aside class="side">
    <div class="card-box">
      <h2>参数控制</h2>
      <div class="toolbar" id="toolbar">
        <button id="btnPlay" class="btn strong">▶ 播放</button>
        <button id="btnStepBack" class="btn">◀ 单步</button>
        <button id="btnStepFwd" class="btn">单步 ▶</button>
        <button id="btnReset" class="btn">重置</button>
        <button id="btnZoomIn" class="btn">＋</button>
        <button id="btnZoomOut" class="btn">－</button>
        <button id="btnZoomView" class="btn">复位视图</button>
      </div>
      <div id="params"></div>
      <div class="toggle-row">
        <label class="tgl"><input type="checkbox" id="tgAux" checked>辅助线</label>
        <label class="tgl"><input type="checkbox" id="tgCard" checked>知识卡片</label>
        <label class="tgl"><input type="checkbox" id="tgLegend" checked>图例</label>
        <label class="tgl"><input type="checkbox" id="tgGrid" checked>网格</label>
        <label class="tgl"><input type="checkbox" id="tgTicks" checked>刻度</label>
        <label class="tgl"><input type="checkbox" id="tgFill" checked>填充</label>
        <label class="tgl"><input type="checkbox" id="tgCoord">坐标</label>
      </div>
      <details class="io">
        <summary>参数导入 / 导出</summary>
        <div class="body">
          <button id="btnCopyParams" class="btn">复制当前参数</button>
          <textarea id="pasteBox" placeholder="在此粘贴参数文本，然后点击“应用粘贴”"></textarea>
          <button id="btnApplyPaste" class="btn" style="margin-top:6px">应用粘贴</button>
          <div class="msg" id="ioMsg"></div>
        </div>
      </details>
    </div>

    <div class="card-box">
      <h2>数值面板</h2>
      <div id="panel"></div>
    </div>

    <details class="card" id="cardBox">
      <summary id="cardTitle">知识卡片</summary>
      <div class="body" id="cardBody"></div>
    </details>

    <div class="card-box" id="legendBox">
      <h2>图例</h2>
      <div id="legend"></div>
    </div>

    <details class="card" id="helpBox">
      <summary>键盘快捷键</summary>
      <div class="body">
        <table class="help-table">
          <tr><td><span class="kbd">Space</span>播放 / 暂停</td><td><span class="kbd">R</span>重置</td></tr>
          <tr><td><span class="kbd">←</span><span class="kbd">→</span>单步后退 / 前进</td><td><span class="kbd">+</span><span class="kbd">−</span>放大 / 缩小</td></tr>
          <tr><td><span class="kbd">0</span>复位视图</td><td><span class="kbd">1</span>~<span class="kbd">5</span>切换模块</td></tr>
          <tr><td><span class="kbd">Enter</span>应用输入</td><td><span class="kbd">Esc</span>取消输入</td></tr>
        </table>
      </div>
    </details>
  </aside>
</main>

<script>
"use strict";
/* =========================================================
   第一段：基础工具 / 画布坐标 / 颜色图例 / 绘制基础
   ========================================================= */

/* ---------- 通用工具 ---------- */
function $(id){return document.getElementById(id);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function isNum(v){return typeof v==="number"&&isFinite(v);}
/* 数值格式化：非有限值统一显示“—” */
function fmt(v,d){
  if(!isNum(v))return"—";
  if(Math.abs(v)<1e-12)v=0;
  d=(d===undefined)?2:d;
  return (+v.toFixed(d)).toString();
}
/* 安全除法：分母为 0 或非有限返回 null */
function safeDiv(a,b){
  if(!isNum(a)||!isNum(b)||Math.abs(b)<1e-12)return null;
  const r=a/b;
  return isFinite(r)?r:null;
}
/* 解析数字输入：空、非数字、Infinity 均返回 NaN */
function parseNum(str){
  const t=String(str==null?"":str).trim();
  if(t===""||t==="+"||t==="-")return NaN;
  if(!/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(t))return NaN;
  const v=parseFloat(t);
  return isFinite(v)?v:NaN;
}

/* ---------- 画布与坐标变换 ---------- */
const cv=$("cv"),ctx=cv.getContext("2d");
let W=0,H=0,DPR=1,cx=0,cy=0;
const view={ox:0,oy:0,ext:5,scale:40};

function resize(){
  DPR=window.devicePixelRatio||1;
  const r=cv.getBoundingClientRect();
  W=r.width;H=r.height;
  if(W<=0||H<=0)return;
  cv.width=Math.round(W*DPR);
  cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cx=W/2;cy=H/2;
  if(typeof requestRender==="function")requestRender();
}
/* 使用 ResizeObserver 监听容器尺寸（窗口缩放/分栏/浏览器缩放） */
function observeCanvasSize(){
  if(typeof ResizeObserver!=="undefined"){
    try{
      const ro=new ResizeObserver(()=>resize());
      ro.observe(cv.parentElement);
    }catch(e){}
  }
  window.addEventListener("resize",resize);
  window.addEventListener("orientationchange",()=>setTimeout(resize,120));
}

function X(x){return cx+(x-view.ox)*view.scale;}
function Y(y){return cy-(y-view.oy)*view.scale;}
function MX(px){return (px-cx)/view.scale+view.ox;}
function MY(py){return (cy-py)/view.scale+view.oy;}
/* 自动取景 + 用户缩放/平移叠加 */
function setView(ox,oy,ext){
  const st=(typeof state!=="undefined")?state:null;
  const z=(st&&isNum(st.zoom)&&st.zoom>0)?st.zoom:1;
  const px=(st&&isNum(st.panX))?st.panX:0;
  const py=(st&&isNum(st.panY))?st.panY:0;
  view.ext=ext/z;
  view.ox=ox+px;
  view.oy=oy+py;
  const m=Math.min(W,H);
  view.scale=Math.max(6,(m/2-18)/view.ext);
}

/* ---------- 颜色与图例 ---------- */
const COL={
  circle:"#2563eb",ellipse:"#16a34a",hyperbola:"#7c3aed",parabola:"#db2777",
  focus:"#dc2626",directrix:"#64748b",asymptote:"#9333ea",chord:"#0d9488",
  tangent:"#ea580c",aux:"#94a3b8",pointP:"#e11d48",center:"#475569",
  grid:"#eef2f7",axis:"#0f172a",area:"rgba(250,204,21,.16)"
};
const LEGEND=[
  ["圆",COL.circle],["椭圆",COL.ellipse],["双曲线",COL.hyperbola],["抛物线",COL.parabola],
  ["焦点",COL.focus],["准线",COL.directrix],["渐近线",COL.asymptote],["弦",COL.chord],
  ["切线",COL.tangent],["辅助线",COL.aux],["动点P",COL.pointP]
];
function buildLegend(){
  $("legend").innerHTML=LEGEND.map(function(l){
    return '<span class="li"><span class="sw" style="background:'+l[1]+'"></span>'+l[0]+'</span>';
  }).join("");
}

/* ---------- 绘制基础 ---------- */
function dash(b){ctx.setLineDash(b?[6,5]:[]);}
function seg(x1,y1,x2,y2,col,w,d){
  if(!isNum(x1)||!isNum(y1)||!isNum(x2)||!isNum(y2))return;
  ctx.strokeStyle=col;ctx.lineWidth=w||1.5;dash(d);
  ctx.beginPath();ctx.moveTo(X(x1),Y(y1));ctx.lineTo(X(x2),Y(y2));ctx.stroke();
}
/* 过两点无限延伸：斜率无穷时走竖直线分支，避免 NaN */
function lineThru(x1,y1,x2,y2,col,w,d){
  if(!isNum(x1)||!isNum(y1)||!isNum(x2)||!isNum(y2))return;
  const xL=view.ox-view.ext*1.7, xR=view.ox+view.ext*1.7;
  if(Math.abs(x2-x1)<1e-9){
    seg(x1,view.oy-view.ext*1.7,x1,view.oy+view.ext*1.7,col,w,d);
    return;
  }
  const m=(y2-y1)/(x2-x1);
  if(!isFinite(m)){
    seg(x1,view.oy-view.ext*1.7,x1,view.oy+view.ext*1.7,col,w,d);
    return;
  }
  const b=y1-m*x1;
  seg(xL,m*xL+b,xR,m*xR+b,col,w,d);
}
function vline(x,col,w,d){
  if(!isNum(x))return;
  seg(x,view.oy-view.ext*1.7,x,view.oy+view.ext*1.7,col,w,d);
}
function hline(y,col,w,d){
  if(!isNum(y))return;
  seg(view.ox-view.ext*1.7,y,view.ox+view.ext*1.7,y,col,w,d);
}
function dot(x,y,col,r){
  if(!isNum(x)||!isNum(y))return;
  ctx.fillStyle=col;
  ctx.beginPath();ctx.arc(X(x),Y(y),r||5,0,Math.PI*2);ctx.fill();
}
function txt(s,x,y,col,size,align,off){
  if(!isNum(x)||!isNum(y))return;
  ctx.fillStyle=col||"#334155";ctx.font=(size||12)+"px sans-serif";
  ctx.textAlign=align||"center";ctx.textBaseline="middle";
  ctx.fillText(String(s),X(x)+(off?off[0]:0),Y(y)-(off?off[1]:0));
}
function labelP(s,x,y,col,dx,dy){txt(s,x,y,col||COL.pointP,12,"center",[dx||0,dy||0]);}
function fillTriangle(a,b,c,col){
  if(!a||!b||!c)return;
  if(!isNum(a.x)||!isNum(a.y)||!isNum(b.x)||!isNum(b.y)||!isNum(c.x)||!isNum(c.y))return;
  ctx.beginPath();
  ctx.moveTo(X(a.x),Y(a.y));ctx.lineTo(X(b.x),Y(b.y));ctx.lineTo(X(c.x),Y(c.y));
  ctx.closePath();ctx.fillStyle=col||COL.area;ctx.fill();
}
/* 自适应刻度间隔 */
function niceStep(ext){
  if(!isNum(ext)||ext<=0)return 1;
  const raw=ext/4,p=Math.pow(10,Math.floor(Math.log10(raw))),r=raw/p;
  if(r<1.5)return p;
  if(r<3.5)return 2*p;
  if(r<7.5)return 5*p;
  return 10*p;
}
/* 坐标轴 / 网格 / 刻度，受开关控制 */
function drawAxes(){
  const st=(typeof state!=="undefined")?state:{showGrid:true,showTicks:true};
  const xL=view.ox-view.ext*1.5,xR=view.ox+view.ext*1.5;
  const yD=view.oy-view.ext*1.3,yU=view.oy+view.ext*1.3;
  const step=niceStep(view.ext);

  if(st.showGrid){
    ctx.strokeStyle=COL.grid;ctx.lineWidth=1;dash(false);
    for(let g=Math.ceil(xL/step)*step;g<=xR;g+=step){
      if(!isNum(g))continue;
      ctx.beginPath();ctx.moveTo(X(g),Y(yD));ctx.lineTo(X(g),Y(yU));ctx.stroke();
    }
    for(let g=Math.ceil(yD/step)*step;g<=yU;g+=step){
      if(!isNum(g))continue;
      ctx.beginPath();ctx.moveTo(X(xL),Y(g));ctx.lineTo(X(xR),Y(g));ctx.stroke();
    }
  }

  seg(xL,0,xR,0,COL.axis,1.5);
  seg(0,yD,0,yU,COL.axis,1.5);
  txt("x",xR,0,"#475569",11,"left",[4,10]);
  txt("y",0,yU,"#475569",11,"center",[10,-8]);
  txt("O",0,0,"#94a3b8",10,"right",[-4,-6]);

  if(st.showTicks){
    for(let g=Math.ceil(xL/step)*step;g<=xR;g+=step){
      if(Math.abs(g)<1e-9)continue;
      txt(fmt(g,1),g,0,"#94a3b8",9,"center",[0,-8]);
    }
    for(let g=Math.ceil(yD/step)*step;g<=yU;g+=step){
      if(Math.abs(g)<1e-9)continue;
      txt(fmt(g,1),0,g,"#94a3b8",9,"right",[-5,0]);
    }
  }
}

<script>
/* =========================================================
   第二段：曲线绘制 / 二次方程求解 / 直线与圆锥曲线交点
   ========================================================= */

/* ---------- 圆的绘制 ---------- */
function drawCircle(h,k,r,col,w){
  if(!isNum(h)||!isNum(k)||!isNum(r)||r<=0)return;
  ctx.strokeStyle=col||COL.circle;ctx.lineWidth=w||2.5;dash(false);
  ctx.beginPath();ctx.arc(X(h),Y(k),r*view.scale,0,Math.PI*2);ctx.stroke();
}

/* ---------- 椭圆的绘制（t ∈ [0,2π]，完整闭合） ---------- */
function drawEllipse(a,b,col,w){
  if(!isNum(a)||!isNum(b)||a<=0||b<=0)return;
  ctx.strokeStyle=col||COL.ellipse;ctx.lineWidth=w||2.5;dash(false);
  ctx.beginPath();
  const N=180;
  for(let i=0;i<=N;i++){
    const t=i/N*Math.PI*2;
    const x=a*Math.cos(t), y=b*Math.sin(t);
    if(i===0)ctx.moveTo(X(x),Y(y)); else ctx.lineTo(X(x),Y(y));
  }
  ctx.closePath();
  ctx.stroke();
}

/* ---------- 双曲线的绘制（左右两支，cosh/sinh 参数） ---------- */
function drawHyperbola(a,b,col,w){
  if(!isNum(a)||!isNum(b)||a<=0||b<=0)return;
  ctx.strokeStyle=col||COL.hyperbola;ctx.lineWidth=w||2.5;dash(false);
  const bound=view.ext*2.2;
  /* 反解 u 的采样上限：a·cosh(u) = bound */
  let U=Math.acosh(Math.max(bound/a,1.0001));
  if(!isNum(U))U=3;
  U=Math.min(U,6);
  for(const s of [1,-1]){
    ctx.beginPath();
    let started=false;
    const N=90;
    for(let i=-N;i<=N;i++){
      const u=U*i/N;
      const x=s*a*Math.cosh(u), y=b*Math.sinh(u);
      if(!isNum(x)||!isNum(y)){started=false;continue;}
      if(Math.abs(x)>view.ext*2.3||Math.abs(y)>view.ext*2.3){started=false;continue;}
      if(!started){ctx.moveTo(X(x),Y(y));started=true;}
      else ctx.lineTo(X(x),Y(y));
    }
    ctx.stroke();
  }
}

/* ---------- 抛物线的绘制（四种开口方向） ----------
   form 0: y²= 2px   1: y²=-2px   2: x²= 2py   3: x²=-2py
----------------------------------------------------- */
function paraPoint(p,t,form){
  if(!isNum(p)||!isNum(t))return {x:NaN,y:NaN};
  switch(form){
    case 0: return {x: 2*p*t*t, y: 2*p*t};
    case 1: return {x:-2*p*t*t, y: 2*p*t};
    case 2: return {x: 2*p*t,   y: 2*p*t*t};
    case 3: return {x: 2*p*t,   y:-2*p*t*t};
  }
  return {x:NaN,y:NaN};
}
function paraFocus(p,form){
  if(!isNum(p))return {x:NaN,y:NaN};
  switch(form){
    case 0: return {x: p/2, y:0};
    case 1: return {x:-p/2, y:0};
    case 2: return {x:0, y: p/2};
    case 3: return {x:0, y:-p/2};
  }
  return {x:NaN,y:NaN};
}
function paraDirectrix(p,form){
  if(!isNum(p))return {x:NaN};
  switch(form){
    case 0: return {x:-p/2};
    case 1: return {x: p/2};
    case 2: return {y:-p/2};
    case 3: return {y: p/2};
  }
  return {x:NaN};
}
/* 由图坐标反推参数 t（拖动吸附用） */
function paraSnapT(mx,my,p,form){
  if(!isNum(mx)||!isNum(my)||!isNum(p)||p<=0)return 0;
  return (form===0||form===1) ? my/(2*p) : mx/(2*p);
}
function drawParabola(p,form,col,w){
  if(!isNum(p)||p<=0)return;
  ctx.strokeStyle=col||COL.parabola;ctx.lineWidth=w||2.5;dash(false);
  ctx.beginPath();
  let started=false;
  const T=2.6, N=320;
  for(let i=-N;i<=N;i++){
    const t=T*i/N;
    const pt=paraPoint(p,t,form);
    if(!isNum(pt.x)||!isNum(pt.y)){started=false;continue;}
    if(Math.abs(pt.x)>view.ext*2.1||Math.abs(pt.y)>view.ext*2.1){started=false;continue;}
    if(!started){ctx.moveTo(X(pt.x),Y(pt.y));started=true;}
    else ctx.lineTo(X(pt.x),Y(pt.y));
  }
  ctx.stroke();
}

/* ---------- 抛物线在某点的切线 ----------
   返回 {vertical:true,x} 或 {vertical:false,m,n}
----------------------------------------------------- */
function paraTangent(p,form,x0,y0){
  if(!isNum(p)||!isNum(x0)||!isNum(y0))return null;
  if(form===0||form===1){
    if(Math.abs(y0)<1e-9)return {vertical:true,x:x0};
    const m=(form===0? p : -p)/y0;
    return {vertical:false,m:m,n:y0-m*x0};
  }
  const m=(form===2? x0 : -x0)/p;
  return {vertical:false,m:m,n:y0-m*x0};
}

/* ---------- 统一定义曲线：r = e·d/(1−e·cosθ)，焦点在原点 ----------
   e=0 退化为圆；e=1 抛物线；其余椭圆/双曲线
   对分母趋近 0 的 θ 跳过，避免巨大坐标
----------------------------------------------------- */
function drawUnified(e,d0,col,w){
  if(!isNum(e)||!isNum(d0)||e<0||d0<=0)return;
  if(e<0.02){
    drawCircle(0,0,d0,col||COL.circle,w||2.5);
    return;
  }
  ctx.strokeStyle=col||COL.hyperbola;ctx.lineWidth=w||2.5;dash(false);
  ctx.beginPath();
  let started=false;
  const N=520, RMAX=view.ext*2.2;
  for(let i=0;i<=N;i++){
    const t=i/N*Math.PI*2;
    const den=1-e*Math.cos(t);
    if(Math.abs(den)<1e-4){started=false;continue;}
    const r=e*d0/den;
    if(!isNum(r)||Math.abs(r)>RMAX){started=false;continue;}
    const x=r*Math.cos(t), y=r*Math.sin(t);
    if(!isNum(x)||!isNum(y)){started=false;continue;}
    if(Math.abs(x)>RMAX||Math.abs(y)>RMAX){started=false;continue;}
    if(!started){ctx.moveTo(X(x),Y(y));started=true;}
    else ctx.lineTo(X(x),Y(y));
  }
  ctx.stroke();
}

/* ---------- 一元二次方程求根（过滤非有限根） ---------- */
function solveQuad(A,B,C){
  if(!isNum(A)||!isNum(B)||!isNum(C))return [];
  if(Math.abs(A)<1e-12){
    if(Math.abs(B)<1e-12)return [];
    const x=-C/B;
    return isNum(x)?[x]:[];
  }
  const d=B*B-4*A*C;
  if(!isNum(d)||d<0)return [];
  if(Math.abs(d)<1e-9){
    const x=-B/(2*A);
    return isNum(x)?[x]:[];
  }
  const s=Math.sqrt(d);
  const x1=(-B-s)/(2*A), x2=(-B+s)/(2*A);
  const out=[];
  if(isNum(x1))out.push(x1);
  if(isNum(x2))out.push(x2);
  out.sort(function(a,b){return a-b;});
  return out;
}

/* 判别式 → 位置关系 */
function positionFromDisc(disc,eps){
  if(!isNum(disc))return"—";
  eps=eps||1e-8;
  if(disc>eps)return"相交";
  if(Math.abs(disc)<=eps)return"相切";
  return"相离";
}

/* ---------- 直线与圆 ---------- */
function circleLine(h,k,r,m,n){
  if(!isNum(h)||!isNum(k)||!isNum(r)||r<=0||!isNum(m)||!isNum(n))
    return {roots:[],d:NaN,disc:NaN};
  const A=1+m*m;
  const B=2*m*(n-k)-2*h;
  const C=h*h+(n-k)*(n-k)-r*r;
  const disc=B*B-4*A*C;
  /* 圆心到直线距离 d=|m·h - k + n|/√(m²+1) */
  const d=Math.abs(m*h-k+n)/Math.sqrt(m*m+1);
  return {roots:solveQuad(A,B,C),d:d,disc:disc};
}

/* ---------- 直线与椭圆 x²/a² + y²/b² = 1 ---------- */
function ellipseLine(a,b,m,n){
  if(!isNum(a)||!isNum(b)||a<=0||b<=0||!isNum(m)||!isNum(n))
    return {roots:[],disc:NaN};
  const A=b*b+a*a*m*m;
  const B=2*a*a*m*n;
  const C=a*a*(n*n-b*b);
  const disc=B*B-4*A*C;
  return {roots:solveQuad(A,B,C),disc:disc};
}

/* ---------- 直线与双曲线 x²/a² - y²/b² = 1 ----------
   A≈0 表示直线与渐近线平行，此时只有一个交点
--------------------------------------------------- */
function hyperbolaLine(a,b,m,n){
  if(!isNum(a)||!isNum(b)||a<=0||b<=0||!isNum(m)||!isNum(n))
    return {roots:[],disc:NaN,parallel:false,A:NaN};
  const A=b*b-a*a*m*m;
  const B=-2*a*a*m*n;
  const C=-a*a*(n*n+b*b);
  const disc=B*B-4*A*C;
  return {roots:solveQuad(A,B,C),disc:disc,parallel:Math.abs(A)<1e-9,A:A};
}

/* ---------- 直线与抛物线（四种开口方向通用） ----------
   全部以 x 为未知量；返回 x 的根与判别式
--------------------------------------------------- */
function parabolaLineForm(p,m,n,form){
  if(!isNum(p)||p<=0||!isNum(m)||!isNum(n))
    return {roots:[],disc:NaN,A:NaN};
  let A,B,C;
  if(form===0){        /* y²=2px：m²x²+(2mn-2p)x+n²=0 */
    A=m*m; B=2*m*n-2*p; C=n*n;
  }else if(form===1){  /* y²=-2px：m²x²+(2mn+2p)x+n²=0 */
    A=m*m; B=2*m*n+2*p; C=n*n;
  }else if(form===2){  /* x²=2py：x²-2pmx-2pn=0 */
    A=1; B=-2*p*m; C=-2*p*n;
  }else{               /* x²=-2py：x²+2pmx+2pn=0 */
    A=1; B=2*p*m; C=2*p*n;
  }
  const disc=B*B-4*A*C;
  return {roots:solveQuad(A,B,C),disc:disc,A:A};
}

/* 由 x 的根生成交点（直线 y=mx+n） */
function pointsFromRoots(roots,m,n){
  if(!roots||roots.length===0)return [];
  const out=[];
  for(const x of roots){
    const y=m*x+n;
    if(isNum(x)&&isNum(y))out.push({x:x,y:y});
  }
  return out;
}

/* 弦长：|x₂-x₁|·√(1+m²) */
function chordLen(roots,m){
  if(!roots||roots.length!==2)return null;
  if(!isNum(roots[0])||!isNum(roots[1])||!isNum(m))return null;
  const L=Math.abs(roots[1]-roots[0])*Math.sqrt(1+m*m);
  return isNum(L)?L:null;
}

    ["s_ftri","焦点三角形"],["s_ecc","离心率变化"],["s_circ","圆↔椭圆"],["s_ellhyp","椭圆↔双曲线"],
    ["s_hypPara","双曲线↔抛物线"],["s_optics","光学性质"],["s_extreme","轨迹与最值"],["s_card","综合卡片"]]}
};

/* ---------- 全局状态 ---------- */
const state={
  module:"circle",
  submode:"c_def",
  params:{},
  anim:{playing:false,dir:1},
  drag:null,
  showAux:true,
  showCard:true,
  showLegend:true,
  showGrid:true,
  showTicks:true,
  showFill:true,
  showCoord:false,
  zoom:1,
  panX:0,
  panY:0
};
let needRender=true, lastTs=0;

function P(){return state.params;}

/* ---------- 默认参数 ---------- */
function resetParams(){
  const p=state.params;
  p.t=0;
  /* 圆 */
  p.h=0;p.k=0;p.r=2.5;
  p.qx=3.6;p.qy=1.6;
  p.px=4.6;p.py=2.6;
  p.lm=0.6;p.ln=0.9;
  p.h2=4.6;p.k2=0;p.r2=1.6;
  p.ang=42;
  p.lam=0.5;
  p.Dg=0;p.Eg=0;p.Fg=-6.25;
  /* 椭圆 */
  p.a=3;p.c=1.8;
  /* 双曲线 */
  p.b=1.5;
  /* 抛物线 */
  p.p=2;p.pform=0;
  /* 综合 */
  p.e=0.6;p.d0=2;p.ctype=0;p.discCase=0;
  p.bSlide=1.4;
  /* 视图与动画 */
  state.anim.dir=1;
  state.zoom=1;state.panX=0;state.panY=0;
}

/* ---------- 派生量 ---------- */
function eb(){                                     /* 椭圆短半轴 */
  const p=P();
  const v=p.a*p.a-p.c*p.c;
  return v>0?Math.sqrt(v):NaN;
}
function hc(){                                     /* 双曲线半焦距 */
  const p=P();
  const v=p.a*p.a+p.b*p.b;
  return v>0?Math.sqrt(v):NaN;
}
function he(){                                     /* 双曲线离心率 */
  const c=hc();
  return (isNum(c)&&P().a>0)?c/P().a:NaN;
}

/* ---------- 动点 P ---------- */
function getP(){
  const p=state.params;
  if(state.module==="circle"){
    if(!isNum(p.h)||!isNum(p.k)||!isNum(p.r)||p.r<=0)return {x:NaN,y:NaN};
    return {x:p.h+p.r*Math.cos(p.t), y:p.k+p.r*Math.sin(p.t)};
  }
  if(state.module==="ellipse"){
    const b=(state.submode==="e_circle")?clamp(p.bSlide,1e-6,p.a):eb();
    if(!isNum(p.a)||!isNum(b))return {x:NaN,y:NaN};
    return {x:p.a*Math.cos(p.t), y:b*Math.sin(p.t)};
  }
  if(state.module==="hyperbola"){
    /* cosh/sinh 参数：连续、无 π/2 奇点 */
    if(!isNum(p.a)||!isNum(p.b))return {x:NaN,y:NaN};
    const u=1.3*Math.sin(p.t);
    const right=Math.cos(p.t)>=0;
    return {x:(right?1:-1)*p.a*Math.cosh(u), y:p.b*Math.sinh(u)};
  }
  if(state.module==="parabola"){
    return paraPoint(p.p,p.t,p.pform);
  }
  return uniPoint(p.e,p.d0,p.t);
}

/* 焦点—准线统一形式：r = e·d/(1−e·cosθ) */
function uniPoint(e,d0,t){
  if(!isNum(e)||!isNum(d0))return {x:NaN,y:NaN};
  if(e<0.02)return {x:d0*Math.cos(t), y:d0*Math.sin(t)};
  if(Math.abs(e-1)<0.02){
    const pp=d0;
    return {x:2*pp*t*t-pp/2, y:2*pp*t};
  }
  const den=1-e*Math.cos(t);
  if(Math.abs(den)<1e-4)return {x:NaN,y:NaN};
  const r=e*d0/den;
  return {x:r*Math.cos(t), y:r*Math.sin(t)};
}

/* =========================================================
   参数校验器：返回 {ok, msg}
   ========================================================= */
function circleBase(p){
  if(!isNum(p.h)||!isNum(p.k))return {ok:false,msg:"圆心坐标必须是有限数"};
  if(!isNum(p.r)||p.r<=0)return {ok:false,msg:"半径 r 必须大于 0"};
  return {ok:true,msg:""};
}
function twoCircleBase(p){
  const b=circleBase(p);
  if(!b.ok)return b;
  if(!isNum(p.h2)||!isNum(p.k2))return {ok:false,msg:"第二个圆心坐标必须是有限数"};
  if(!isNum(p.r2)||p.r2<=0)return {ok:false,msg:"半径 r₂ 必须大于 0"};
  return {ok:true,msg:""};
}
function ellipseBase(p){
  if(!isNum(p.a)||p.a<=0)return {ok:false,msg:"a 必须大于 0"};
  if(!isNum(p.c)||p.c<=0)return {ok:false,msg:"c 必须大于 0"};
  if(p.c>=p.a)return {ok:false,msg:"a 必须大于 c，否则 b²=a²−c² 不为正，椭圆不存在"};
  return {ok:true,msg:""};
}
function hyperBase(p){
  if(!isNum(p.a)||p.a<=0)return {ok:false,msg:"实半轴 a 必须大于 0"};
  if(!isNum(p.b)||p.b<=0)return {ok:false,msg:"虚半轴 b 必须大于 0"};
  return {ok:true,msg:""};
}
function parabolaBase(p){
  if(!isNum(p.p)||p.p<=0)return {ok:false,msg:"参数 p 必须大于 0"};
  return {ok:true,msg:""};
}
function unifiedBase(p){
  if(!isNum(p.e)||p.e<0)return {ok:false,msg:"离心率 e 必须大于或等于 0"};
  if(!isNum(p.d0)||p.d0<=0)return {ok:false,msg:"准线距离 d 必须大于 0"};
  return {ok:true,msg:""};
}

const VALIDATORS={
  circle:{
    c_def:circleBase,c_std:circleBase,c_par:circleBase,c_pq:circleBase,
    c_lc:circleBase,c_chord:circleBase,c_diam:circleBase,c_tan:circleBase,
    c_ang:circleBase,c_arc:circleBase,c_sym:circleBase,
    c_gen:function(p){
      if(!isNum(p.Dg)||!isNum(p.Eg)||!isNum(p.Fg))
        return {ok:false,msg:"D、E、F 必须是有限数"};
      const disc=p.Dg*p.Dg+p.Eg*p.Eg-4*p.Fg;
      if(!(disc>0))return {ok:false,msg:"D²+E²−4F ≤ 0，该方程不表示圆"};
      if(!isNum(p.r)||p.r<=0)return {ok:false,msg:"半径 r 必须大于 0"};
      return {ok:true,msg:""};
    },
    c_cc:twoCircleBase,c_common:twoCircleBase,c_ctan:twoCircleBase,c_sys:twoCircleBase
  },
  ellipse:{
    e_def1:ellipseBase,e_def2:ellipseBase,e_def3:ellipseBase,e_std:ellipseBase,
    e_par:ellipseBase,e_elem:ellipseBase,e_fr:ellipseBase,e_ftri:ellipseBase,
    e_fchord:ellipseBase,e_mid:ellipseBase,e_ecc:ellipseBase,e_dir:ellipseBase,
    e_line:ellipseBase,e_tan:ellipseBase,
    e_circle:function(p){
      if(!isNum(p.a)||p.a<=0)return {ok:false,msg:"半长轴 a 必须大于 0"};
      if(!isNum(p.bSlide)||p.bSlide<=0)return {ok:false,msg:"半短轴 b 必须大于 0"};
      return {ok:true,msg:""};
    }
  },
  hyperbola:{
    h_def1:hyperBase,h_def2:hyperBase,h_def3:hyperBase,h_std:hyperBase,h_par:hyperBase,
    h_elem:hyperBase,h_asy:hyperBase,h_conj:hyperBase,h_fr:hyperBase,h_ftri:hyperBase,
    h_fchord:hyperBase,h_mid:hyperBase,h_ecc:hyperBase,h_dir:hyperBase,h_line:hyperBase,
    h_tan:hyperBase,h_ell:hyperBase
  },
  parabola:{
    p_def:parabolaBase,p_std:parabolaBase,p_fd:parabolaBase,p_par:parabolaBase,
    p_fr:parabolaBase,p_lr:parabolaBase,p_fchord:parabolaBase,p_ecc:parabolaBase,
    p_line:parabolaBase,p_tan:parabolaBase,p_mid:parabolaBase,p_app:parabolaBase,p_rel:parabolaBase
  },
  synthesis:{
    s_uni:unifiedBase,s_ecc:unifiedBase,
    s_circ:function(p){
      if(!isNum(p.a)||p.a<=0)return {ok:false,msg:"半长轴 a 必须大于 0"};
      if(!isNum(p.bSlide)||p.bSlide<=0)return {ok:false,msg:"半短轴 b 必须大于 0"};
      return {ok:true,msg:""};
    }
  }
};

function validateCurrent(){
  const m=state.module,s=state.submode;
  const f=VALIDATORS[m]&&VALIDATORS[m][s];
  if(typeof f!=="function")return {ok:true,msg:""};
  try{
    const r=f(state.params);
    if(r&&typeof r.ok==="boolean")return r;
  }catch(e){}
  return {ok:true,msg:""};
}

/* =========================================================
   视图范围
   ========================================================= */
function computeView(){
  const p=state.params, m=state.module, s=state.submode;

  if(m==="circle"){
    const r=(isNum(p.r)&&p.r>0)?p.r:2.5;
    const h=isNum(p.h)?p.h:0, k=isNum(p.k)?p.k:0;
    if(s==="c_cc"||s==="c_common"||s==="c_ctan"||s==="c_sys"){
      const h2=isNum(p.h2)?p.h2:h, k2=isNum(p.k2)?p.k2:k;
      const r2=(isNum(p.r2)&&p.r2>0)?p.r2:1.6;
      const d=Math.hypot(h2-h,k2-k);
      setView((h+h2)/2,(k+k2)/2,Math.max(3,(d+r+r2)/2*1.35));
      return;
    }
    if(s==="c_pq"){
      const qx=isNum(p.qx)?p.qx:h+r, qy=isNum(p.qy)?p.qy:k;
      setView(h,k,Math.max(r*1.5,Math.hypot(qx-h,qy-k)*1.3,2));
      return;
    }
    if(s==="c_tan"){
      const px=isNum(p.px)?p.px:h+r*2, py=isNum(p.py)?p.py:k;
      setView(h,k,Math.max(r*1.7,Math.hypot(px-h,py-k)*1.2,2));
      return;
    }
    if(s==="c_lc"||s==="c_chord"||s==="c_diam"){
      const ln=isNum(p.ln)?p.ln:k;
      setView(h,k,Math.max(r*1.7,Math.abs(ln-k)+r,2));
      return;
    }
    setView(h,k,Math.max(r*1.7,2));
    return;
  }

  if(m==="ellipse"){
    const a=(isNum(p.a)&&p.a>0)?p.a:3;
    if(s==="e_circle"){
      const bb=(isNum(p.bSlide)&&p.bSlide>0)?p.bSlide:a*0.6;
      setView(0,0,Math.max(a,bb,2)*1.45);
      return;
    }
    const b=(isNum(p.a)&&isNum(p.c)&&p.a>p.c)?Math.sqrt(p.a*p.a-p.c*p.c):a*0.6;
    if(s==="e_def2"||s==="e_dir"){
      const c=(isNum(p.c)&&p.c>0)?p.c:a*0.6;
      const d=a*a/c;
      setView(0,0,clamp(Math.max(a*1.5,d*0.8),a*1.3,a*4));
      return;
    }
    setView(0,0,Math.max(a,b,2)*1.45);
    return;
  }

  if(m==="hyperbola"){
    const a=(isNum(p.a)&&p.a>0)?p.a:2;
    const b=(isNum(p.b)&&p.b>0)?p.b:1.5;
    const c=Math.sqrt(a*a+b*b);
    if(s==="h_def2"||s==="h_dir"){
      const d=a*a/c;
      setView(0,0,clamp(Math.max(a*1.5,d*0.8),a*1.3,a*4));
      return;
    }
    if(s==="h_line"){setView(0,0,Math.max(a*1.9,3));return;}
    setView(0,0,Math.max(a*1.4,b*1.2,2.5));
    return;
  }

  if(m==="parabola"){
    const pp=(isNum(p.p)&&p.p>0)?p.p:2;
    setView(0,0,Math.max(2*pp*1.7,2*pp,2.5)*1.25);
    return;
  }

  if(m==="synthesis"){
    if(s==="s_uni"||s==="s_ecc"){
      const e=(isNum(p.e)&&p.e>=0)?p.e:0.6;
      const d0=(isNum(p.d0)&&p.d0>0)?p.d0:2;
      const b=uniBounds(e,d0);
      setView((b.xmin+b.xmax)/2,(b.ymin+b.ymax)/2,
        Math.max(2.2,Math.max(b.xmax-b.xmin,b.ymax-b.ymin)/2*1.3));
      return;
    }
    if(s==="s_ellhyp"||s==="s_hypPara"){setView(0,0,4.6);return;}
    setView(0,0,4.5);
    return;
  }
}

/* 统一定义的包络范围（半径封顶，避免巨大坐标） */
function uniBounds(e,d0){
  let xmin=1e9,xmax=-1e9,ymin=1e9,ymax=-1e9;
  if(!isNum(e)||e<0)e=0;
  if(!isNum(d0)||d0<=0)d0=2;
  if(e<0.02)return {xmin:-d0,xmax:d0,ymin:-d0,ymax:d0};
  for(let i=0;i<=360;i++){
    const t=i/360*Math.PI*2;
    let r;
    if(Math.abs(e-1)<0.02){
      const c=1-Math.cos(t);
      r=Math.abs(c)<0.01?20:d0/c;
    }else{
      const den=1-e*Math.cos(t);
      r=Math.abs(den)<1e-4?20:e*d0/den;
    }
    if(!isNum(r)||Math.abs(r)>20)r=(r>0?20:-20);
    const x=r*Math.cos(t), y=r*Math.sin(t);
    if(isNum(x)){if(x<xmin)xmin=x;if(x>xmax)xmax=x;}
    if(isNum(y)){if(y<ymin)ymin=y;if(y>ymax)ymax=y;}
  }
  if(xmin>xmax){xmin=-3;xmax=3;ymin=-3;ymax=3;}
  return {xmin,xmax,ymin,ymax};
}

/* ---------- 错误占位提示 ---------- */
function showError(msg){
  const box=$("errBox");
  box.textContent="当前参数无法构成有效图形："+msg;
  box.style.display="block";
}
function hideError(){
  const box=$("errBox");
  box.style.display="none";
  box.textContent="";
}

/* =========================================================
   可拖动点
   ========================================================= */
function getDragPoints(){
  const p=state.params, m=state.module, s=state.submode, list=[];

  function snapCircle(mx,my){p.t=Math.atan2(my-p.k,mx-p.h);}
  function snapEllipse(mx,my){
    const b=(s==="e_circle")?clamp(p.bSlide,1e-6,p.a):eb();
    if(!isNum(p.a)||!isNum(b)||b<=0)return;
    p.t=Math.atan2(my/b,mx/p.a);
  }
  function snapHyperbola(mx,my){
    if(!isNum(p.a)||!isNum(p.b)||p.a<=0||p.b<=0)return;
    /* 与 cosh/sinh 参数配套的反解 */
    const u=Math.asinh(clamp(my/p.b,-2.5,2.5));
    const sn=clamp(u/1.3,-1,1);
    let t=Math.asin(sn);
    if(mx<0)t=Math.PI-t;
    t=((t%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
    p.t=t;
  }
  function snapParabola(mx,my){
    p.t=clamp(paraSnapT(mx,my,p.p,p.pform),-1.7,1.7);
  }

  if(m==="circle"){
    if(s==="c_pq"){
      list.push({get:function(){return {x:p.qx,y:p.qy};},onDrag:function(mx,my){p.qx=mx;p.qy=my;}});
    }else if(s==="c_tan"){
      list.push({get:function(){return {x:p.px,y:p.py};},onDrag:function(mx,my){p.px=mx;p.py=my;}});
    }else if(s==="c_cc"||s==="c_common"||s==="c_ctan"||s==="c_sys"){
      list.push({get:function(){return {x:p.h2,y:p.k2};},onDrag:function(mx,my){p.h2=mx;p.k2=my;}});
    }else if(s!=="c_sym"){
      list.push({get:getP,onDrag:snapCircle});
    }
  }else if(m==="ellipse"){
    list.push({get:getP,onDrag:snapEllipse});
  }else if(m==="hyperbola"){
    list.push({get:getP,onDrag:snapHyperbola});
  }else if(m==="parabola"){
    list.push({get:getP,onDrag:snapParabola});
  }else if(m==="synthesis"){
    if(s==="s_uni"||s==="s_ecc"){
      list.push({get:getP,onDrag:function(mx,my){p.t=Math.atan2(my,mx);}});
    }
  }
  return list;
}

/* =========================================================
   指针事件：拖点 / 单指平移 / 双指缩放 / 滚轮缩放
   ========================================================= */
function evPos(e){
  const r=cv.getBoundingClientRect();
  return {px:e.clientX-r.left, py:e.clientY-r.top};
}
const _ptrs=new Map();
let _mode=null,_pan0=null,_pinch0=null;

cv.addEventListener("pointerdown",function(e){
  const q=evPos(e);
  _ptrs.set(e.pointerId,{x:q.px,y:q.py});
  try{cv.setPointerCapture(e.pointerId);}catch(err){}

  if(_ptrs.size===2){
    const vals=Array.from(_ptrs.values());
    const a=vals[0], b=vals[1];
    _mode="pinch"; state.drag=null;
    _pinch0={
      dist:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)),
      zoom:state.zoom,
      cx:(a.x+b.x)/2, cy:(a.y+b.y)/2,
      panX:state.panX, panY:state.panY
    };
    e.preventDefault();
    return;
  }

  if(_ptrs.size===1){
    const pts=getDragPoints();
    let best=null,bd=1e9;
    for(const pt of pts){
      const g=pt.get();
      if(!isNum(g.x)||!isNum(g.y))continue;
      const d=Math.hypot(q.px-X(g.x),q.py-Y(g.y));
      if(d<bd){bd=d;best=pt;}
    }
    if(bd<32&&best){
      _mode="drag"; state.drag=best;
    }else{
      _mode="pan"; state.drag=null;
      _pan0={x:q.px,y:q.py,panX:state.panX,panY:state.panY};
    }
    e.preventDefault();
  }
});

cv.addEventListener("pointermove",function(e){
  if(!_ptrs.has(e.pointerId))return;
  const q=evPos(e);
  _ptrs.set(e.pointerId,{x:q.px,y:q.py});

  if(_mode==="pinch"&&_ptrs.size>=2&&_pinch0){
    const vals=Array.from(_ptrs.values());
    const a=vals[0], b=vals[1];
    const dist=Math.hypot(a.x-b.x,a.y-b.y);
    state.zoom=clamp(_pinch0.zoom*dist/_pinch0.dist,0.4,6);
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const sc=view.scale||40;
    state.panX=_pinch0.panX+(mx-_pinch0.cx)/sc;
    state.panY=_pinch0.panY-(my-_pinch0.cy)/sc;
    e.preventDefault();requestRender();return;
  }

  if(_mode==="pan"&&_pan0){
    const sc=view.scale||40;
    state.panX=_pan0.panX+(q.px-_pan0.x)/sc;
    state.panY=_pan0.panY-(q.py-_pan0.y)/sc;
    e.preventDefault();requestRender();return;
  }

  if(_mode==="drag"&&state.drag){
    state.drag.onDrag(MX(q.px),MY(q.py));
    e.preventDefault();requestRender();
  }
});

function _endPointer(e){
  _ptrs.delete(e.pointerId);
  if(_ptrs.size===0){
    _mode=null;state.drag=null;_pan0=null;_pinch0=null;
  }else if(_ptrs.size===1){
    const p=Array.from(_ptrs.values())[0];
    _mode="pan";state.drag=null;
    _pan0={x:p.x,y:p.y,panX:state.panX,panY:state.panY};
    _pinch0=null;
  }
}
cv.addEventListener("pointerup",_endPointer);
cv.addEventListener("pointercancel",_endPointer);

cv.addEventListener("wheel",function(e){
  e.preventDefault();
  const f=e.deltaY<0?1.12:1/1.12;
  state.zoom=clamp(state.zoom*f,0.4,6);
  requestRender();
},{passive:false});

/* =========================================================
   动画推进与单步
   ========================================================= */
function advance(dt){
  const p=state.params, m=state.module;
  if(m==="parabola"){
    p.t+=dt*1.1*state.anim.dir;
    if(p.t>1.7){p.t=1.7;state.anim.dir=-1;}
    if(p.t<-1.7){p.t=-1.7;state.anim.dir=1;}
  }else{
    const speed=(m==="hyperbola")?0.9:1.3;
    p.t=(p.t+dt*speed)%(Math.PI*2);
  }
}
function stepT(dir){
  const p=state.params, m=state.module;
  if(m==="parabola"){
    p.t=clamp(p.t+dir*0.12,-1.7,1.7);
  }else{
    p.t=((p.t+dir*0.12)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
  }
}

/* =========================================================
   主渲染
   ========================================================= */
function requestRender(){needRender=true;}

let panelTick=0;
function render(){
  if(W<=0||H<=0)return;
  ctx.clearRect(0,0,W,H);
  computeView();
  drawAxes();

  const v=validateCurrent();
  if(v.ok){
    hideError();
    drawScene();
  }else{
    showError(v.msg||"参数不合法");
  }

  panelTick++;
  if(!state.anim.playing||panelTick%4===0)updatePanel();
}

function loop(ts){
  if(!lastTs)lastTs=ts;
  const dt=Math.min(0.05,(ts-lastTs)/1000);
  lastTs=ts;
  if(state.anim.playing){advance(dt);needRender=true;}
  if(needRender){render();needRender=false;}
  requestAnimationFrame(loop);
}
</script>

<script>
/* =========================================================
   第四段：圆模块场景绘制
   ========================================================= */

/* 从圆外一点求两切点（返回 null 表示无切线） */
function tangentPointsFromPoint(ox,oy,r,px,py){
  const d=Math.hypot(px-ox,py-oy);
  if(!isNum(d)||d<=r+1e-9)return null;
  const al=Math.atan2(py-oy,px-ox);
  const phi=Math.acos(clamp(r/d,-1,1));
  return [
    {x:ox+r*Math.cos(al+phi), y:oy+r*Math.sin(al+phi)},
    {x:ox+r*Math.cos(al-phi), y:oy+r*Math.sin(al-phi)}
  ];
}

function drawCircleScene(s){
  const p=state.params;
  const h=p.h, k=p.k, r=p.r;
  const aux=state.showAux, fill=state.showFill;
  const Pp=getP();

  /* 基础圆与圆心 */
  drawCircle(h,k,r,COL.circle,2.5);
  dot(h,k,COL.center,4);

  switch(s){

    /* ---------- 定义 ---------- */
    case "c_def":{
      if(aux)seg(h,k,Pp.x,Pp.y,COL.aux,1.5,true);
      dot(Pp.x,Pp.y,COL.pointP,5);

      break;
    }

    /* ---------- 标准方程 ---------- */
    case "c_std":{
      dot(Pp.x,Pp.y,COL.pointP,5);
      labelP("P",Pp.x,Pp.y,COL.pointP,10,-10);
      txt("O",h,k,"#475569",12,"right",[-6,-6]);
      if(aux){
        seg(h,k,h+r,k,COL.focus,1.8);
        dot(h+r,k,COL.focus,3);
        txt("r",h+r/2,k,"#b91c1c",11,"center",[0,-10]);
        seg(h,k,Pp.x,Pp.y,COL.aux,1.4,true);
      }
      break;
    }

    /* ---------- 一般方程 ---------- */
    case "c_gen":{
      txt("O",h,k,"#475569",12,"right",[-6,-6]);
      if(aux){
        seg(h,k,h+r,k,COL.aux,1.4,true);
        seg(h,k,h,k+r,COL.aux,1.4,true);
      }
      break;
    }

    /* ---------- 参数方程 ---------- */
    case "c_par":{
      seg(h,k,Pp.x,Pp.y,COL.aux,1.5,true);
      ctx.strokeStyle=COL.chord;ctx.lineWidth=1.6;dash(false);
      ctx.beginPath();ctx.arc(X(h),Y(k),Math.min(0.7,0.45*r)*view.scale,0,-p.t,true);ctx.stroke();
      dot(Pp.x,Pp.y,COL.pointP,5);
      labelP("P(θ)",Pp.x,Pp.y,COL.pointP,14,-12);
      txt("θ",h+0.55*r*Math.cos(p.t/2),k+0.55*r*Math.sin(p.t/2),COL.chord,12);
      txt("O",h,k,"#475569",12,"right",[-6,-6]);
      break;
    }

    /* ---------- 点与圆 ---------- */
    case "c_pq":{
      const d=Math.hypot(p.qx-h,p.qy-k);
      let col="#0ea5e9", rel="圆内";
      if(Math.abs(d-r)<0.05){col="#16a34a";rel="圆上";}
      else if(d>r){col="#ef4444";rel="圆外";}
      dot(p.qx,p.qy,col,6);
      labelP("Q",p.qx,p.qy,"#0f172a",12,-12);
      txt(rel,p.qx,p.qy,col,11,"center",[0,16]);
      if(aux){
        seg(h,k,p.qx,p.qy,COL.aux,1.4,true);
        seg(h,k,h+r,k,COL.focus,1.4,true);
        txt("r",h+r/2,k,"#b91c1c",10,"center",[0,-9]);
      }
      txt("O",h,k,"#475569",12,"right",[-6,-6]);
      break;
    }

    /* ---------- 直线与圆 ---------- */
    case "c_lc":{
      const m=p.lm, n=p.ln;
      lineThru(-1,m*(-1)+n,1,m*1+n,COL.chord,2);
      const res=circleLine(h,k,r,m,n);
      if(res.roots.length===2){
        const pts=pointsFromRoots(res.roots,m,n);
        if(pts.length===2){
          seg(pts[0].x,pts[0].y,pts[1].x,pts[1].y,COL.chord,3.5);
          dot(pts[0].x,pts[0].y,"#0d9488",4);
          dot(pts[1].x,pts[1].y,"#0d9488",4);
          if(aux){
            const mx=(pts[0].x+pts[1].x)/2, my=(pts[0].y+pts[1].y)/2;
            seg(h,k,mx,my,COL.aux,1.5,true);
            dot(mx,my,"#64748b",3);
            txt("d",(h+mx)/2,(k+my)/2,"#64748b",10,"left",[3,0]);
          }
        }
      }else if(Math.abs(res.disc)<1e-8&&res.roots.length===1){
        const pts=pointsFromRoots(res.roots,m,n);
        if(pts.length===1){
          dot(pts[0].x,pts[0].y,COL.tangent,5);
          labelP("切点",pts[0].x,pts[0].y,COL.tangent,16,-12);
        }
      }
      txt("O",h,k,"#475569",12,"right",[-6,-6]);
      break;
    }

    /* ---------- 弦长公式 ---------- */
    case "c_chord":{
      const m=p.lm, n=p.ln;
      lineThru(-1,m*(-1)+n,1,m*1+n,COL.chord,2);
      const res=circleLine(h,k,r,m,n);
      if(res.roots.length===2){
        const pts=pointsFromRoots(res.roots,m,n);
        if(pts.length===2){
          seg(pts[0].x,pts[0].y,pts[1].x,pts[1].y,COL.chord,3.5);
          const mid={x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2};
          /* 直角三角形：圆心—弦中点—端点 */
          seg(h,k,mid.x,mid.y,COL.tangent,1.8,true);
          seg(h,k,pts[0].x,pts[0].y,COL.focus,1.8,true);
          seg(mid.x,mid.y,pts[0].x,pts[0].y,COL.chord,2.2);
          dot(pts[0].x,pts[0].y,"#0d9488",4);
          dot(pts[1].x,pts[1].y,"#0d9488",4);
          dot(mid.x,mid.y,"#475569",3);
          txt("d",(h+mid.x)/2,(k+mid.y)/2,"#64748b",10,"center",[0,-10]);
          txt("r",(h+pts[0].x)/2,(k+pts[0].y)/2,"#b91c1c",10,"center",[8,4]);
          txt("半弦",(mid.x+pts[0].x)/2,(mid.y+pts[0].y)/2,"#0d9488",10,"center",[0,12]);
        }
      }
      txt("O",h,k,"#475569",12,"right",[-6,-6]);
      break;
    }

    /* ---------- 垂径定理 ---------- */
    case "c_diam":{
      const m=p.lm, n=p.ln;
      lineThru(-1,m*(-1)+n,1,m*1+n,COL.chord,2);
      const res=circleLine(h,k,r,m,n);
      if(res.roots.length===2){
        const pts=pointsFromRoots(res.roots,m,n);
        if(pts.length===2){
          seg(pts[0].x,pts[0].y,pts[1].x,pts[1].y,COL.chord,3.5);
          const mid={x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2};
          /* 过圆心且垂直于弦的直径 */
          if(Math.abs(m)<1e-9){
            seg(h,mid.y-2*r,h,mid.y+2*r,COL.tangent,2.2);
          }else{
            const dm=-1/m;
            lineThru(mid.x-1,mid.y-dm,mid.x+1,mid.y+dm,COL.tangent,2.2);
          }
          dot(mid.x,mid.y,"#ea580c",4);
          txt("垂直平分",mid.x,mid.y,"#ea580c",10,"center",[0,14]);
          dot(pts[0].x,pts[0].y,"#0d9488",4);
          dot(pts[1].x,pts[1].y,"#0d9488",4);
        }
      }
      txt("O",h,k,"#475569",12,"right",[-6,-6]);
      break;
    }

    /* ---------- 切线 ---------- */
    case "c_tan":{
      const d=Math.hypot(p.px-h,p.py-k);
      dot(p.px,p.py,"#0f172a",5);
      labelP("Q",p.px,p.py,"#0f172a",12,-12);
      txt("O",h,k,"#475569",12,"right",[-6,-6]);
      const T=tangentPointsFromPoint(h,k,r,p.px,p.py);
      if(T){
        for(const t of T){
          lineThru(p.px,p.py,t.x,t.y,COL.tangent,2);
          dot(t.x,t.y,COL.tangent,4);
          if(aux)seg(h,k,t.x,t.y,COL.aux,1.3,true);
        }
        /* 切点弦 */
        if(aux){
          seg(T[0].x,T[0].y,T[1].x,T[1].y,COL.chord,1.8,true);
          txt("切点弦",(T[0].x+T[1].x)/2,(T[0].y+T[1].y)/2,"#0d9488",10,"center",[0,-12]);
        }
        txt("切点",T[0].x,T[0].y,COL.tangent,10,"center",[10,-10]);
      }else{
        txt(d<r?"点在圆内，无切线":"点在圆上",p.px,p.py,"#b91c1c",11,"center",[0,-16]);
      }
      break;
    }

    /* ---------- 圆周角与圆心角 ---------- */
    case "c_ang":{
      const a1=p.t, a2=p.t+p.ang*Math.PI/180;
      const A={x:h+r*Math.cos(a1),y:k+r*Math.sin(a1)};
      const B={x:h+r*Math.cos(a2),y:k+r*Math.sin(a2)};
      const am=(a1+a2)/2+Math.PI;
      const C={x:h+r*Math.cos(am),y:k+r*Math.sin(am)};
      seg(h,k,A.x,A.y,COL.focus,1.8,true);
      seg(h,k,B.x,B.y,COL.focus,1.8,true);
      seg(C.x,C.y,A.x,A.y,COL.chord,1.8);
      seg(C.x,C.y,B.x,B.y,COL.chord,1.8);
      seg(A.x,A.y,B.x,B.y,COL.chord,2);
      if(fill)fillTriangle({x:h,y:k},A,B,"rgba(37,99,235,.10)");
      dot(A.x,A.y,"#0d9488",4);
      dot(B.x,B.y,"#0d9488",4);
      dot(C.x,C.y,COL.pointP,5);
      labelP("C",C.x,C.y,COL.pointP,12,-10);
      txt("A",A.x,A.y,"#334155",11,"center",[10,-8]);
      txt("B",B.x,B.y,"#334155",11,"center",[-10,-8]);
      txt("O",h,k,"#475569",12,"right",[-6,-6]);
      break;
    }

    /* ---------- 弧长与扇形 ---------- */
    case "c_arc":{
      const th=p.ang*Math.PI/180;
      if(fill){
        ctx.beginPath();ctx.moveTo(X(h),Y(k));
        ctx.arc(X(h),Y(k),r*view.scale,0,-th,true);
        ctx.closePath();ctx.fillStyle=COL.area;ctx.fill();
      }
      ctx.strokeStyle=COL.chord;ctx.lineWidth=2;dash(false);
      ctx.beginPath();ctx.arc(X(h),Y(k),r*view.scale,0,-th,true);ctx.stroke();
      seg(h,k,h+r,k,COL.chord,1.6);
      seg(h,k,h+r*Math.cos(th),k+r*Math.sin(th),COL.chord,1.6);
      txt("θ",h+0.8*r*Math.cos(th/2),k+0.8*r*Math.sin(th/2),COL.chord,12);
      txt("r",h+r/2,k,"#475569",10,"center",[0,-9]);
      txt("O",h,k,"#475569",12,"right",[-6,-6]);
      break;
    }

    /* ---------- 圆与圆 ---------- */
    case "c_cc":{
      drawCircle(p.h2,p.k2,p.r2,"#f59e0b",2.5);
      dot(p.h2,p.k2,"#f59e0b",4);
      txt("O₂",p.h2,p.k2,"#b45309",12,"right",[-6,-6]);
      if(aux)seg(h,k,p.h2,p.k2,COL.aux,1.5,true);
      txt("O₁",h,k,"#475569",12,"right",[-6,-6]);
      break;
    }

    /* ---------- 公共弦 ---------- */
    case "c_common":{
      drawCircle(p.h2,p.k2,p.r2,"#f59e0b",2.5);
      dot(p.h2,p.k2,"#f59e0b",4);
      txt("O₂",p.h2,p.k2,"#b45309",12,"right",[-6,-6]);
      txt("O₁",h,k,"#475569",12,"right",[-6,-6]);
      const d=Math.hypot(p.h2-h,p.k2-k);
      const R1=r, R2=p.r2;
      if(d>1e-9&&d<R1+R2-1e-6&&d>Math.abs(R1-R2)+1e-6){
        /* 两圆相交：求公共弦 */
        const ax=(d*d+R1*R1-R2*R2)/(2*d);
        const hh=Math.sqrt(Math.max(R1*R1-ax*ax,0));
        const ux=(p.h2-h)/d, uy=(p.k2-k)/d;
        const mx=h+ux*ax, my=k+uy*ax;
        const A={x:mx-uy*hh,y:my+ux*hh};
        const B={x:mx+uy*hh,y:my-ux*hh};
        seg(A.x,A.y,B.x,B.y,COL.chord,3.5);
        dot(A.x,A.y,"#0d9488",4);
        dot(B.x,B.y,"#0d9488",4);
        txt("公共弦",(A.x+B.x)/2,(A.y+B.y)/2,"#0d9488",10,"center",[0,-12]);
        if(aux)seg(h,k,p.h2,p.k2,COL.aux,1.3,true);
      }else{
        txt("两圆无公共弦",h,k,"#b91c1c",11,"center",[0,-r-16]);
      }
      break;
    }

    /* ---------- 公切线 ---------- */
    case "c_ctan":{
      drawCircle(p.h2,p.k2,p.r2,"#f59e0b",2.5);
      dot(p.h2,p.k2,"#f59e0b",4);
      txt("O₂",p.h2,p.k2,"#b45309",12,"right",[-6,-6]);
      txt("O₁",h,k,"#475569",12,"right",[-6,-6]);
      const d=Math.hypot(p.h2-h,p.k2-k);
      const r1=r, r2=p.r2;
      if(aux&&d>1e-9)seg(h,k,p.h2,p.k2,COL.aux,1.2,true);

      const rB=Math.max(r1,r2), rS=Math.min(r1,r2);
      const big = (rB===r1)?{x:h,y:k}:{x:p.h2,y:p.k2};
      const small=(rS===r1)?{x:h,y:k}:{x:p.h2,y:p.k2};

      /* 外公切线（d > |r1−r2|） */
      if(d>Math.abs(r1-r2)+1e-6){
        if(Math.abs(rB-rS)<1e-6){
          /* 等半径：外公切线平行于连心线 */
          const ux=(p.h2-h)/d, uy=(p.k2-k)/d;
          const nx=-uy, ny=ux;
          for(const sg of [1,-1]){
            seg(h+nx*r1*sg,k+ny*r1*sg, p.h2+nx*r2*sg,p.k2+ny*r2*sg, COL.tangent,1.8);
          }
        }else{
          const dx=(small.x-big.x)/d, dy=(small.y-big.y)/d;
          const D=d*rB/(rB-rS);
          const H={x:big.x+dx*D, y:big.y+dy*D};
          const T=tangentPointsFromPoint(big.x,big.y,rB,H.x,H.y);
          if(T){
            lineThru(H.x,H.y,T[0].x,T[0].y,COL.tangent,1.8);
            dot(T[0].x,T[0].y,COL.tangent,3.5);
            txt("外公切线",(H.x+T[0].x)/2,(H.y+T[0].y)/2,"#ea580c",10,"center",[0,-10]);
          }
        }
      }

      /* 内公切线（d > r1+r2） */
      if(d>r1+r2+1e-6){
        const ux=(p.h2-h)/d, uy=(p.k2-k)/d;
        const D=d*r1/(r1+r2);
        const H={x:h+ux*D, y:k+uy*D};
        const T=tangentPointsFromPoint(h,k,r1,H.x,H.y);
        if(T){
          lineThru(H.x,H.y,T[0].x,T[0].y,COL.asymptote,1.6);
          dot(T[0].x,T[0].y,COL.asymptote,3.2);
          txt("内公切线",(H.x+T[0].x)/2,(H.y+T[0].y)/2,"#9333ea",10,"center",[0,12]);
        }
      }
      break;
    }

    /* ---------- 圆系方程 ---------- */
    case "c_sys":{
      drawCircle(p.h2,p.k2,p.r2,"#f59e0b",1.8);
      dot(p.h2,p.k2,"#f59e0b",3.5);
      txt("O₂",p.h2,p.k2,"#b45309",11,"right",[-5,-5]);
      txt("O₁",h,k,"#475569",11,"right",[-5,-5]);
      const d=Math.hypot(p.h2-h,p.k2-k);
      const R1=r, R2=p.r2;

      if(d>1e-9&&d<R1+R2-1e-6&&d>Math.abs(R1-R2)+1e-6){
        /* 两圆相交：以公共弦为标尺作过两交点的圆系 */
        const ax=(d*d+R1*R1-R2*R2)/(2*d);
        const hh=Math.sqrt(Math.max(R1*R1-ax*ax,0));
        const ux=(p.h2-h)/d, uy=(p.k2-k)/d;
        const mx=h+ux*ax, my=k+uy*ax;
        const A={x:mx-uy*hh,y:my+ux*hh};
        const B={x:mx+uy*hh,y:my-ux*hh};
        const half=Math.hypot(A.x-B.x,A.y-B.y)/2;
        const nx=-uy, ny=ux;  /* 公共弦的垂直方向 */
        /* 圆系：圆心在中垂线上移动 */
        for(let i=-3;i<=3;i++){
          const tt=i*0.9;
          const cc={x:mx+nx*tt, y:my+ny*tt};
          const rr=Math.sqrt(half*half+tt*tt);
          if(!isNum(rr)||rr<=0)continue;
          ctx.strokeStyle=(i===0)?"rgba(37,99,235,.20)":"rgba(37,99,235,.18)";
          ctx.lineWidth=1.2;dash(false);
          ctx.beginPath();ctx.arc(X(cc.x),Y(cc.y),rr*view.scale,0,Math.PI*2);ctx.stroke();
        }
        /* 当前 λ 对应圆：用 lam 控制偏移量 */
        const tt=p.lam*2.2;
        const cc={x:mx+nx*tt, y:my+ny*tt};
        const rr=Math.sqrt(half*half+tt*tt);
        if(isNum(rr)&&rr>0){
          ctx.strokeStyle="rgba(37,99,235,.85)";ctx.lineWidth=2.2;
          ctx.beginPath();ctx.arc(X(cc.x),Y(cc.y),rr*view.scale,0,Math.PI*2);ctx.stroke();
        }
        dot(A.x,A.y,"#0d9488",3.5);
        dot(B.x,B.y,"#0d9488",3.5);
        /* 公共弦直线（λ=−1 时） */
        seg(A.x,A.y,B.x,B.y,COL.chord,1.6,true);
        txt("λ=−1：公共弦",(A.x+B.x)/2,(A.y+B.y)/2,"#0d9488",10,"center",[0,-12]);
      }else{
        txt("两圆无交点，圆系退化",h,k,"#b91c1c",11,"center",[0,-r-16]);
      }
      break;
    }

    /* ---------- 对称性 ---------- */
    case "c_sym":{
      /* 原圆，以及关于 x 轴、y 轴、直线 y=x 的对称圆 */
      drawCircle(h,-k,r,"rgba(14,165,233,.55)",1.5);
      drawCircle(-h,k,r,"rgba(14,165,233,.55)",1.5);
      drawCircle(k,h,r,"rgba(16,185,129,.55)",1.5);
      if(aux){
        vline(0,COL.aux,1.3,true);
        hline(0,COL.aux,1.3,true);
        lineThru(-1,-1,1,1,COL.aux,1.2,true);
      }
      dot(-h,k,"#0ea5e9",3.5);
      dot(h,-k,"#0ea5e9",3.5);
      dot(k,h,"#10b981",3.5);
      txt("O",h,k,"#475569",12,"right",[-6,-6]);
      txt("y 轴对称",-h,k,"#0284c7",10,"center",[0,12]);
      txt("x 轴对称",h,-k,"#0284c7",10,"center",[0,-12]);
      txt("y=x 对称",k,h,"#059669",10,"center",[12,0]);
      break;
    }
  }
}

/* 补充：c_pq 拖动时 |d−r|<0.15 自动吸附到圆上 */
(function patchCircleDrag(){
  const _orig=getDragPoints;
  getDragPoints=function(){
    const list=_orig();
    if(state.module==="circle"&&state.submode==="c_pq"&&list.length===1){
      const od=list[0].onDrag;
      list[0].onDrag=function(mx,my){
        od(mx,my);
        const p=state.params;
        const d=Math.hypot(p.qx-p.h,p.qy-p.k);
        if(isNum(d)&&d>1e-9&&Math.abs(d-p.r)<0.15){
          const ux=(p.qx-p.h)/d, uy=(p.qy-p.k)/d;
          p.qx=p.h+ux*p.r;
          p.qy=p.k+uy*p.r;
        }
      };
    }
    return list;
  };
})();
</script>

<script>
/* =========================================================
   第五段：椭圆模块 与 双曲线模块 场景绘制
   ========================================================= */

/* ================= 椭圆 ================= */
function drawEllipseScene(s){
  const p=state.params;
  const a=p.a, c=p.c, b=eb();
  const aux=state.showAux, fill=state.showFill;
  const Pp=getP();

  function common(){
    drawEllipse(a,b,COL.ellipse,2.5);
    dot(-c,0,COL.focus,4);txt("F₁",-c,0,"#b91c1c",11,"center",[0,-13]);
    dot(c,0,COL.focus,4);txt("F₂",c,0,"#b91c1c",11,"center",[0,-13]);
    dot(-a,0,"#15803d",4);txt("A₁",-a,0,"#166534",11,"center",[0,13]);
    dot(a,0,"#15803d",4);txt("A₂",a,0,"#166534",11,"center",[0,13]);
  }

  switch(s){

    case "e_def1":{
      common();
      seg(-c,0,Pp.x,Pp.y,COL.focus,1.8,true);
      seg(c,0,Pp.x,Pp.y,COL.focus,1.8,true);
      dot(Pp.x,Pp.y,COL.pointP,5);
      labelP("P",Pp.x,Pp.y,COL.pointP,12,-12);
      break;
    }

    case "e_def2":{
      drawEllipse(a,b,COL.ellipse,2.5);
      dot(c,0,COL.focus,4);txt("F",c,0,"#b91c1c",11,"center",[0,-13]);
      if(c>1e-6){
        const dir=a*a/c;
        vline(dir,COL.directrix,1.8,true);
        vline(-dir,COL.directrix,1.4,true);
        txt("准线 x=a²/c",dir,view.oy+view.ext*0.9,"#475569",11);
        seg(Pp.x,Pp.y,dir,Pp.y,COL.aux,1.4,true);
        txt("d",(Pp.x+dir)/2,Pp.y,"#64748b",10,"center",[0,12]);
      }
      seg(c,0,Pp.x,Pp.y,COL.focus,1.8,true);
      dot(Pp.x,Pp.y,COL.pointP,5);
      labelP("P",Pp.x,Pp.y,COL.pointP,12,-12);
      break;
    }

    case "e_def3":{
      drawEllipse(a,b,COL.ellipse,2.5);
      dot(-a,0,"#15803d",4);dot(a,0,"#15803d",4);
      txt("A₁",-a,0,"#166534",11,"center",[0,13]);
      txt("A₂",a,0,"#166534",11,"center",[0,13]);
      seg(-a,0,Pp.x,Pp.y,COL.aux,1.4,true);
      seg(a,0,Pp.x,Pp.y,COL.aux,1.4,true);
      dot(Pp.x,Pp.y,COL.pointP,5);
      labelP("P",Pp.x,Pp.y,COL.pointP,12,-12);
      break;
    }

    case "e_std":{
      common();
      dot(Pp.x,Pp.y,COL.pointP,5);
      labelP("P",Pp.x,Pp.y,COL.pointP,12,-12);
      if(aux){
        seg(0,0,a,0,COL.aux,1.4,true);
        seg(0,0,0,b,COL.aux,1.4,true);
        txt("a",a/2,0,"#166534",11,"center",[0,-11]);
        txt("b",0,b/2,"#166534",11,"right",[-5,0]);
        txt("c",c/2,0,"#b91c1c",11,"center",[0,13]);
      }
      break;
    }

    case "e_par":{
      common();
      seg(0,0,Pp.x,Pp.y,COL.aux,1.4,true);
      ctx.strokeStyle=COL.chord;ctx.lineWidth=1.6;dash(false);
      ctx.beginPath();ctx.arc(X(0),Y(0),Math.min(0.7,0.5*Math.min(a,b))*view.scale,0,-p.t,true);ctx.stroke();
      dot(Pp.x,Pp.y,COL.pointP,5);
      labelP("P(t)",Pp.x,Pp.y,COL.pointP,16,-12);
      txt("t",0.55*Math.min(a,b)*Math.cos(p.t/2),0.55*Math.min(a,b)*Math.sin(p.t/2),COL.chord,12);
      break;
    }

    case "e_elem":{
      common();
      dot(0,b,"#15803d",4);txt("B₂",0,b,"#166534",11,"right",[-5,0]);
      dot(0,-b,"#15803d",4);txt("B₁",0,-b,"#166534",11,"right",[-5,0]);
      if(aux){
        seg(-a,0,a,0,COL.aux,1.2,true);
        seg(0,-b,0,b,COL.aux,1.2,true);
      }
      break;
    }

    case "e_fr":{
      common();
      seg(-c,0,Pp.x,Pp.y,COL.focus,1.8,true);
      seg(c,0,Pp.x,Pp.y,COL.focus,1.8,true);
      dot(Pp.x,Pp.y,COL.pointP,5);
      labelP("P",Pp.x,Pp.y,COL.pointP,12,-12);
      break;
    }

    case "e_ftri":{
      common();
      if(fill)fillTriangle({x:-c,y:0},{x:c,y:0},Pp);
      seg(-c,0,Pp.x,Pp.y,COL.focus,1.8,true);
      seg(c,0,Pp.x,Pp.y,COL.focus,1.8,true);
      seg(-c,0,c,0,COL.focus,1.8);
      dot(Pp.x,Pp.y,COL.pointP,5);
      labelP("P",Pp.x,Pp.y,COL.pointP,12,-12);
      break;
    }

    case "e_fchord":{
      common();
      const lr=b*b/a;
      /* 通径：过 F₂ 且垂直长轴 */
      seg(c,-lr,c,lr,COL.chord,2.6);
      dot(c,lr,"#0d9488",4);dot(c,-lr,"#0d9488",4);
      txt("通径",c+0.15,lr,"#0d9488",10,"left",[4,0]);
      /* 过 F₂ 的一般焦点弦 */
      if(isNum(p.lm)){
        const m=p.lm, n=-m*c;
        lineThru(c-1,m*(c-1-c),c+1,m*(c+1-c),COL.chord,1.6,true);
        const res=ellipseLine(a,b,m,n);
        if(res.roots.length===2){
          const pts=pointsFromRoots(res.roots,m,n);
          if(pts.length===2){
            seg(pts[0].x,pts[0].y,pts[1].x,pts[1].y,COL.chord,2.6);
            dot(pts[0].x,pts[0].y,"#0d9488",4);
            dot(pts[1].x,pts[1].y,"#0d9488",4);
          }
        }
      }
      break;
    }

    case "e_mid":{
      drawEllipse(a,b,COL.ellipse,2.5);
      const x0=Pp.x, y0=Pp.y;
      dot(x0,y0,COL.pointP,5);
      labelP("M",x0,y0,COL.pointP,12,-12);
      if(Math.abs(y0)>0.05){
        /* 点差法：k = −b²x₀/(a²y₀) */
        const k=-b*b*x0/(a*a*y0);
        const n=y0-k*x0;
        const res=ellipseLine(a,b,k,n);
        if(res.roots.length===2){
          const pts=pointsFromRoots(res.roots,k,n);
          if(pts.length===2){
            seg(pts[0].x,pts[0].y,pts[1].x,pts[1].y,COL.chord,2.6);
            dot(pts[0].x,pts[0].y,"#0d9488",4);
            dot(pts[1].x,pts[1].y,"#0d9488",4);
          }
        }
      }else{
        txt("中点弦为竖直方向",x0,y0,"#b91c1c",10,"center",[0,16]);
      }
      break;
    }

    case "e_ecc":{
      drawEllipse(a,b,COL.ellipse,2.5);
      if(c>0){dot(-c,0,COL.focus,4);dot(c,0,COL.focus,4);}
      dot(Pp.x,Pp.y,COL.pointP,4);
      break;
    }

    case "e_dir":{
      drawEllipse(a,b,COL.ellipse,2.5);
      if(c>1e-6){
        const d2=a*a/c;
        vline(d2,COL.directrix,1.8,true);
        vline(-d2,COL.directrix,1.8,true);
        txt("x=a²/c",d2,view.oy+view.ext*0.9,"#475569",10);
        txt("x=−a²/c",-d2,view.oy+view.ext*0.9,"#475569",10);
      }
      dot(-c,0,COL.focus,4);dot(c,0,COL.focus,4);
      break;
    }

    case "e_line":{
      drawEllipse(a,b,COL.ellipse,2.5);
      const m=p.lm, n=p.ln;
      lineThru(-1,m*(-1)+n,1,m+n,COL.chord,2);
      const res=ellipseLine(a,b,m,n);
      if(res.roots.length===2){
        const pts=pointsFromRoots(res.roots,m,n);
        if(pts.length===2){
          seg(pts[0].x,pts[0].y,pts[1].x,pts[1].y,COL.chord,3.2);
          dot(pts[0].x,pts[0].y,"#0d9488",4);
          dot(pts[1].x,pts[1].y,"#0d9488",4);
        }
      }else if(Math.abs(res.disc)<1e-8&&res.roots.length===1){
        const pts=pointsFromRoots(res.roots,m,n);
        if(pts.length===1){
          dot(pts[0].x,pts[0].y,COL.tangent,5);
          labelP("切点",pts[0].x,pts[0].y,COL.tangent,16,-12);
        }
      }
      dot(-c,0,COL.focus,4);dot(c,0,COL.focus,4);
      break;
    }

    case "e_tan":{
      drawEllipse(a,b,COL.ellipse,2.5);
      const x0=Pp.x, y0=Pp.y;
      if(Math.abs(y0)>1e-6){
        /* 切线斜率 k = −b²x₀/(a²y₀)，截距 n = b²/y₀ */
        const k=-(b*b*x0)/(a*a*y0);
        const n=b*b/y0;
        lineThru(-1,k*(-1)+n,1,k+n,COL.tangent,2.2);
      }else{
        vline(x0,COL.tangent,2.2);
      }
      dot(x0,y0,COL.pointP,5);
      labelP("P",x0,y0,COL.pointP,12,-12);
      break;
    }

    case "e_circle":{
      const bb=clamp(p.bSlide,1e-6,a);
      drawEllipse(a,bb,COL.ellipse,2.5);
      drawCircle(0,0,a,"rgba(37,99,235,.45)",1.5);
      dot(0,0,"#475569",3);
      txt("圆 b=a="+fmt(a,2),0,a,"#2563eb",10,"center",[0,-10]);
      txt("b="+fmt(bb,2),a*0.7,-bb-0.3,"#16a34a",10,"left");
      break;
    }
  }
}

/* ================= 双曲线 ================= */
function drawHyperbolaScene(s){
  const p=state.params;
  const a=p.a, b=p.b, c=hc();
  const aux=state.showAux, fill=state.showFill;
  const Pp=getP();
  const e=he();

  function common(){
    drawHyperbola(a,b,COL.hyperbola,2.5);
    lineThru(-1,-(b/a),1,(b/a),COL.asymptote,1.5,true);
    lineThru(-1,(b/a),1,-(b/a),COL.asymptote,1.5,true);
    dot(-c,0,COL.focus,4);txt("F₁",-c,0,"#b91c1c",11,"center",[0,-13]);
    dot(c,0,COL.focus,4);txt("F₂",c,0,"#b91c1c",11,"center",[0,-13]);
    dot(-a,0,"#6d28d9",4);txt("A₁",-a,0,"#5b21b6",11,"center",[0,13]);
    dot(a,0,"#6d28d9",4);txt("A₂",a,0,"#5b21b6",11,"center",[0,13]);
  }

  switch(s){

    case "h_def1":{
      common();
      seg(-c,0,Pp.x,Pp.y,COL.focus,1.8,true);
      seg(c,0,Pp.x,Pp.y,COL.focus,1.8,true);
      dot(Pp.x,Pp.y,COL.pointP,5);
      labelP("P",Pp.x,Pp.y,COL.pointP,12,-12);
      break;
    }

    case "h_def2":{
      drawHyperbola(a,b,COL.hyperbola,2.5);
      dot(c,0,COL.focus,4);txt("F",c,0,"#b91c1c",11,"center",[0,-13]);
      const dir=a*a/c;
      vline(dir,COL.directrix,1.8,true);
      vline(-dir,COL.directrix,1.4,true);
      seg(c,0,Pp.x,Pp.y,COL.focus,1.8,true);
      seg(Pp.x,Pp.y,dir,Pp.y,COL.aux,1.4,true);
      dot(Pp.x,Pp.y,COL.pointP,5);
      labelP("P",Pp.x,Pp.y,COL.pointP,12,-12);
      break;
    }

    case "h_def3":{
      drawHyperbola(a,b,COL.hyperbola,2.5);
      dot(-a,0,"#6d28d9",4);dot(a,0,"#6d28d9",4);
      txt("A₁",-a,0,"#5b21b6",11,"center",[0,13]);
      txt("A₂",a,0,"#5b21b6",11,"center",[0,13]);
      seg(-a,0,Pp.x,Pp.y,COL.aux,1.4,true);
      seg(a,0,Pp.x,Pp.y,COL.aux,1.4,true);
      dot(Pp.x,Pp.y,COL.pointP,5);
      labelP("P",Pp.x,Pp.y,COL.pointP,12,-12);
      break;
    }

    case "h_std":{
      common();
      dot(Pp.x,Pp.y,COL.pointP,5);
      labelP("P",Pp.x,Pp.y,COL.pointP,12,-12);
      break;
    }

    /* ---------- 新增：参数方程 ---------- */
    case "h_par":{
      drawHyperbola(a,b,COL.hyperbola,2.5);
      lineThru(-1,-(b/a),1,(b/a),COL.asymptote,1.2,true);
      lineThru(-1,(b/a),1,-(b/a),COL.asymptote,1.2,true);
      dot(0,0,"#475569",3);
      txt("O",0,0,"#475569",11,"right",[-4,-6]);
      /* 连续参数点 P（cosh/sinh） */
      dot(Pp.x,Pp.y,COL.pointP,5);
      labelP("P(u)",Pp.x,Pp.y,COL.pointP,16,-12);
      if(aux){
        seg(0,0,Pp.x,Pp.y,COL.aux,1.3,true);
        txt("x=±a·cosh u",0,view.oy+view.ext*0.82,"#7c3aed",11);
        txt("y=b·sinh u  （连续）",0,view.oy+view.ext*0.95,"#7c3aed",10);
        txt("对比：x=a·sec t, y=b·tan t（t=π/2 有奇点）",0,view.oy-view.ext*0.95,"#9333ea",10);
      }
      break;
    }

    case "h_elem":{
      common();
      dot(0,b,"#6d28d9",4);txt("B₂",0,b,"#5b21b6",11,"right",[-5,0]);
      dot(0,-b,"#6d28d9",4);txt("B₁",0,-b,"#5b21b6",11,"right",[-5,0]);
      if(aux){
        seg(-a,0,a,0,COL.aux,1.2,true);
        seg(0,-b,0,b,COL.aux,1.2,true);
        txt("2a",0,0,"#5b21b6",10,"center",[0,-12]);
        txt("2b",0,0,"#5b21b6",10,"center",[14,0]);
      }
      break;
    }

    case "h_asy":{
      common();
      dot(Pp.x,Pp.y,COL.pointP,4);
      break;
    }

    case "h_conj":{
      drawHyperbola(a,b,COL.hyperbola,2.5);
      /* 共轭双曲线 y²/b²−x²/a²=1：x=a·sinh u, y=±b·cosh u */
      ctx.strokeStyle="#f59e0b";ctx.lineWidth=2;dash(false);
      const bound=view.ext*2.2;
      let U=Math.acosh(Math.max(bound/b,1.0001));
      if(!isNum(U))U=3; U=Math.min(U,6);
      for(const sg of [1,-1]){
        ctx.beginPath();let started=false;
        const N=80;
        for(let i=-N;i<=N;i++){
          const u=U*i/N;
          const x=a*Math.sinh(u), y=sg*b*Math.cosh(u);
          if(!isNum(x)||!isNum(y)){started=false;continue;}
          if(Math.abs(x)>view.ext*2.3||Math.abs(y)>view.ext*2.3){started=false;continue;}
          if(!started){ctx.moveTo(X(x),Y(y));started=true;}else ctx.lineTo(X(x),Y(y));
        }
        ctx.stroke();
      }
      lineThru(-1,-(b/a),1,(b/a),COL.asymptote,1.4,true);
      lineThru(-1,(b/a),1,-(b/a),COL.asymptote,1.4,true);
      dot(-c,0,COL.focus,3.5);dot(c,0,COL.focus,3.5);
      break;
    }

    case "h_fr":{
      common();
      seg(-c,0,Pp.x,Pp.y,COL.focus,1.8,true);
      seg(c,0,Pp.x,Pp.y,COL.focus,1.8,true);
      dot(Pp.x,Pp.y,COL.pointP,5);
      labelP("P",Pp.x,Pp.y,COL.pointP,12,-12);
      break;
    }

    case "h_ftri":{
      common();
      if(fill)fillTriangle({x:-c,y:0},{x:c,y:0},Pp);
      seg(-c,0,Pp.x,Pp.y,COL.focus,1.8,true);
      seg(c,0,Pp.x,Pp.y,COL.focus,1.8,true);
      seg(-c,0,c,0,COL.focus,1.8);
      dot(Pp.x,Pp.y,COL.pointP,5);
      labelP("P",Pp.x,Pp.y,COL.pointP,12,-12);
      break;
    }

    case "h_fchord":{
      common();
      const lr=b*b/a;
      seg(c,-lr,c,lr,COL.chord,2.6);
      dot(c,lr,"#0d9488",4);dot(c,-lr,"#0d9488",4);
      txt("通径",c+0.15,lr,"#0d9488",10,"left",[4,0]);
      if(isNum(p.lm)){
        const m=p.lm, n=-m*c;
        lineThru(c-1,m*(c-1-c),c+1,m*(c+1-c),COL.chord,1.6,true);
        const res=hyperbolaLine(a,b,m,n);
        if(res.roots.length===2&&!res.parallel){
          const pts=pointsFromRoots(res.roots,m,n);
          if(pts.length===2){
            seg(pts[0].x,pts[0].y,pts[1].x,pts[1].y,COL.chord,2.6);
            dot(pts[0].x,pts[0].y,"#0d9488",4);
            dot(pts[1].x,pts[1].y,"#0d9488",4);
          }
        }
      }
      break;
    }

    case "h_mid":{
      drawHyperbola(a,b,COL.hyperbola,2.5);
      const x0=Pp.x, y0=Pp.y;
      dot(x0,y0,COL.pointP,5);
      labelP("M",x0,y0,COL.pointP,12,-12);
      if(Math.abs(y0)>0.05){
        /* 点差法：k = b²x₀/(a²y₀) */
        const k=b*b*x0/(a*a*y0);
        const n=y0-k*x0;
        const res=hyperbolaLine(a,b,k,n);
        if(res.roots.length===2&&!res.parallel){
          const pts=pointsFromRoots(res.roots,k,n);
          if(pts.length===2){
            seg(pts[0].x,pts[0].y,pts[1].x,pts[1].y,COL.chord,2.6);
            dot(pts[0].x,pts[0].y,"#0d9488",4);
            dot(pts[1].x,pts[1].y,"#0d9488",4);
          }
        }
      }
      break;
    }

    case "h_ecc":{
      drawHyperbola(a,b,COL.hyperbola,2.5);
      lineThru(-1,-(b/a),1,(b/a),COL.asymptote,1.4,true);
      lineThru(-1,(b/a),1,-(b/a),COL.asymptote,1.4,true);
      dot(-c,0,COL.focus,4);dot(c,0,COL.focus,4);
      dot(Pp.x,Pp.y,COL.pointP,4);
      break;
    }

    case "h_dir":{
      drawHyperbola(a,b,COL.hyperbola,2.5);
      const d2=a*a/c;
      vline(d2,COL.directrix,1.8,true);
      vline(-d2,COL.directrix,1.8,true);
      txt("x=a²/c",d2,view.oy+view.ext*0.9,"#475569",10);
      txt("x=−a²/c",-d2,view.oy+view.ext*0.9,"#475569",10);
      dot(-c,0,COL.focus,4);dot(c,0,COL.focus,4);
      break;
    }

    case "h_line":{
      drawHyperbola(a,b,COL.hyperbola,2.5);
      lineThru(-1,-(b/a),1,(b/a),COL.asymptote,1.1,true);
      lineThru(-1,(b/a),1,-(b/a),COL.asymptote,1.1,true);
      const m=p.lm, n=p.ln;
      lineThru(-1,m*(-1)+n,1,m+n,COL.chord,2);
      const res=hyperbolaLine(a,b,m,n);
      if(res.parallel){
        /* 与渐近线平行：只有一个交点 */
        if(res.roots.length===1){
          const pts=pointsFromRoots(res.roots,m,n);
          if(pts.length===1){
            dot(pts[0].x,pts[0].y,"#0d9488",5);
            labelP("唯一交点",pts[0].x,pts[0].y,"#0d9488",26,-12);
          }
        }
      }else if(res.roots.length===2){
        const pts=pointsFromRoots(res.roots,m,n);
        if(pts.length===2){
          seg(pts[0].x,pts[0].y,pts[1].x,pts[1].y,COL.chord,3.2);
          dot(pts[0].x,pts[0].y,"#0d9488",4);
          dot(pts[1].x,pts[1].y,"#0d9488",4);
        }
      }else if(Math.abs(res.disc)<1e-8&&res.roots.length===1){
        const pts=pointsFromRoots(res.roots,m,n);
        if(pts.length===1){
          dot(pts[0].x,pts[0].y,COL.tangent,5);
          labelP("切点",pts[0].x,pts[0].y,COL.tangent,16,-12);
        }
      }
      dot(-c,0,COL.focus,4);dot(c,0,COL.focus,4);
      break;
    }

    case "h_tan":{
      drawHyperbola(a,b,COL.hyperbola,2.5);
      const x0=Pp.x, y0=Pp.y;
      if(Math.abs(y0)>1e-6){
        /* 切线斜率 k = b²x₀/(a²y₀)，截距 n = −b²/y₀ */
        const k=b*b*x0/(a*a*y0);
        const n=-b*b/y0;
        lineThru(-1,k*(-1)+n,1,k+n,COL.tangent,2.2);
      }else{
        vline(x0,COL.tangent,2.2);
      }
      dot(x0,y0,COL.pointP,5);
      labelP("P",x0,y0,COL.pointP,12,-12);
      break;
    }

    /* ---------- 双曲线↔椭圆（共焦点对比） ---------- */
    case "h_ell":{
      /* 取同一 c，构造椭圆与双曲线 */
      const c0=c;
      const eE=0.6;
      const aE=(c0>1e-9)?c0/eE:3;
      const bE=Math.sqrt(Math.max(aE*aE-c0*c0,0));
      if(isNum(bE)&&bE>0)drawEllipse(aE,bE,COL.ellipse,2);
      drawHyperbola(a,b,COL.hyperbola,2.5);
      dot(-c0,0,COL.focus,4);dot(c0,0,COL.focus,4);
      txt("F₁",-c0,0,"#b91c1c",10,"center",[0,-13]);
      txt("F₂",c0,0,"#b91c1c",10,"center",[0,-13]);
      txt("椭圆 a="+fmt(aE,2)+", b="+fmt(bE,2)+", e="+fmt(eE,2),0,view.oy+view.ext*0.82,"#16a34a",10);
      txt("双曲线 a="+fmt(a,2)+", b="+fmt(b,2)+", e="+fmt(e,2),0,view.oy+view.ext*0.95,"#7c3aed",10);
      break;
    }
  }
}

<script>
/* =========================================================
   第六段：抛物线模块 与 综合模块 场景绘制

/* 场景总调度 */
function drawScene(){
  const m=state.module, s=state.submode;
  if(m==="circle")drawCircleScene(s);
  else if(m==="ellipse")drawEllipseScene(s);
  else if(m==="hyperbola")drawHyperbolaScene(s);
  else if(m==="parabola")drawParabolaScene(s);
  else drawSynScene(s);
}

/* ================= 抛物线 ================= */

      else seg(Pp.x,Pp.y,Pp.x,D.y,COL.aux,1.5,true);

      labelP("P",Pp.x,Pp.y,COL.pointP,12,-12);
      break;
