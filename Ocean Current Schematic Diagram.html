<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>全球洋流分布动态示意图——高考考点与易错点</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#05121d;color:#d9eaf6;font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,sans-serif;font-size:14px}
.app{display:flex;flex-direction:column;min-height:100vh}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 16px;background:linear-gradient(90deg,#081a2b,#0d2b46,#081a2b);border-bottom:1px solid #17405f}
.hdr h1{margin:0;font-size:19px;color:#eaf7ff;letter-spacing:.5px}
.hdr h1 span{font-size:13px;font-weight:400;color:#88b9d6;margin-left:8px}
.hdr-tools{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;padding:3px 10px;border-radius:20px;background:#0f2c44;border:1px solid #21506f;color:#a6d0e8;white-space:nowrap}
.main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;padding:12px;align-items:start}
.stage{position:relative;background:#04121d;border:1px solid #1b4260;border-radius:10px;overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.4)}
#cv{display:block;width:100%;height:auto;cursor:crosshair;touch-action:manipulation}
.tips{position:absolute;left:10px;bottom:8px;font-size:12px;color:#7aa6c2;background:rgba(4,18,29,.75);border:1px solid #123a56;padding:4px 10px;border-radius:6px;pointer-events:none;max-width:calc(100% - 20px);line-height:1.5}
.tip{position:absolute;display:none;pointer-events:none;background:rgba(7,26,42,.96);border:1px solid #2f7fb0;color:#e6f4ff;font-size:12.5px;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:5;transform:translate(-50%,-135%)}
.panel{background:#0a1e2f;border:1px solid #1b4260;border-radius:10px;padding:10px 12px;max-height:calc(100vh - 96px);overflow:auto}
.pgroup{padding:8px 0 10px;border-bottom:1px dashed #1b3f5a}
.pgroup:last-child{border-bottom:0}
.pgroup h3{margin:2px 0 8px;font-size:13px;color:#86bcd9;font-weight:600;letter-spacing:.6px}
.prow{display:flex;gap:8px;align-items:center}
.prow .btn{flex:1}
.lbl{font-size:12.5px;color:#8fb8d2;white-space:nowrap}
.btn{font-family:inherit;font-size:13px;padding:7px 10px;border-radius:8px;border:1px solid #2a5c80;background:#143349;color:#d6ecfa;cursor:pointer;transition:.15s}
.btn:hover{background:#1c4a6b;border-color:#3a7ba6}
.btn.primary{background:#1a5a86;border-color:#2f86bb}
.btn.sm{width:100%;margin-bottom:6px;font-size:12.5px;padding:6px 8px;text-align:left}
.seg{display:flex;border:1px solid #2a5c80;border-radius:8px;overflow:hidden}
.segbtn{font-family:inherit;font-size:12.5px;padding:6px 14px;background:#0f2b41;color:#a8cde3;border:0;cursor:pointer}
.segbtn.on{background:#1a5a86;color:#fff}
.hintline{margin-top:8px;font-size:12px;line-height:1.6;color:#ffd166;background:rgba(255,209,102,.08);border-left:3px solid #ffd166;padding:5px 8px;border-radius:0 6px 6px 0}
.layers{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.layers label{display:flex;align-items:center;gap:5px;font-size:12.5px;background:#0d2740;border:1px solid #1c4666;border-radius:6px;padding:5px 6px;cursor:pointer;color:#c7e0f0}
.layers input{accent-color:#3f9fd0;width:13px;height:13px;margin:0}
.layers i{font-style:normal;font-size:11px;width:12px;text-align:center}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.warm{background:#ff5a3c}.dot.cold{background:#3ca7ff}.dot.sp{background:#ffd166}.dot.fish{background:#5ff0d0}
.legend{font-size:12.5px;line-height:1.85;color:#b8d6e8}
.legend div{display:flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:24px;border-top:3px solid #888;border-radius:2px;flex:0 0 auto}
.st{font-size:14px}.st.gold{color:#ffd166}.st.cyan{color:#5ff0d0}
.ar{color:#5ff0d0;font-weight:700}.wnd{color:rgba(255,255,255,.8)}
.modal{position:fixed;inset:0;background:rgba(2,8,14,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.on{display:flex}
.mbox{background:#0b2033;border:1px solid #2b5f86;border-radius:14px;max-width:860px;width:100%;max-height:88vh;overflow:auto;padding:18px 20px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mclose{position:absolute;right:12px;top:8px;background:none;border:0;color:#8fbdd9;font-size:26px;cursor:pointer;line-height:1}
.ch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-left:5px solid var(--c,#3ca7ff);padding-left:10px;margin:0 26px 14px 0}
.ch h2{margin:0;font-size:20px;color:#eaf7ff}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;background:#14374f;border:1px solid #2a5f80;color:#a9d3ea;white-space:nowrap}
.tag.w{background:rgba(255,90,60,.16);border-color:#ff5a3c;color:#ff9a86}
.tag.c{background:rgba(60,167,255,.16);border-color:#3ca7ff;color:#86c9ff}
.tag.y{background:rgba(255,209,102,.14);border-color:#ffd166;color:#ffd166}
.kv{margin:8px 0;padding:8px 10px;background:#0e2740;border-radius:8px;border:1px solid #1a3f5c}
.kv b{display:block;font-size:12.5px;color:#79b3d4;margin-bottom:3px;letter-spacing:.5px}
.kv p{margin:0;font-size:14px;line-height:1.65;color:#d7e9f5}
.kv.hl{background:rgba(255,209,102,.08);border-color:#8a6d24}
.kv.hl b{color:#ffd166}
.chain{font-size:13.5px;line-height:1.8;color:#c9e7ff}
.chain em{color:#5ff0d0;font-style:normal}
.q{margin:10px 0;padding:10px;border:1px solid #1d4767;border-radius:10px;background:#0c2539}
.q p{margin:0 0 8px;font-size:14px;color:#e2f1fb}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{font-family:inherit;font-size:13px;padding:6px 14px;border-radius:8px;border:1px solid #2a5c80;background:#12314a;color:#d6ecfa;cursor:pointer}
.opt.ok{background:#14563c;border-color:#2fbb7d;color:#8ff0c2}
.opt.no{background:#5a1f21;border-color:#e05c5c;color:#ffb3b3}
.fb{margin-top:8px;font-size:13px;line-height:1.7;color:#ffd166;display:none}
.cmpwrap{margin-top:10px}
.cmpwrap canvas{width:100%;height:auto;border-radius:10px;border:1px solid #1d4767;background:#081c2c;display:block}
.cmpnote{margin-top:8px;font-size:13px;line-height:1.7;color:#bcd9ec}
@media(max-width:900px){
 .main{grid-template-columns:1fr;padding:8px;gap:8px}
 .panel{max-height:none}
 .hdr h1{font-size:16px}
 .hdr h1 span{font-size:12px;display:block;margin:2px 0 0}
 .tips{font-size:11px}
 .mbox{padding:14px;max-height:92vh}
}
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <h1>全球洋流分布动态示意图<span>——高考考点与易错点</span></h1>
    <div class="hdr-tools">
      <span class="pill" id="seasonPill">当前季节：夏季</span>
      <span class="pill">红橙=暖流 · 蓝青=寒流</span>
    </div>
  </header>
  <main class="main">
    <section class="stage" id="stage">
      <canvas id="cv" width="1200" height="600"></canvas>
      <div class="tips">点击洋流流线看知识卡片 · 点击★看渔场成因链 · 点击黄色「例外」角标看特殊机制</div>
      <div class="tip" id="tip"></div>
    </section>
    <aside class="panel">
      <div class="pgroup">
        <div class="prow">
          <button class="btn primary" id="btnPlay">⏸ 暂停</button>
          <button class="btn" id="btnReset">↺ 重置视图</button>
        </div>
        <div class="prow" style="margin-top:8px">
          <span class="lbl">季节</span>
          <div class="seg">
            <button class="segbtn on" data-season="summer">夏季</button>
            <button class="segbtn" data-season="winter">冬季</button>
          </div>
        </div>
        <div class="hintline" id="seasonHint"></div>
      </div>
      <div class="pgroup">
        <h3>图层开关</h3>
        <div class="layers" id="layers">
          <label><input type="checkbox" data-layer="warm" checked><i class="dot warm"></i>暖流层</label>
          <label><input type="checkbox" data-layer="cold" checked><i class="dot cold"></i>寒流层</label>
          <label><input type="checkbox" data-layer="special" checked><i class="dot sp"></i>特殊洋流层</label>
          <label><input type="checkbox" data-layer="fish" checked><i class="dot fish"></i>渔场层</label>
          <label><input type="checkbox" data-layer="wind" checked><i>风</i>风带层</label>
          <label><input type="checkbox" data-layer="exam" checked><i>考</i>考点标注</label>
          <label><input type="checkbox" data-layer="climate"><i>温</i>气候影响</label>
          <label><input type="checkbox" data-layer="sail"><i>航</i>航行影响</label>
          <label><input type="checkbox" data-layer="poll"><i>污</i>污染扩散</label>
        </div>
      </div>
      <div class="pgroup">
        <h3>对比模式</h3>
        <div class="cmps">
          <button class="btn sm" data-cmp="1">副热带环流 vs 北印度洋季风环流</button>
          <button class="btn sm" data-cmp="2">寒暖流交汇渔场 vs 上升流渔场</button>
          <button class="btn sm" data-cmp="3">一般寒暖流判定 vs 索马里例外</button>
          <button class="btn sm" data-cmp="4">南极环流 vs 西风漂流</button>
        </div>
        <button class="btn sm" id="btnQuiz">🎯 测验模式（随机抽题）</button>
      </div>
      <div class="pgroup">
        <h3>图例</h3>
        <div class="legend">
          <div><i style="border-color:#ff5a3c"></i>暖流（红橙）</div>
          <div><i style="border-color:#3ca7ff"></i>寒流（蓝青）</div>
          <div><i style="border-color:#ffd166;border-top-style:dashed"></i>特殊洋流（黄虚线框＋「例外」角标）</div>
          <div><span class="st gold">★</span>寒暖流交汇渔场</div>
          <div><span class="st cyan">★</span>上升流渔场</div>
          <div><span class="ar">↑</span>上升流／上升补偿流</div>
          <div><span class="wnd">➤</span>风带（半透明白箭头）</div>
          <div><i style="border-color:#c08bff"></i>密度流（表层实线／深层虚线）</div>
        </div>
      </div>
    </aside>
  </main>
</div>
<div class="modal" id="modal"><div class="mbox"><button class="mclose" id="mclose">×</button><div id="mbody"></div></div></div>

function resize(){
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var w=cv.clientWidth||800;
  cv.width=Math.round(w*dpr);cv.height=Math.round(w*dpr/2);

function PX(lon){return (lon+180)/360*VW;}
function PY(lat){return (90-lat)/180*VH;}
function PT(p){return [PX(p[0]),PY(p[1])];}
function hexA(h,a){var n=parseInt(h.slice(1),16);return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function arrowHead(x,y,ang,s,col){
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.beginPath();
  ctx.moveTo(0,0);ctx.lineTo(-s,s*.55);ctx.lineTo(-s,-s*.55);ctx.closePath();
  ctx.fillStyle=col;ctx.fill();ctx.restore();
}
function star(x,y,r,fill){
  ctx.beginPath();
  for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;
    var px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
  ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=1;ctx.stroke();
}
function chip(x,y,text,col,size,align){
  var fs=size||12.5;ctx.font='600 '+fs+'px '+FONT;
  var w=ctx.measureText(text).width+14;
  var bx=align==='l'?x:x-w/2;
  ctx.fillStyle='rgba(5,20,33,.85)';ctx.strokeStyle=hexA(col,.55);ctx.lineWidth=1;
  roundRect(bx,y-10.5,w,21,7);ctx.fill();ctx.stroke();
  ctx.fillStyle=col;ctx.textAlign='center';ctx.fillText(text,bx+w/2,y+4.4);
  ctx.textAlign='left';
}
function prepare(pts){
  var P=[],seg=[],cum=[0],tot=0;
  for(var i=0;i<pts.length;i++)P.push(PT(pts[i]));
  for(var j=1;j<P.length;j++){
    var d=Math.hypot(P[j][0]-P[j-1][0],P[j][1]-P[j-1][1]);
    seg.push(d);tot+=d;cum.push(tot);
  }
  return {P:P,seg:seg,cum:cum,total:tot||1};
}
function geomOf(c){
  var key=c.id+'|'+(c.mon?S.season:'');
  if(!GEO[key])GEO[key]=prepare(c.mon?(S.season==='summer'?c.p:c.wp):c.p);
  if(c.dual&&!GEO[key+'|d'])GEO[key+'|d']=prepare(c.p2);
  return GEO[key];
}
function deepGeo(c){return GEO[c.id+'|'+S.season+'|d']||GEO[c.id+'|d'];}
function pointAt(g,t){
  t=t-Math.floor(t);
  var d=t*g.total,i=1;
  while(i<g.cum.length&&g.cum[i]<d)i++;
  i=Math.min(i,g.seg.length);
  var s=g.seg[i-1]||1,r=(d-g.cum[i-1])/s;
  var A=g.P[i-1],B=g.P[i];
  return [A[0]+(B[0]-A[0])*r,A[1]+(B[1]-A[1])*r,Math.atan2(B[1]-A[1],B[0]-A[0])];
}
function effType(c){if(c.mon)return S.season==='summer'?'寒流':'暖流';return c.t;}
function colorOf(c){if(c.t==='密度流')return COL.dens;return effType(c)==='暖流'?COL.warm:COL.cold;}
function isVisible(c){if(c.s)return !!S.layers.special;return !!S.layers[c.t==='暖流'?'warm':'cold'];}
function strokeGeo(g){
  ctx.beginPath();
  for(var i=0;i<g.P.length;i++){var p=g.P[i];i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}
  ctx.stroke();
}

  ctx.fillText('非洲',PX(20),PY(6));
  ctx.fillText('北美',PX(-100),PY(45));

function windArrow(w){
  var A=PT(w.a),B=PT(w.b),ang=Math.atan2(B[1]-A[1],B[0]-A[0]);
  ctx.strokeStyle='rgba(255,255,255,.38)';ctx.lineWidth=1.8;ctx.setLineDash([10,8]);
  ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();
  ctx.setLineDash([]);
  [.52,.78,1].forEach(function(f){
    var x=A[0]+(B[0]-A[0])*f,y=A[1]+(B[1]-A[1])*f;
    arrowHead(x,y,ang,7,'rgba(255,255,255,.62)');
  });
  var mx=(A[0]+B[0])/2,my=(A[1]+B[1])/2;
  ctx.font='12px '+FONT;ctx.textAlign='center';
  ctx.fillStyle='rgba(5,20,33,.65)';
  var tw=ctx.measureText(w.n).width+8;
  roundRect(mx-tw/2,my-20,tw,17,5);ctx.fill();
  ctx.fillStyle='rgba(240,250,255,.88)';ctx.fillText(w.n,mx,my-7);
  ctx.textAlign='left';
}
function drawWinds(){
  for(var i=0;i<WINDS.length;i++){
    var w=WINDS[i];
    if(w.se&&w.se!==S.season)continue;
    windArrow(w);
  }
}

   5. 洋流、粒子、渔场、标注

function drawUpwell(c,g){
  ctx.strokeStyle='rgba(120,255,220,.85)';ctx.fillStyle='rgba(120,255,220,.85)';ctx.lineWidth=1.6;
  [0.28,0.52,0.76].forEach(function(t){
    var p=pointAt(g,t),x=p[0]+12,y=p[1];
    ctx.beginPath();ctx.moveTo(x,y+10);ctx.lineTo(x,y-7);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,y-12);ctx.lineTo(x-4.5,y-5.5);ctx.lineTo(x+4.5,y-5.5);
    ctx.closePath();ctx.fill();
  });
}
function drawParticles(c,g,col){
  if(!c.parts)return;
  for(var i=0;i<c.parts.length;i++){
    var p=c.parts[i],a=pointAt(g,p.t),b=pointAt(g,p.t-0.012);
    if(Math.abs(a[0]-b[0])<VW/2){
      ctx.strokeStyle=hexA(col,.5);ctx.lineWidth=2.4;
      ctx.beginPath();ctx.moveTo(b[0],b[1]);ctx.lineTo(a[0],a[1]);ctx.stroke();
    }
    ctx.fillStyle=hexA(col,.95);ctx.beginPath();ctx.arc(a[0],a[1],2.7,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(a[0],a[1],1.15,0,7);ctx.fill();
  }
}
function drawCurrent(c){
  var g=geomOf(c),col=colorOf(c);
  ctx.lineCap='round';ctx.lineJoin='round';

  if(c.s){
    ctx.setLineDash([9,7]);ctx.lineWidth=c.w+6;
    ctx.strokeStyle='rgba(255,209,102,.40)';strokeGeo(g);ctx.setLineDash([]);
  }
  ctx.lineWidth=c.w;ctx.strokeStyle=hexA(col,.24);strokeGeo(g);
  ctx.lineWidth=Math.max(1.2,c.w-1.4);ctx.strokeStyle=hexA(col,.62);strokeGeo(g);

  var P=g.P;
  if(!c.wrap&&P.length>1){
    arrowHead(P[P.length-1][0],P[P.length-1][1],
      Math.atan2(P[P.length-1][1]-P[P.length-2][1],P[P.length-1][0]-P[P.length-2][0]),
      9,hexA(col,.95));
  }
  if(c.dual){
    var g2=deepGeo(c);
    if(g2){
      var Q=g2.P;
      ctx.setLineDash([5,6]);ctx.lineWidth=1.9;ctx.strokeStyle=hexA(col,.85);
      strokeGeo(g2);ctx.setLineDash([]);
      arrowHead(Q[Q.length-1][0],Q[Q.length-1][1],
        Math.atan2(Q[Q.length-1][1]-Q[Q.length-2][1],Q[Q.length-1][0]-Q[Q.length-2][0]),
        8,hexA(col,.95));
    }
  }
  if(c.upd)drawUpwell(c,g);
  drawParticles(c,g,col);

  if(c.s){
    var m=pointAt(g,.5);
    var bx=Math.min(VW-46,Math.max(40,m[0]+14)),by=m[1]-22;
    chip(bx,by,'例外',COL.sp,11.5);
    c._badge={x:bx,y:by};
  }else{c._badge=null;}

  if(c.mon){
    var q=pointAt(g,.12);
    var txt=c.id==='som'?(S.season==='summer'?'夏·寒流':'冬·暖流')
                       :(S.season==='summer'?'夏季·顺时针':'冬季·逆时针');
    chip(q[0],q[1]+28,txt,S.season==='summer'?COL.cold:COL.warm,11.5);
  }
}
function drawFisheries(){
  ctx.textAlign='center';
  for(var i=0;i<FISHERIES.length;i++){
    var f=FISHERIES[i],x=PX(f.lon),y=PY(f.lat);
    f._pos={x:x,y:y};
    if(f.k==='交汇'){
      star(x,y,10,COL.fishC);
    }else{
      star(x,y,10,COL.fishU);
      ctx.strokeStyle='rgba(95,240,208,.7)';ctx.lineWidth=1.4;
      ctx.beginPath();ctx.arc(x,y,15,0,7);ctx.stroke();
    }
    ctx.font='600 12.5px '+FONT;
    var w=ctx.measureText(f.n).width+10;
    ctx.fillStyle='rgba(5,20,33,.75)';
    roundRect(x-w/2,y+13,w,18,6);ctx.fill();
    ctx.fillStyle=(f.k==='交汇')?'#ffe6a6':'#a9fff0';
    ctx.fillText(f.n,x,y+26);
  }
  ctx.textAlign='left';
}
function drawExamLabels(){
  for(var i=0;i<LABELS.length;i++){
    var l=LABELS[i],x=PX(l.x),y=PY(l.y);
    chip(x,y,l.t,'#ffd166',12.5);
    if(l.s){
      ctx.font='11px '+FONT;ctx.fillStyle='rgba(255,209,102,.7)';
      ctx.textAlign='center';ctx.fillText(l.s,x,y+22);ctx.textAlign='left';
    }
  }
}
function drawClimate(){
  for(var i=0;i<CLIMATE.length;i++){
    var c=CLIMATE[i],x=PX(c.x),y=PY(c.y);
    ctx.font='12.5px '+FONT;
    var w=ctx.measureText(c.t).width+16;
    ctx.fillStyle='rgba(6,30,45,.88)';
    ctx.strokeStyle='rgba(120,255,220,.5)';ctx.lineWidth=1;
    roundRect(x,y-11,w,22,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#a9fff0';ctx.fillText(c.t,x+8,y+4.5);
  }
}
function drawSail(){
  for(var i=0;i<SAIL.length;i++){
    var s=SAIL[i],x=PX(s.x),y=PY(s.y);
    ctx.font='12.5px '+FONT;
    var w=ctx.measureText(s.t).width+16;
    ctx.fillStyle='rgba(36,26,6,.88)';
    ctx.strokeStyle='rgba(255,209,102,.5)';ctx.lineWidth=1;
    roundRect(x,y-11,w,22,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ffd98a';ctx.fillText(s.t,x+8,y+4.5);
  }
}
function drawPollution(){
  var targets=['gulf','peru','kuro','benguela','eac'];
  for(var i=0;i<targets.length;i++){
    var c=CURRENTS.filter(function(x){return x.id===targets[i];})[0];
    if(!c||!isVisible(c))continue;
    var g=geomOf(c);
    for(var j=0;j<7;j++){
      var t=(T*0.035*c.spd+j/7)%1,p=pointAt(g,t);
      ctx.fillStyle='rgba(226,168,90,.9)';
      ctx.beginPath();ctx.arc(p[0],p[1],3,0,7);ctx.fill();
      ctx.fillStyle='rgba(255,220,160,.55)';
      ctx.beginPath();ctx.arc(p[0],p[1],5.5,0,7);ctx.fill();
    }
  }
  chip(PX(-72),PY(-47),'污染扩散：加快净化速度，但扩大污染范围','#e2a85a',12.5);
}
function drawHover(){
  var c=S.hover;if(!c)return;
  var g=geomOf(c),col=colorOf(c);
  ctx.lineWidth=c.w+4;ctx.strokeStyle=hexA(col,.30);strokeGeo(g);
  ctx.lineWidth=1;ctx.strokeStyle='rgba(255,255,255,.9)';
  ctx.setLineDash([3,5]);strokeGeo(g);ctx.setLineDash([]);
}

/* =====================================================================
   6. 主渲染与动画循环
   ===================================================================== */
var T=0,last=performance.now();
function render(){
  ctx.clearRect(0,0,VW,VH);
  drawBase();
  if(S.layers.wind)drawWinds();
  for(var i=0;i<CURRENTS.length;i++){
    var c=CURRENTS[i];
    if(isVisible(c))drawCurrent(c);
  }
  if(S.hover&&isVisible(S.hover))drawHover();
  if(S.layers.fish)drawFisheries();
  if(S.layers.exam)drawExamLabels();
  if(S.layers.climate)drawClimate();
  if(S.layers.sail)drawSail();
  if(S.layers.poll)drawPollution();
}
function loop(now){
  var dt=Math.min((now-last)/1000,.05);last=now;T+=dt;
  if(S.playing){
    for(var i=0;i<CURRENTS.length;i++){
      var c=CURRENTS[i];
      if(!c.parts)continue;
      for(var j=0;j<c.parts.length;j++){
        var p=c.parts[j];
        p.t=(p.t+dt*c.spd*.055*p.sp)%1;
      }
    }
  }
  render();
  requestAnimationFrame(loop);
}

/* =====================================================================
   7. 命中测试与坐标换算
   ===================================================================== */
function distSeg(x,y,x1,y1,x2,y2){
  var dx=x2-x1,dy=y2-y1,L=dx*dx+dy*dy;
  var t=L?((x-x1)*dx+(y-y1)*dy)/L:0;
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(x-(x1+t*dx),y-(y1+t*dy));
}
function findCurrent(x,y){
  var best=null,bd=13,i,j,c,g;
  for(i=0;i<CURRENTS.length;i++){
    c=CURRENTS[i];
    if(!isVisible(c))continue;
    g=geomOf(c);
    for(j=1;j<g.P.length;j++){
      var d=distSeg(x,y,g.P[j-1][0],g.P[j-1][1],g.P[j][0],g.P[j][1]);
      if(d<bd){bd=d;best=c;}
    }
    if(c.dual){
      var g2=deepGeo(c);
      if(g2)for(j=1;j<g2.P.length;j++){
        var d2=distSeg(x,y,g2.P[j-1][0],g2.P[j-1][1],g2.P[j][0],g2.P[j][1]);
        if(d2<bd){bd=d2;best=c;}
      }
    }
  }
  return best;
}
function findFishery(x,y){
  for(var i=0;i<FISHERIES.length;i++){
    var f=FISHERIES[i];
    if(f._pos&&Math.hypot(x-f._pos.x,y-f._pos.y)<17)return f;
  }
  return null;
}
function findBadge(x,y){
  for(var i=0;i<CURRENTS.length;i++){
    var c=CURRENTS[i];
    if(c._badge&&Math.hypot(x-c._badge.x,y-c._badge.y)<24)return c;
  }
  return null;
}
function toLocal(e){
  var r=cv.getBoundingClientRect();
  var cx=e.clientX,cy=e.clientY;
  return {x:(cx-r.left)/r.width*VW,y:(cy-r.top)/r.height*VH,cx:cx,cy:cy,left:r.left,top:r.top};
}

  openModal(h);
}
function openFishery(f){
  var up=(f.k==='上升流');
  var h='<div class="ch" style="--c:'+(up?COL.fishU:COL.fishC)+'"><h2>'+f.n+'</h2>'+
    '<span class="tag '+(up?'c':'y')+'">'+f.k+'成因</span><span class="tag">'+(up?'★ 青色星标':'★ 金色星标')+'</span></div>';
  h+='<div class="kv"><b>主要成因</b><p>'+f.c+'</p></div>';
  h+='<div class="kv"><b>成因链（必背）</b><p class="chain">'+f.chain.replace(/→/g,'<em>→</em>')+'</p></div>';
  h+='<div class="kv"><b>高考考点</b><p>'+f.x+'</p></div>';
  h+='<div class="kv hl"><b>易错点</b><p>'+f.r+'</p></div>';
  if(up)h+='<div class="kv hl"><b>四大渔场中的“例外”</b><p>北海道、纽芬兰、北海三个渔场都是寒暖流交汇成因；只有秘鲁渔场是上升补偿流成因。判断渔场成因时先看有没有离岸风与上升流。</p></div>';
  openModal(h);
}

/* =====================================================================
   9. 测验模式
   ===================================================================== */
var quiz=null;
function qBlock(i,title,opts){
  var s='<div class="q" data-q="'+i+'"><p>'+title+'</p><div class="opts">';
  opts.forEach(function(o){
    s+='<button class="opt" data-q="'+i+'" data-v="'+o+'">'+(o==='密度流'?'密度流（双向）':o)+'</button>';
  });
  return s+'</div><div class="fb"></div></div>';
}
function startQuiz(){
  var c=CURRENTS[Math.floor(Math.random()*CURRENTS.length)];
  var t=(c.t==='密度流')?'密度流':(c.mon?(S.season==='summer'?'寒流':'暖流'):c.t);
  var cause=(c.ca==='风海流')?'风海流':((c.ca==='密度流')?'密度流':'补偿流');
  quiz={c:c,ans:[t,cause,c.s?'是':'否'],done:[false,false,false],score:0,
    seasonTxt:c.mon?('（本题按当前季节：'+(S.season==='summer'?'夏季':'冬季')+'）'):'',
    exp:[
      '性质要按“相对流经海区水温”判断。'+(c.mon?(S.season==='summer'?'夏季西南季风下为寒流；':'冬季东北季风下为暖流；'):'')+c.r,
      CAUSE_TXT[c.ca]+(c.ca==='上升补偿流'?'（上升流属于垂直补偿流。）':''),
      c.s?('这是特殊洋流。'+c.sp):('这不是特殊洋流，但要注意：'+c.r)
    ]};
  var h='<div class="ch" style="--c:'+colorOf(c)+'"><h2>随堂检测</h2><span class="tag">随机抽题</span><span class="tag y">三连问</span></div>';
  h+='<div class="kv"><b>题目洋流</b><p style="font-size:17px;color:#ffd166">'+c.n+'</p>'+
     '<p style="font-size:12.5px;color:#8fb8d2">先在图上找到它，再作答。'+quiz.seasonTxt+'</p></div>';
  h+=qBlock(0,'1. 它的性质是？',['暖流','寒流','密度流']);
  h+=qBlock(1,'2. 它的成因类型是？',['风海流','密度流','补偿流']);
  h+=qBlock(2,'3. 它是否属于特殊洋流？',['是','否']);
  h+='<div id="quizFoot"><div style="margin-top:10px;font-size:14px;color:#8ff0c2">本轮得分：0 / 3</div></div>';
  openModal(h);
}
function answer(i,v,btn){
  if(!quiz||quiz.done[i])return;
  quiz.done[i]=true;
  var ok=(v===quiz.ans[i]);
  if(ok)quiz.score++;
  btn.classList.add(ok?'ok':'no');
  var box=btn.closest('.q'),fb=box.querySelector('.fb');
  fb.style.display='block';
  fb.innerHTML=(ok?'<span style="color:#8ff0c2">✔ 正确。</span> ':'<span style="color:#ffb3b3">✘ 错误，正确答案：'+quiz.ans[i]+'。</span><br>')+quiz.exp[i];
  box.querySelectorAll('.opt').forEach(function(b){
    if(b!==btn&&b.dataset.v===quiz.ans[i])b.classList.add('ok');
    b.disabled=true;
  });
  document.getElementById('quizFoot').innerHTML=
    '<div style="margin-top:10px;font-size:14px;color:#8ff0c2">本轮得分：'+quiz.score+' / 3</div>'+
    (quiz.done.every(Boolean)?'<button class="btn sm" style="margin-top:8px;width:auto" data-next="1">下一题 →</button>':'');
}
mbody.addEventListener('click',function(e){
  var b=e.target.closest('.opt');
  if(b){answer(+b.dataset.q,b.dataset.v,b);return;}
  if(e.target.closest('[data-next]'))startQuiz();
});

/* =====================================================================
   10. 对比模式（并列示意图）
   ===================================================================== */
function dArrow(g,x1,y1,x2,y2,col,lw,head){
  g.strokeStyle=col;g.fillStyle=col;g.lineWidth=lw||3;g.lineCap='round';
  g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
  var a=Math.atan2(y2-y1,x2-x1),s=head||11;
  g.beginPath();g.moveTo(x2,y2);
  g.lineTo(x2-s*Math.cos(a-.42),y2-s*Math.sin(a-.42));
  g.lineTo(x2-s*Math.cos(a+.42),y2-s*Math.sin(a+.42));
  g.closePath();g.fill();
}
function loopBox(g,x,y,w,h,cw,col,title,sub){
  g.fillStyle='rgba(10,40,64,.9)';g.strokeStyle='rgba(120,175,210,.45)';g.lineWidth=1.5;
  g.beginPath();g.rect(x,y,w,h);g.fill();g.stroke();
  var p=18;
  if(cw){
    dArrow(g,x+p,y+p,x+w-p,y+p,col,3);
    dArrow(g,x+w-p,y+p,x+w-p,y+h-p,col,3);
    dArrow(g,x+w-p,y+h-p,x+p,y+h-p,col,3);
    dArrow(g,x+p,y+h-p,x+p,y+p,col,3);
  }else{
    dArrow(g,x+w-p,y+p,x+p,y+p,col,3);
    dArrow(g,x+w-p,y+h-p,x+w-p,y+p,col,3);
    dArrow(g,x+p,y+h-p,x+w-p,y+h-p,col,3);
    dArrow(g,x+p,y+p,x+p,y+h-p,col,3);
  }
  g.textAlign='center';
  g.fillStyle='#eaf7ff';g.font='600 15px '+FONT;
  g.fillText(title,x+w/2,y+h/2-4);
  g.fillStyle='rgba(190,222,242,.82)';g.font='12.5px '+FONT;
  g.fillText(sub,x+w/2,y+h/2+18);
  g.textAlign='left';
}
function cmpTitle(g,W,t1,t2){
  g.fillStyle='#eaf7ff';g.font='600 15px '+FONT;g.textAlign='center';
  g.fillText(t1,W*0.26,30);g.fillText(t2,W*0.74,30);g.textAlign='left';
}
function cmp1(g,W,H){
  g.fillStyle='#081c2c';g.fillRect(0,0,W,H);
  cmpTitle(g,W,'北半球副热带环流：顺时针','北印度洋季风环流：夏顺冬逆');

  loopBox(g,W*0.54,50,W*0.40,H-160,true,COL.cold,'北印度洋（夏季）','西南季风 → 顺时针');
  g.font='13px '+FONT;g.fillStyle='#ffd166';g.textAlign='center';
  g.fillText('速记：北顺南逆 · 东暖西寒（大陆东岸＝大洋西岸）',W*0.26,H-70);
  g.fillText('冬季：东北季风 → 逆时针，环流整体反转',W*0.74,H-70);

  g.textAlign='left';
}
function cmp2(g,W,H){
  g.fillStyle='#081c2c';g.fillRect(0,0,W,H);
  cmpTitle(g,W,'寒暖流交汇渔场（北海道/纽芬兰/北海）','上升流渔场（秘鲁）');
  g.fillStyle='rgba(10,40,64,.9)';g.strokeStyle='rgba(120,175,210,.45)';

  g.beginPath();g.rect(W*0.54,50,W*0.40,H-110);g.fill();g.stroke();
  dArrow(g,90,250,215,130,COL.warm,4);
  dArrow(g,330,90,215,130,COL.cold,4);
  star(222,126,12,COL.fishC);
  g.font='12.5px '+FONT;g.fillStyle='#ff9a86';g.textAlign='left';
  g.fillText('暖流（由低纬来）',88,268);
  g.fillStyle='#86c9ff';g.fillText('寒流（由高纬来）',300,84);
  g.fillStyle='#ffe6a6';g.fillText('★ 交汇处：海水扰动、营养盐上泛',150,296);
  g.fillStyle='rgba(190,222,242,.85)';g.fillText('日本暖流＋千岛寒流 / 墨西哥湾暖流＋拉布拉多寒流 / 北大西洋暖流＋东格陵兰寒流',40,322);

  g.fillStyle='#1e3d54';g.strokeStyle='#5d8fae';
  g.beginPath();g.rect(W*0.54+300,50,60,H-110);g.fill();g.stroke();
  g.fillStyle='rgba(200,230,245,.8)';g.font='12px '+FONT;
  g.fillText('陆地',W*0.54+312,72);
  [120,170,220].forEach(function(y,idx){
    dArrow(g,W*0.54+290,y,W*0.54+120,y,'rgba(255,255,255,.75)',2.5,9);
  });
  g.fillStyle='rgba(255,255,255,.8)';
  g.fillText('离岸风（东南信风）',W*0.54+120,105);
  [0,1,2].forEach(function(i){
    var x=W*0.54+270-i*26;
    dArrow(g,x,240,x,150,'rgba(95,240,208,.9)',2.5,9);
  });
  star(W*0.54+225,120,12,COL.fishU);
  g.fillStyle='#a9fff0';g.fillText('↑ 深层冷海水上涌，带营养盐',W*0.54+70,268);
  g.fillStyle='#a9fff0';g.fillText('★ 秘鲁渔场：上升补偿流成因',W*0.54+110,296);
}
function cmp3(g,W,H){
  g.fillStyle='#081c2c';g.fillRect(0,0,W,H);
  cmpTitle(g,W,'一般判定：看相对水温','索马里洋流：季节性质反转');
  g.fillStyle='rgba(10,40,64,.9)';g.strokeStyle='rgba(120,175,210,.45)';
  g.beginPath();g.rect(30,50,W*0.40,H-110);g.fill();g.stroke();
  g.beginPath();g.rect(W*0.54,50,W*0.40,H-110);g.fill();g.stroke();
  dArrow(g,140,265,140,90,COL.warm,4);
  dArrow(g,260,90,260,265,COL.cold,4);
  g.font='12.5px '+FONT;g.fillStyle='#ff9a86';g.textAlign='left';
  g.fillText('低纬 → 高纬：一般判为暖流',70,86);
  g.fillStyle='#86c9ff';g.fillText('高纬 → 低纬：一般判为寒流',190,285);
  g.fillStyle='#ffd166';g.fillText('前提：水温高于流经海区＝暖流；低于＝寒流',50,315);

  dArrow(g,W*0.54+120,265,W*0.54+120,95,COL.cold,4);
  dArrow(g,W*0.54+250,95,W*0.54+250,265,COL.warm,4);
  g.fillStyle='#86c9ff';g.fillText('夏季：低纬→高纬，却是寒流',W*0.54+40,80);
  g.fillStyle='#ff9a86';g.fillText('冬季：高纬→低纬，却是暖流',W*0.54+175,285);
  g.fillStyle='#ffd166';g.fillText('全球唯一明显随季节反转性质的洋流',W*0.54+40,315);
}
function cmp4(g,W,H){
  g.fillStyle='#081c2c';g.fillRect(0,0,W,H);
  g.fillStyle='#eaf7ff';g.font='600 15px '+FONT;g.textAlign='center';
  g.fillText('南极环流 与 西风漂流：方向、驱动、性质对比',W/2,28);g.textAlign='left';
  g.fillStyle='rgba(10,40,64,.9)';g.strokeStyle='rgba(120,175,210,.45)';
  g.beginPath();g.rect(40,60,W-80,95);g.fill();g.stroke();
  [0.2,0.42,0.64,0.86].forEach(function(f){
    dArrow(g,40+(W-80)*f-40,107,40+(W-80)*f+40,107,COL.cold,3.5,10);
  });
  g.fillStyle='#86c9ff';g.font='13px '+FONT;
  g.fillText('西风漂流：40°S—60°S · 盛行西风驱动 · 自西向东 · 寒流',60,84);
  g.fillStyle='rgba(190,222,242,.8)';g.font='12px '+FONT;
  g.fillText('北半球同受西风驱动的是北大西洋暖流、北太平洋暖流 → “南北同风不同性”',60,140);

  g.fillStyle='rgba(10,40,64,.9)';g.strokeStyle='rgba(120,175,210,.45)';
  g.beginPath();g.rect(40,190,W-80,95);g.fill();g.stroke();
  [0.2,0.42,0.64,0.86].forEach(function(f){
    dArrow(g,40+(W-80)*f+40,237,40+(W-80)*f-40,237,COL.cold,3.5,10);
  });
  g.fillStyle='#86c9ff';g.fillText('南极环流（南极绕极流）：约65°S—70°S · 极地东风驱动 · 自东向西 · 寒流',60,214);
  g.fillStyle='rgba(190,222,242,.8)';
  g.fillText('全球唯一东西贯通整个纬圈、不受大陆边界限制的大型洋流',60,270);
  g.fillStyle='#ffd166';g.font='13px '+FONT;
  g.fillText('记忆：西风漂流更北、自西向东；南极环流更南、自东向西。两者不能混为一谈。',60,318);
}
var CMP={
 1:{d:cmp1,n:'对比要点：一般中低纬副热带环流方向常年固定（北顺南逆、东暖西寒）；北印度洋季风环流是唯一随季节整体反转的大尺度海区——夏季西南季风顺时针，冬季东北季风逆时针，即“夏顺冬逆”。'},
 2:{d:cmp2,n:'对比要点：北海道、纽芬兰、北海都是“寒暖流交汇→海水扰动→营养盐上泛→浮游生物繁盛”的成因；秘鲁渔场是“离岸风→表层海水离岸→深层冷海水上涌→营养盐上涌”的上升补偿流成因，四大渔场中独树一帜。'},
 3:{d:cmp3,n:'对比要点：一般规律是“低纬流向高纬为暖流、高纬流向低纬为寒流”，但判断标准始终是相对流经海区的水温。索马里洋流夏季由低纬流向高纬却是寒流（上升流），冬季由高纬流向低纬却是暖流，是全球唯一明显季节性质反转的洋流。'},
 4:{d:cmp4,n:'对比要点：西风漂流位于40°S—60°S，由盛行西风驱动，自西向东，性质为寒流；南极环流更靠南（约65°S—70°S），由极地东风驱动，自东向西，是全球唯一东西贯通整个纬圈、不受大陆阻挡的洋流。'}
};
function openCompare(n){
  openModal('<div class="cmpwrap"><canvas id="cmpc" width="960" height="360"></canvas></div><div class="cmpnote" id="cmpnote"></div>');
  var c=document.getElementById('cmpc'),g=c.getContext('2d');
  CMP[n].d(g,960,360);
  document.getElementById('cmpnote').textContent=CMP[n].n;
}

/* =====================================================================
   11. 事件绑定、季节切换、图层、初始化
   ===================================================================== */
document.getElementById('btnPlay').onclick=function(){
  S.playing=!S.playing;
  this.textContent=S.playing?'⏸ 暂停':'▶ 播放';
};
document.getElementById('btnReset').onclick=resetAll;
document.getElementById('btnQuiz').onclick=startQuiz;
document.querySelectorAll('.cmps .btn').forEach(function(b){
  b.onclick=function(){openCompare(+b.dataset.cmp);};
});
document.querySelectorAll('.segbtn').forEach(function(b){
  b.onclick=function(){
    S.season=b.dataset.season;
    updateSeasonUI();
    if(quiz&&quiz.c.mon)startQuiz();
  };
});
document.getElementById('layers').addEventListener('change',function(e){
  var kk=e.target.dataset.layer;
  if(!kk)return;
  S.layers[kk]=e.target.checked?1:0;
});
cv.addEventListener('pointermove',function(e){
  var p=toLocal(e),c=findCurrent(p.x,p.y),tip=document.getElementById('tip');
  S.hover=c;
  if(c){
    tip.style.display='block';
    tip.style.left=(p.cx-p.left)+'px';
    tip.style.top=(p.cy-p.top)+'px';
    tip.textContent=c.n+'　'+effType(c)+(c.s?'　（特殊洋流·点击看例外）':'');
    cv.style.cursor='pointer';
  }else{
    tip.style.display='none';
    cv.style.cursor=(findFishery(p.x,p.y)||findBadge(p.x,p.y))?'pointer':'crosshair';
  }
});
cv.addEventListener('pointerleave',function(){
  S.hover=null;document.getElementById('tip').style.display='none';
});
cv.addEventListener('click',function(e){
  var p=toLocal(e);
  var b=findBadge(p.x,p.y); if(b){openCurrent(b,true);return;}
  var f=findFishery(p.x,p.y); if(f){openFishery(f);return;}
  var c=findCurrent(p.x,p.y); if(c)openCurrent(c,false);
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});

function updateSeasonUI(){
  document.getElementById('seasonPill').textContent='当前季节：'+(S.season==='summer'?'夏季':'冬季');
  document.getElementById('seasonHint').textContent=S.season==='summer'
    ?'夏季：西南季风→北印度洋环流顺时针；索马里洋流为寒流（上升流），形成季节性渔场。'
    :'冬季：东北季风→北印度洋环流逆时针；索马里洋流为暖流——由较高纬流向较低纬的暖流例外。';
  document.querySelectorAll('.segbtn').forEach(function(b){
    b.classList.toggle('on',b.dataset.season===S.season);
  });
}
function resetAll(){
  S.playing=true;S.season='summer';S.hover=null;
  for(var kk in S.layers)S.layers[kk]=0;
  S.layers.warm=1;S.layers.cold=1;S.layers.special=1;
  S.layers.fish=1;S.layers.wind=1;S.layers.exam=1;
  document.querySelectorAll('#layers input').forEach(function(i){
    i.checked=!!S.layers[i.dataset.layer];
  });
  document.getElementById('btnPlay').textContent='⏸ 暂停';
  closeModal();updateSeasonUI();
}
function initParticles(){
  for(var i=0;i<CURRENTS.length;i++){
    var c=CURRENTS[i],g=geomOf(c);
    var n=Math.max(6,Math.round(g.total/46));
    c.parts=[];
    for(var j=0;j<n;j++)c.parts.push({t:j/n,sp:.85+Math.random()*.3});
  }
}
function init(){
  resize();
  initParticles();
  updateSeasonUI();
  window.addEventListener('resize',resize);
  window.addEventListener('orientationchange',function(){setTimeout(resize,200);});
  requestAnimationFrame(loop);
}
init();
})();
