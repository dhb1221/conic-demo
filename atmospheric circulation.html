<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大气环流动态示意图 · 高中地理</title>
<style>
:root{
  --panel:#0d1724;--line:#1e3448;--txt:#e6eef8;--mut:#8fa3ba;
  --low:#f0564a;--sh:#f0a03c;--sl:#4f93e8;--ph:#3c6ea5;
  --up:#ff6252;--dn:#4f93e8;--wd:#ffd873;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;height:100vh;overflow:hidden;color:var(--txt);
  background:radial-gradient(1200px 700px at 50% -10%,#122033,#070d15 62%);
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  display:flex;flex-direction:column;
}
/* 顶栏 */
.topbar{height:56px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(16,29,44,.96),rgba(9,17,27,.92))}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;
  background:conic-gradient(from 0deg,var(--low),var(--sh),var(--sl),var(--ph),var(--low));
  box-shadow:0 0 14px #4f93e8aa}
.brand h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
.badge{font-size:11px;color:#9fc4e6;border:1px solid #294b68;background:#102638;
  padding:2px 8px;border-radius:20px;white-space:nowrap}
.top-actions{display:flex;gap:7px}
/* 按钮 */
.btn{font-family:inherit;font-size:13px;color:#cfe0f2;background:#132234;
  border:1px solid #26415b;border-radius:9px;padding:7px 10px;cursor:pointer;
  transition:.15s;white-space:nowrap}
.btn:hover{background:#1a3049;border-color:#3a648a;color:#fff}
.btn.active{background:linear-gradient(180deg,#1f4a6e,#173a58);
  border-color:#4b8fbe;color:#fff;box-shadow:inset 0 0 0 1px #2e6c96}
.btn.ghost{background:transparent}
.btn.sm{font-size:12px;padding:6px 8px}
.btn.wide{width:100%;margin-bottom:6px}
#btnDrawer{display:none}
.icon-btn{display:none;background:transparent;border:none;color:#8fa3ba;
  font-size:22px;line-height:1;cursor:pointer}
/* 三栏 */
.app{flex:1 1 auto;min-height:0;display:grid;
  grid-template-columns:232px minmax(0,1fr) 296px;gap:10px;padding:10px 12px}
.panel{background:linear-gradient(180deg,rgba(16,29,44,.94),rgba(10,18,28,.94));
  border:1px solid var(--line);border-radius:14px;padding:10px;overflow-y:auto;
  scrollbar-width:thin}
.panel::-webkit-scrollbar{width:6px}
.panel::-webkit-scrollbar-thumb{background:#274058;border-radius:4px}
.ph{font-size:11px;letter-spacing:1.4px;color:#7994ae;font-weight:700;
  margin:2px 0 8px;display:flex;align-items:center;justify-content:space-between}
.ph:not(:first-child){margin-top:14px;padding-top:11px;border-top:1px dashed #1c3142}
.mnav{display:flex;flex-direction:column;gap:5px}
.mbtn{display:flex;align-items:center;gap:8px;text-align:left;width:100%;
  background:#0f1e2d;border:1px solid #1e3549;border-radius:10px;padding:6px 8px;
  color:#c3d6e8;cursor:pointer;font-family:inherit;transition:.15s}
.mbtn:hover{background:#152b40;border-color:#2f587a}
.mbtn.active{background:linear-gradient(90deg,#1c4363,#122c42);
  border-color:#4a8cbb;color:#fff}
.mbtn .no{font-size:11px;font-weight:700;color:#7c9bb6;background:#0a1622;
  border:1px solid #243f57;border-radius:6px;padding:2px 5px;flex:0 0 auto}
.mbtn.active .no{color:#bfe4ff;border-color:#4a8cbb}
.mbtn .nm{font-size:12.5px;font-weight:600;line-height:1.1}
.mbtn .ds{font-size:10px;color:#7890a8;display:block;margin-top:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sw-list{display:flex;flex-direction:column;gap:6px}
.switch{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  background:#0f1e2d;border:1px solid #1e3549;border-radius:9px;color:#a9bdd2;
  padding:7px 9px;font-size:12px;cursor:pointer;font-family:inherit;transition:.15s}
.switch:hover{border-color:#31597a}
.switch i{width:30px;height:16px;border-radius:10px;background:#23384b;
  position:relative;display:inline-block;flex:0 0 auto;transition:.18s}
.switch i::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;
  border-radius:50%;background:#7f97ac;transition:.18s}
.switch.on{color:#e6f4ff;border-color:#3c7ba6;background:#12283a}
.switch.on i{background:#2e6f9b}
.switch.on i::after{left:16px;background:#d8f0ff}
.hint{font-size:11px;line-height:1.6;color:#7f96ac;margin:7px 0 0}
/* 舞台 */
.stage-wrap{background:linear-gradient(180deg,#0b1622,#08111b);
  border:1px solid var(--line);border-radius:16px;padding:4px;min-height:0;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{width:100%;height:100%;display:block}
/* 右侧知识卡 */
.panel.right{display:flex;flex-direction:column;gap:9px}
#know{display:flex;flex-direction:column;gap:8px}
.khead{display:flex;gap:8px;align-items:flex-start}
.kno{font-size:12px;font-weight:700;color:#bfe4ff;background:#15324a;
  border:1px solid #35668c;border-radius:8px;padding:4px 7px;flex:0 0 auto}
.khead h2{font-size:14.5px;margin:0;line-height:1.3}
.ksub{font-size:11px;color:#7d95ad;margin:3px 0 0}
.kb h3{font-size:11px;letter-spacing:1px;color:#7fa0bb;margin:0 0 4px}
.kb p{font-size:12.2px;line-height:1.66;color:#c2d4e6;margin:0}
.kb b{color:#ffe4a8;font-weight:600}
.kstatus{font-size:11px;color:#8fa8bf;background:#0b1826;border:1px solid #1d3346;
  border-radius:8px;padding:6px 8px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:inherit;font-size:11.5px;color:#ffd9a0;background:#1d2a1c;
  border:1px solid #5c4a26;border-radius:20px;padding:4px 9px;cursor:pointer;transition:.15s}
.chip:hover{background:#2c3d25;border-color:#a07f3e;color:#fff0c8}
.legend{border:1px solid #1d3346;border-radius:12px;padding:9px;background:#0b1826}
.legend h3{font-size:11px;letter-spacing:1px;color:#7994ae;margin:0 0 7px}
.legend-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}
.legend-grid span{font-size:11px;color:#a9bdd2;display:flex;align-items:center;gap:5px}
.legend-grid i{width:10px;height:10px;border-radius:3px;flex:0 0 auto;display:inline-block}
/* 时间轴 */
.timeline{flex:0 0 auto;display:grid;grid-template-columns:150px minmax(0,1fr) 280px;
  gap:12px;align-items:center;padding:9px 16px 12px;border-top:1px solid var(--line);
  background:linear-gradient(0deg,rgba(12,22,34,.98),rgba(10,18,28,.92))}
.tl-block{display:flex;flex-direction:column;gap:2px;font-size:11px;color:#8298af}
.tl-block strong{font-size:14px;color:#ffe4a8;font-weight:700}
.tl-block.right{flex-direction:row;justify-content:flex-end;gap:14px;flex-wrap:wrap;align-items:center}
.tl-block.right b{color:#ffd873}
.tl-slider{position:relative;padding-bottom:13px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;
  border-radius:4px;outline:none;cursor:pointer;
  background:linear-gradient(90deg,#3c6ea5,#4f93e8 35%,#f0a03c 70%,#f0564a)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;
  border-radius:50%;background:#fff;border:3px solid #2e6f9b;box-shadow:0 0 10px #4f93e8aa}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;
  background:#fff;border:3px solid #2e6f9b;cursor:pointer}
.tl-ticks{position:absolute;left:0;right:0;top:14px;display:flex;
  justify-content:space-between;font-size:10px;color:#6c8298}
/* 弹窗 */
.modal{position:fixed;inset:0;background:rgba(3,8,15,.74);z-index:80;display:none;
  align-items:center;justify-content:center;padding:18px}
.modal.open{display:flex}
.modal-card{width:min(560px,96vw);max-height:84vh;overflow-y:auto;
  background:linear-gradient(180deg,#122234,#0b1624);border:1px solid #35668c;
  border-radius:16px;padding:18px;box-shadow:0 24px 80px rgba(0,0,0,.65)}
.modal-card h3{margin:0 0 9px;font-size:16.5px;color:#ffe4a8}
.modal-card p{font-size:13.2px;line-height:1.8;color:#c9dbeb;margin:0 0 9px}
.modal-card .warn{background:#2a1f12;border-left:3px solid #f0a03c;
  padding:8px 10px;border-radius:6px;color:#ffd9a0}
.modal-close{float:right;background:#17293b;border:1px solid #2d4d66;color:#a9bdd2;
  border-radius:8px;padding:4px 10px;cursor:pointer;font-family:inherit}
.tip-svg{width:100%;height:auto;border:1px solid #24415a;border-radius:10px;
  margin:6px 0 10px;background:#08131f}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35;display:none}
/* SVG 文本 */
.h1{font-size:21px;font-weight:700;fill:#fff;letter-spacing:.6px;text-anchor:start}
.sub{font-size:12.5px;fill:#8ba3bb;text-anchor:start}
.t{fill:#dce8f5;font-size:13px;text-anchor:middle;font-family:inherit}
.t.small{font-size:11.5px;fill:#9cb1c7}
.windlab{fill:#ffe9a8;font-size:12.5px;font-weight:600;text-anchor:middle;
  paint-order:stroke;stroke:#08111c;stroke-width:4;stroke-linejoin:round}
.label{transition:opacity .2s}
svg.hide-labels .label{opacity:0;pointer-events:none}
.clickable{cursor:pointer}
.clickable:hover{filter:brightness(1.25)}
/* 动画 */
@keyframes pulseGrow{0%{transform:scale(.45);opacity:.75}70%{opacity:.18}100%{transform:scale(2.3);opacity:0}}
.pulse{animation:pulseGrow 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
svg.focus30 .pulse{animation-duration:1.5s}
@keyframes shatterFade{0%{opacity:1;transform:none}25%{opacity:.95;transform:translateY(-5px) scale(1.01)}
  100%{opacity:0;transform:translateY(16px) scale(.93)}}
#singleWrap.shatter{animation:shatterFade 1.15s cubic-bezier(.3,.1,.4,1) forwards;
  transform-box:fill-box;transform-origin:center}
@keyframes appearUp{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
#threeWrap.appear{animation:appearUp .85s .55s cubic-bezier(.2,.8,.3,1) both;
  transform-box:fill-box;transform-origin:center}
@keyframes blobIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
.blob{animation:blobIn .85s cubic-bezier(.2,.85,.3,1) both;
  transform-box:fill-box;transform-origin:center}
svg.paused *{animation-play-state:paused!important}
/* 响应式 */
@media (max-width:1120px){
  .app{grid-template-columns:216px minmax(0,1fr) 268px}
  .badge{display:none}
}
@media (max-width:900px){
  body{overflow:auto;height:auto;min-height:100dvh}
  .topbar{position:sticky;top:0;z-index:30}
  #btnDrawer{display:inline-flex}
  .app{grid-template-columns:1fr;padding:8px;gap:8px}
  .panel.left{position:fixed;top:0;bottom:0;left:0;width:280px;z-index:40;
    border-radius:0 16px 16px 0;transform:translateX(-105%);transition:transform .25s;
    box-shadow:20px 0 60px rgba(0,0,0,.6)}
  .panel.left.open{transform:translateX(0)}
  .icon-btn{display:block}
  .stage-wrap{order:2;min-height:54vh}
  .panel.right{order:3}
  .timeline{grid-template-columns:1fr;gap:6px;padding:8px 12px 12px}
  .tl-block.right{justify-content:flex-start}
  .brand h1{font-size:15px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <h1>大气环流动态示意图</h1>
    <span class="badge">高中地理 · 大气环流</span>
  </div>
  <div class="top-actions">
    <button class="btn ghost" id="btnDrawer">☰ 控制台</button>
    <button class="btn ghost" id="btnPauseTop">暂停</button>
  </div>
</header>

<main class="app">
  <aside class="panel left" id="leftPanel">
    <div class="ph"><span>模块导航</span><button class="icon-btn" id="btnCloseDrawer">×</button></div>
    <nav class="mnav" id="moduleNav"></nav>

    <div class="ph">动画控制</div>
    <div class="grid2">
      <button class="btn" id="btnPause">暂停</button>
      <button class="btn" id="btnReset">重置</button>
      <button class="btn" id="btnSlow">慢放 1x</button>
      <button class="btn active" id="btnLabels">标注 开</button>
    </div>

    <div class="ph">条件开关</div>
    <div class="sw-list">
      <button class="switch" data-toggle="coriolisOn"><i></i>地转偏向力</button>
      <button class="switch" data-toggle="landSeaOn"><i></i>加入海陆分布</button>
      <button class="switch" data-toggle="plateauOn"><i></i>叠加青藏高原</button>
      <button class="switch" data-toggle="climateLayerOn"><i></i>气候带示意层</button>
    </div>

    <div class="ph">本模块选项</div>
    <div id="moduleControls"></div>
  </aside>

  <section class="stage-wrap">
    <svg id="stage" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet"
      role="img" aria-label="大气环流动态示意图"></svg>
  </section>

  <aside class="panel right">
    <div id="know"></div>
    <div class="legend">
      <h3>图例</h3>
      <div class="legend-grid">
        <span><i style="background:#f0564a"></i>赤道低压 / 上升</span>
        <span><i style="background:#f0a03c"></i>副热带高压</span>
        <span><i style="background:#4f93e8"></i>副极地低压 / 下沉</span>
        <span><i style="background:#3c6ea5"></i>极地高压</span>
        <span><i style="background:#ffd873"></i>风带 / 气流</span>
        <span><i style="background:#5fd39b"></i>气候示意层</span>
      </div>
    </div>
  </aside>
</main>

<footer class="timeline">
  <div class="tl-block">
    <span>时间轴（1—12 月）</span>
    <strong id="monthVal">7.0 月</strong>
  </div>
  <div class="tl-slider">
    <input id="month" type="range" min="1" max="12" step="0.1" value="7" aria-label="月份">
    <div class="tl-ticks"><span>1月</span><span>4月</span><span>7月</span><span>10月</span><span>12月</span></div>
  </div>
  <div class="tl-block right">
    <span>太阳直射点 <b id="declVal">—</b></span>
    <span>气压带偏移 <b id="shiftVal">—</b></span>
  </div>
</footer>

<div class="backdrop" id="backdrop"></div>

<div class="modal" id="modal">
  <div class="modal-card">
    <button class="modal-close" id="modalClose">关闭</button>
    <h3 id="modalTitle">提示</h3>
    <div id="modalBody"></div>
  </div>
</div>

<script>
/* ===== 第 2 段从这里开始粘贴 ===== */
(function(){
"use strict";

/* ================= 1. 配置与状态 ================= */
const NS="http://www.w3.org/2000/svg";
const C={low:"#f0564a",sh:"#f0a03c",sl:"#4f93e8",ph:"#3c6ea5",
         up:"#ff6252",dn:"#4f93e8",wd:"#ffd873"};

const DEF={currentModule:"thermal",season:7,coriolisOn:false,landSeaOn:false,
  plateauOn:false,climateLayerOn:true,paused:false,speed:1,showLabels:true,
  thermalMode:"landsea",focus30:false};
const S=Object.assign({},DEF);

const MODULES=[
  {id:"thermal",n:"01",name:"热力环流",desc:"母版 · 冷热不均"},
  {id:"single", n:"02",name:"单圈环流",desc:"假设地球不自转"},
  {id:"three",  n:"03",name:"三圈环流",desc:"低纬·中纬·高纬"},
  {id:"belts",  n:"04",name:"七压六风",desc:"气压带与风带"},
  {id:"season", n:"05",name:"季节移动",desc:"随直射点移动"},
  {id:"landsea",n:"06",name:"海陆修正",desc:"带状 → 块状"},
  {id:"monsoon",n:"07",name:"季风环流",desc:"东亚 · 南亚"},
  {id:"climate",n:"08",name:"气候落地",desc:"环流 → 气候"}
];

const TM={
  landsea:{name:"海陆风",btn:"海陆风",
    hint:"白天陆地升温快，近地面陆地形成低压，风从海洋吹向陆地（海风）。",
    result:"白天海风、夜晚陆风，是最基本的热力环流。"},
  valley:{name:"山谷风",btn:"山谷风",
    hint:"白天山坡受热快，气流沿坡上升，谷底空气补充（谷风）；夜晚相反。",
    result:"白天谷风、夜晚山风，属于热力环流的地方性表现。"},
  city:{name:"城市热岛环流",btn:"城市热岛",
    hint:"城区气温高、气流上升，近地面风由郊区吹向城区。",
    result:"形成城市热岛环流，郊区污染物容易被带回城区。"}
};

const $=s=>document.querySelector(s);
const stage=document.getElementById("stage");

let streams=[],pending=[],animTime=0,lastT=performance.now();

/* ================= 2. 基础工具 ================= */
function base(){
  return defs()+'<rect x="0" y="0" width="1000" height="620" fill="url(#sky)"/>';
}
function defs(){
  return `<defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1826"/><stop offset="1" stop-color="#08111c"/>
    </linearGradient>
    <marker id="mRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13"
      markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="${C.up}"/></marker>
    <marker id="mBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13"
      markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="${C.dn}"/></marker>
    <marker id="mWind" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11"
      markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="${C.wd}"/></marker>
    <marker id="mOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12"
      markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="${C.sh}"/></marker>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>`;
}
function head(t,s){
  return `<text x="40" y="46" class="h1">${t}</text>
          <text x="40" y="70" class="sub">${s}</text>`;
}
function tx(x,y,s,cls,extra){
  return `<text x="${x}" y="${y}" class="${cls||"t"}" ${extra||""}>${s}</text>`;
}
function tag(x,y,text,color,tip,w,action){
  const width=w||Math.max(92,text.length*13+26);
  const attr=action?`data-action="${action}"`:`data-tip="${tip}"`;
  return `<g class="clickable label" ${attr}>
    <rect x="${x-width/2}" y="${y-15}" width="${width}" height="30" rx="15"
      fill="#0b1522" fill-opacity=".94" stroke="${color}" stroke-opacity=".8"/>
    <text x="${x}" y="${y+4}" text-anchor="middle" fill="${color}"
      font-size="13" font-weight="600">${text}</text></g>`;
}
function latY(lat,top,bot){
  top=(top===undefined)?110:top; bot=(bot===undefined)?530:bot;
  return top+(90-lat)/180*(bot-top);
}
function beltShift(m){return 7*Math.sin(2*Math.PI*(m-4.7)/12);}
function declOf(m){return 23.5*Math.sin(2*Math.PI*(m-3.7)/12);}
function fmtLat(v){
  if(Math.abs(v)<0.05)return "0°";
  return Math.abs(v).toFixed(1)+"°"+(v>0?"N":"S");
}
function isSummer(){return S.season>=5&&S.season<=9;}

/* ================= 3. 粒子系统 ================= */
function addStream(d,opt){
  pending.push(Object.assign({d:d,n:8,k:0.18,color:C.wd,r:3,opacity:.95},opt||{}));
}
function finalizeStreams(){
  const cache=document.getElementById("pathCache");
  const layer=document.getElementById("particleLayer");
  streams=[];
  if(!cache||!layer)return;
  pending.forEach(function(def){
    const p=document.createElementNS(NS,"path");
    p.setAttribute("d",def.d);
    p.setAttribute("fill","none");
    cache.appendChild(p);
    let len=1;
    try{len=p.getTotalLength()||1;}catch(e){len=1;}
    const items=[];
    for(let i=0;i<def.n;i++){
      const c=document.createElementNS(NS,"circle");
      c.setAttribute("r",def.r);
      c.setAttribute("fill",def.color);
      c.setAttribute("opacity",def.opacity);
      layer.appendChild(c);
      items.push({el:c,off:i/def.n});
    }
    streams.push({path:p,len:len,items:items,k:def.k});
  });
  updateParticles();
}
function updateParticles(){
  for(let i=0;i<streams.length;i++){
    const st=streams[i];
    for(let j=0;j<st.items.length;j++){
      const it=st.items[j];
      let u=(it.off+animTime*st.k)%1;
      if(u<0)u+=1;
      let pt; try{pt=st.path.getPointAtLength(u*st.len);}catch(e){continue;}
      it.el.setAttribute("cx",pt.x);
      it.el.setAttribute("cy",pt.y);
    }
  }
}

/* ================= 4. 绘图形状工具 ================= */
function loopD(x1,x2,yT,yB,dir){
  const r=16;
  if(dir==="upRight"){
    return `M${x2},${yB} L${x2},${yT+r} Q${x2},${yT} ${x2-r},${yT}
      L${x1+r},${yT} Q${x1},${yT} ${x1},${yT+r}
      L${x1},${yB-r} Q${x1},${yB} ${x1+r},${yB}
      L${x2-r},${yB} Q${x2},${yB} ${x2},${yB-r} Z`;
  }
  return `M${x2},${yT} L${x2},${yB-r} Q${x2},${yB} ${x2-r},${yB}
    L${x1+r},${yB} Q${x1},${yB} ${x1},${yB-r}
    L${x1},${yT+r} Q${x1},${yT} ${x1+r},${yT}
    L${x2-r},${yT} Q${x2},${yT} ${x2},${yT+r} Z`;
}
function tri(x,y,rot,color){
  return `<path d="M-6.5,-5 L6.5,0 L-6.5,5 Z" fill="${color}"
    transform="translate(${x},${y}) rotate(${rot})"/>`;
}
function loopArrows(x1,x2,yT,yB,dir,color){
  const mx=(x1+x2)/2,my=(yT+yB)/2;
  if(dir==="upRight"){
    return tri(x2,my,-90,color)+tri(x1,my,90,color)+
           tri(mx,yT,180,color)+tri(mx,yB,0,color);
  }
  return tri(x2,my,90,color)+tri(x1,my,-90,color)+
         tri(mx,yT,0,color)+tri(mx,yB,180,color);
}
function zoneLabel(x,y,text,color,size){
  return `<text x="${x}" y="${y}" text-anchor="middle" fill="${color}"
    font-size="${size||11.5}" font-weight="600" paint-order="stroke"
    stroke="#08111c" stroke-width="4" stroke-linejoin="round"
    class="label">${text}</text>`;
}

        +(beltShift(S.season)>=0?"+":"")+beltShift(S.season).toFixed(1)+"°。移动幅度约 5—10 个纬度，滞后太阳直射点约一个月。",
      result:"气压带风带南北移动，导致同一地区不同季节受不同环流控制，形成季风与气候的季节变化。",
      tips:["season","cut","trade"]
    };
  },
  landsea:function(){
    const summer=isSummer();
    return {
      title:"海陆修正 · 带状变块状",
      sub:summer?"7 月（夏季）":"1 月（冬季）",
      pattern:summer
        ?"夏季大陆升温快，形成热低压，切断副热带高压带；海洋上保留夏威夷高压、亚速尔高压等高压中心。"
        :"冬季大陆降温快，形成冷高压，切断副极地低压带；海洋上保留阿留申低压、冰岛低压等低压中心。",
      result:"南半球海洋占优，气压带仍基本呈带状；北半球海陆相间，气压带被切断成块状。",
      tips:["cut","subhigh","trade"]
    };
  },
  monsoon:function(){
    const summer=isSummer();
    return {
      title:"季风环流",
      sub:summer?"夏季风":"冬季风",
      pattern:summer
        ?"东亚：海陆热力差异主导，盛行东南季风；南亚：南半球东南信风随气压带北移越过赤道，受北半球地转偏向力右偏成西南季风。"
        :"东亚：亚洲高压与太平洋之间形成西北季风；南亚：受亚洲高压影响盛行东北季风。",
      result:S.plateauOn
        ?"青藏高原夏季为热低压、冬季为冷高压，高原季风与东亚、南亚季风叠加，使亚洲季风更加强盛；地形阻挡也有动力影响。"
        :"亚洲季风以海陆热力差异为基础，南亚夏季风还依赖气压带风带的季节移动。",
      tips:["cross","plateau","cut"]
    };
  },
  climate:function(){
    return {
      title:"气候落地",
      sub:"环流控制 → 气候类型",
      pattern:"终年赤道低压→热带雨林；赤道低压与信风交替→热带草原；副高或信风控制→热带沙漠；副高与西风交替→地中海气候；终年西风→温带海洋性气候。",
      result:"信风并非一律干燥：大陆东岸信风迎风坡受地形抬升可形成热带雨林气候；大陆西岸和内部信风控制多干燥。",
      tips:["trade","subhigh","season"]
    };
  }
};

/* ================= 14. 易错点弹窗 ================= */
const TIPS={
  thermal:{t:"近地面与高空气压性质相反",
    b:"<p>近地面受热处空气上升，形成低气压；同一地点高空空气堆积，形成高气压。冷却处相反。</p><p class='warn'>易错：不要把高低空的气压性质画成相同；风总是由高压流向低压。</p>"},
  subhigh:{t:"副高成因：动力型，不是冷却下沉",
    b:"<p>赤道高空气流向极地运动，受地转偏向力影响不断偏转，到 30°附近已偏成西风，空气无法继续北流而堆积、下沉，形成副热带高压带。</p><p class='warn'>易错：副高不是“冷却下沉”。赤道低压带、极地高压带才是热力型；副热带高压带、副极地低压带是动力型。</p>"},
  season:{t:"季节移动幅度：约 5—10 个纬度",
    b:"<p>气压带风带随太阳直射点南北移动，但移动幅度只有约 5—10 个纬度，并不是 23.5°；而且气压带位置滞后太阳直射点约一个月。</p><p class='warn'>易错：不要认为气压带跟着直射点同步、同幅移动。</p>"},
  cut:{t:"海陆切断对象不能混淆",
    b:"<p>夏季：大陆热低压切断<b>副热带高压带</b>；冬季：大陆冷高压切断<b>副极地低压带</b>。</p><p>被切断的气压带在海洋上空以残影保留，如夏威夷高压、亚速尔高压、阿留申低压、冰岛低压。</p><p class='warn'>易错：南半球海洋占优，气压带仍基本呈带状。</p>"},
  trade:{t:"信风并非一律干燥",
    b:"<p>大陆东岸信风迎风坡受地形抬升，多地形雨，可形成热带雨林气候；大陆西岸和内部受信风控制或处于背风侧，多干燥。</p><p class='warn'>易错：不能把“信风控制”直接等同于“干旱”。</p>"},
  ferrel:{t:"费雷尔环流是间接环流",
    b:"<p>中纬环流在 30°下沉、60°上升，与直接热力环流方向相反，属于间接环流（逆环流）。</p><p>它依赖低纬哈得来环流和高纬极地环流的机械驱动，不是单纯热力直接驱动。</p>"},
  polarfront:{t:"极锋：60°附近的锋面",
    b:"<p>60°附近，暖而轻的盛行西风沿冷而重的极地气流爬升，形成极锋。</p><p>极锋是温带气旋和锋面雨带的重要机制，也是中纬地区降水丰富的重要原因。</p><svg class='tip-svg' viewBox='0 0 420 150'><rect width='420' height='150' fill='#08131f'/><path d='M25,120 L395,120' stroke='#39536b'/><path d='M25,35 L395,35' stroke='#39536b' stroke-dasharray='4 6'/><path d='M60,118 C120,95 170,62 235,50 C300,40 345,70 385,105' fill='none' stroke='#ff9a8a' stroke-width='5' opacity='.85'/><path d='M60,118 C90,80 130,55 175,45' fill='none' stroke='#8fc0ff' stroke-width='3' opacity='.8'/><text x='95' y='92' fill='#ff9a8a' font-size='12'>暖西风</text><text x='95' y='132' fill='#8fc0ff' font-size='12'>冷极地空气</text><text x='300' y='90' fill='#ffd873' font-size='12'>抬升 → 云雨</text></svg><p class='warn'>易错：极锋不是“冷空气下沉形成的锋”，而是暖空气被迫抬升。</p>"},
  cross:{t:"南亚夏季西南风的路径",
    b:"<p>南半球东南信风随气压带北移越过赤道，进入北半球后受地转偏向力向右偏转，转为西南季风，影响南亚。</p><p class='warn'>易错：西南季风不是北半球本地信风，而是南半球东南信风越赤道右偏形成。</p>"},
  plateau:{t:"青藏高原的叠加作用",
    b:"<p>高原面与周围同高度自由大气存在热力差异：夏季高原面形成热低压，冬季形成冷高压，形成高原季风。</p><p>高原季风与东亚、南亚季风叠加，使亚洲季风更加强盛；高原地形阻挡也有动力影响。</p>"},
  eqlow:{t:"赤道低压带：热力型",
    b:"<p>赤道地区终年受太阳直射或近直射，气温高，空气受热上升，近地面形成低压带。</p><p>它属于热力型气压带，与副热带高压带的动力成因不同。</p>"},
  sublow:{t:"副极地低压带：动力型",
    b:"<p>60°附近，来自低纬的暖西风与来自极地的冷空气相遇，暖空气被迫抬升，近地面形成低压带。</p><p>它属于动力型气压带，与极锋和温带气旋活动密切相关。</p>"},
  polarhigh:{t:"极地高压带：热力型",
    b:"<p>极地终年寒冷，空气冷却收缩下沉，近地面形成高压带。</p><p>它属于热力型气压带，与赤道低压带同属热力成因。</p>"}
};

/* ================= 15. 渲染调度 ================= */
function buildNav(){
  const nav=document.getElementById("moduleNav");
  nav.innerHTML=MODULES.map(function(m){
    return `<button class="mbtn" data-module="${m.id}">
      <span class="no">${m.n}</span>
      <span><span class="nm">${m.name}</span><span class="ds">${m.desc}</span></span>
    </button>`;
  }).join("");
}

function render(){
  pending=[];
  let svg="";

  switch(S.currentModule){
    case "thermal": svg=rThermal(); break;
    case "single":  svg=rSingle(); break;
    case "three":   svg=rThree(); break;
    case "belts":   svg=rBelts(); break;
    case "season":  svg=rSeason(); break;
    case "landsea": svg=rLandSea(); break;
    case "monsoon": svg=rMonsoon(); break;
    case "climate": svg=rClimate(); break;
    default: svg=rThermal();
  }

  stage.innerHTML=svg+
    '<g id="particleLayer"></g><g id="pathCache" style="visibility:hidden"></g>';

  stage.classList.toggle("hide-labels",!S.showLabels);
  stage.classList.toggle("paused",S.paused);
  stage.classList.toggle("focus30",S.focus30);

  finalizeStreams();
  updateFooter();
  syncControls();
  updateKnowledge();
  renderModuleControls();
}

let renderQueued=false;
function scheduleRender(){
  if(renderQueued)return;
  renderQueued=true;
  requestAnimationFrame(function(){
    renderQueued=false;
    render();
  });
}

function updateFooter(){
  const m=S.season;
  document.getElementById("monthVal").textContent=m.toFixed(1)+" 月";
  document.getElementById("declVal").textContent=fmtLat(declOf(m));
  const sh=beltShift(m);
  document.getElementById("shiftVal").textContent=(sh>=0?"+":"")+sh.toFixed(1)+"°";
  document.getElementById("month").value=m;
}

function updateKnowledge(){
  const mod=MODULES.filter(function(x){return x.id===S.currentModule;})[0];
  const info=KNOWLEDGE[S.currentModule]();
  const chips=info.tips.map(function(k){
    return `<button class="chip" data-tip="${k}">${CHIP_LABEL[k]||k}</button>`;
  }).join("");

  document.getElementById("know").innerHTML=`
    <div class="khead">
      <span class="kno">${mod.n}</span>
      <div><h2>${info.title}</h2><p class="ksub">${info.sub}</p></div>
    </div>
    <div class="kb"><h3>当前环流控制格局</h3><p>${info.pattern}</p></div>
    <div class="kb"><h3>气候 / 结果</h3><p>${info.result}</p></div>
    <div class="kstatus">${S.season.toFixed(1)} 月 · 地转偏向力 ${S.coriolisOn?"开":"关"} ·
      海陆 ${S.landSeaOn?"开":"关"} · 高原 ${S.plateauOn?"开":"关"} ·
      信风层 ${S.climateLayerOn?"开":"关"}</div>
    <div class="kb"><h3>易错提醒 · 点击查看</h3><div class="chips">${chips}</div></div>`;
}

function renderModuleControls(){
  const box=document.getElementById("moduleControls");
  let h="";

  switch(S.currentModule){
    case "thermal":
      h='<div class="grid2">'+Object.keys(TM).map(function(k){
        return `<button class="btn sm ${S.thermalMode===k?"active":""}" data-thermal="${k}">${TM[k].btn}</button>`;
      }).join("")+'</div><p class="hint">'+TM[S.thermalMode].hint+'</p>';
      break;
    case "single":
      h=`<button class="btn wide ${S.coriolisOn?"active":""}" data-toggle="coriolisOn">地转偏向力：${S.coriolisOn?"开":"关"}</button>
        <p class="hint">${S.coriolisOn?"观察单圈环流在 30°附近碎裂、重组为三圈环流。":"关闭时气流“直来直去”，形成单圈环流。"}</p>`;
      break;
    case "three":
      h=`<button class="btn wide ${S.focus30?"active":""}" data-action="focus30">30°堆积下沉 · 慢放高亮</button>
        <button class="btn wide" data-action="polarfront">极锋界面 · 展开说明</button>`;
      break;
    case "season":
      h='<p class="hint">拖动底部时间轴，观察气压带风带整体南北移动，以及太阳直射点参考线与气压带实际位置线的错位。</p>';
      break;
    case "landsea":
    case "monsoon":
      h=`<div class="grid2">
        <button class="btn sm ${isSummer()?"active":""}" data-month="7">7 月（夏）</button>
        <button class="btn sm ${!isSummer()?"active":""}" data-month="1">1 月（冬）</button></div>`;
      if(S.currentModule==="monsoon"){
        h+=`<button class="btn wide ${S.plateauOn?"active":""}" data-toggle="plateauOn">青藏高原热力叠加：${S.plateauOn?"开":"关"}</button>`;
      }
      break;
    case "climate":
      h=`<button class="btn wide ${S.climateLayerOn?"active":""}" data-toggle="climateLayerOn">气候带示意层：${S.climateLayerOn?"显示":"隐藏"}</button>`;
      break;
    default:
      h='<p class="hint">切换模块查看不同阶段。</p>';
  }
  box.innerHTML=h;
}

function syncControls(){
  document.querySelectorAll(".mbtn").forEach(function(b){
    b.classList.toggle("active",b.dataset.module===S.currentModule);
  });
  document.querySelectorAll(".switch[data-toggle]").forEach(function(b){
    b.classList.toggle("on",!!S[b.dataset.toggle]);
  });
  document.getElementById("btnPause").textContent=S.paused?"继续":"暂停";
  document.getElementById("btnPauseTop").textContent=S.paused?"继续":"暂停";
  document.getElementById("btnSlow").textContent="慢放 "+S.speed+"x";
  const lb=document.getElementById("btnLabels");
  lb.textContent="标注 "+(S.showLabels?"开":"关");
  lb.classList.toggle("active",S.showLabels);
}

/* ================= 16. 弹窗与交互 ================= */
function openTip(key){
  const t=TIPS[key];
  if(!t)return;
  document.getElementById("modalTitle").textContent=t.t;
  document.getElementById("modalBody").innerHTML=t.b;
  document.getElementById("modal").classList.add("open");
}
function closeTip(){
  document.getElementById("modal").classList.remove("open");
}

function handleAction(action){
  if(action==="polarfront"){
    openTip("polarfront");
  }else if(action==="focus30"){
    S.focus30=!S.focus30;
    if(S.focus30){S.speed=0.5;S.paused=false;}
    render();
  }
}

document.addEventListener("click",function(e){
  const tipEl=e.target.closest?e.target.closest("[data-tip]"):null;
  if(tipEl){openTip(tipEl.dataset.tip);return;}

  const actEl=e.target.closest?e.target.closest("[data-action]"):null;
  if(actEl){handleAction(actEl.dataset.action);return;}

  const togEl=e.target.closest?e.target.closest("[data-toggle]"):null;
  if(togEl){
    const k=togEl.dataset.toggle;
    S[k]=!S[k];
    render();
    return;
  }

  const thEl=e.target.closest?e.target.closest("[data-thermal]"):null;
  if(thEl){S.thermalMode=thEl.dataset.thermal;render();return;}

  const moEl=e.target.closest?e.target.closest("[data-month]"):null;
  if(moEl){S.season=parseFloat(moEl.dataset.month);render();return;}

  const navEl=e.target.closest?e.target.closest("[data-module]"):null;
  if(navEl){
    S.currentModule=navEl.dataset.module;
    S.focus30=false;
    render();
    closeDrawer();
  }
});

function closeDrawer(){
  document.getElementById("leftPanel").classList.remove("open");
  document.getElementById("backdrop").style.display="none";
}

document.getElementById("btnDrawer").addEventListener("click",function(){
  document.getElementById("leftPanel").classList.add("open");
  document.getElementById("backdrop").style.display="block";
});
document.getElementById("btnCloseDrawer").addEventListener("click",closeDrawer);
document.getElementById("backdrop").addEventListener("click",closeDrawer);

document.getElementById("btnPause").addEventListener("click",function(){
  S.paused=!S.paused;
  stage.classList.toggle("paused",S.paused);
  syncControls();
});
document.getElementById("btnPauseTop").addEventListener("click",function(){
  S.paused=!S.paused;
  stage.classList.toggle("paused",S.paused);
  syncControls();
});

document.getElementById("btnReset").addEventListener("click",function(){
  Object.assign(S,DEF);
  stage.classList.remove("paused","focus30");
  stage.classList.toggle("hide-labels",!S.showLabels);
  render();
});

document.getElementById("btnSlow").addEventListener("click",function(){
  const arr=[0.5,1,2];
  const i=arr.indexOf(S.speed);
  S.speed=arr[(i+1)%arr.length];
  syncControls();
});

document.getElementById("btnLabels").addEventListener("click",function(){
  S.showLabels=!S.showLabels;
  stage.classList.toggle("hide-labels",!S.showLabels);
  syncControls();
});

document.getElementById("month").addEventListener("input",function(e){
  S.season=parseFloat(e.target.value);
  updateFooter();
  scheduleRender();
});

document.getElementById("modalClose").addEventListener("click",closeTip);
document.getElementById("modal").addEventListener("click",function(e){
  if(e.target===this)closeTip();
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape")closeTip();
});

/* ================= 17. 动画循环与初始化 ================= */
function animationLoop(now){
  const dt=Math.min(60,now-lastT)/1000;
  lastT=now;
  if(!S.paused&&!document.hidden){
    animTime+=dt*S.speed;
  }
  updateParticles();
  requestAnimationFrame(animationLoop);
}

buildNav();
render();
requestAnimationFrame(animationLoop);

})();
</script>
